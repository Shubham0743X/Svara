<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Svara</title>
<style>
:root{--bg:#07070a;--panel:#0f0f15;--panel2:#16161e;--line:#232330;--tx:#f4f4f7;--dim:#9b9baa;--acc:#ff5c7a;--acc2:#a855f7;--grad:linear-gradient(135deg,#ff4d6d,#a855f7);--amb:255,92,122;--amb2:168,85,247}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden;display:flex}
button{background:none;border:none;color:var(--tx);cursor:pointer;font-family:inherit}
input{font-family:inherit}
img{display:block}
::-webkit-scrollbar{width:0;height:0}
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic svg .f{fill:currentColor;stroke:none}
#theme{position:fixed;inset:0;z-index:-1;background:#07070a;transition:opacity .55s ease;pointer-events:none}
/* sidebar */
#sb{width:236px;flex-shrink:0;background:rgba(15,15,21,.72);backdrop-filter:blur(8px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;z-index:5}
.logo{font-size:23px;font-weight:800;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#sb nav{margin-top:20px;display:flex;flex-direction:column;gap:2px}
.navit{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;font-size:14px;color:var(--dim);transition:.15s}
.navit .ic{width:20px;height:20px}
.navit:hover{color:var(--tx);background:var(--panel2)}
.navit.on{background:var(--panel2);color:var(--tx)}
.newpl{margin:14px 0 6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--dim);display:flex;align-items:center;gap:8px}
.newpl .ic{width:15px;height:15px}
.newpl:hover{border-color:var(--acc2);color:var(--tx)}
#plList{flex:1;overflow-y:auto;margin-top:6px}
#plList .sbt{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);padding:12px 12px 6px;opacity:.7}
.plrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:7px 12px;border-radius:9px;font-size:13.5px;color:var(--dim)}
.plrow .ic{width:18px;height:18px;color:var(--acc)}
.plrow:hover{background:var(--panel2);color:var(--tx)}
.plrow.on{color:var(--tx);background:var(--panel2)}
.plrow .cnt{margin-left:auto;font-size:11px;opacity:.6}
#app{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:14px 22px 8px;position:relative;z-index:4}
.srch{flex:1;max-width:560px;margin:0 auto;position:relative;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 5px 3px 14px;gap:8px;transition:border-color .2s}
.srch:focus-within{border-color:var(--acc2)}
.srch .ic{width:16px;height:16px;color:var(--dim)}
#q{flex:1;background:none;border:none;outline:none;color:var(--tx);padding:8px 2px;font-size:14px}
.gobtn{background:var(--grad);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;color:#fff}
.gobtn:hover{filter:brightness(1.12)}
.topr{display:flex;align-items:center;gap:2px;margin-left:auto}
.tic{padding:8px;border-radius:50%}
.tic:hover{background:var(--panel2)}
.tic .ic{width:18px;height:18px}
/* search history */
#shist{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden;z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:6px}
#shist .shlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--dim);padding:6px 12px 4px;opacity:.75}
#shist .shr{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;font-size:13.5px;color:var(--dim);text-align:left;border-radius:9px;line-height:1.2}
#shist .shr:hover{background:var(--panel);color:var(--tx)}
#shist .shr .ic{width:16px;height:16px;flex-shrink:0;opacity:.7}
#shist .shr .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shist .shr .x{color:var(--dim);padding:3px;border-radius:50%;display:inline-flex;flex-shrink:0;opacity:0;transition:opacity .15s}
#shist .shr:hover .x{opacity:1}
#shist .shr .x:hover{color:var(--tx);background:var(--panel2)}
#shist .shr .x .ic{width:13px;height:13px}
#shist .clear{width:100%;text-align:center;padding:9px;font-size:12px;color:var(--acc);border-top:1px solid var(--line);margin-top:4px;border-radius:8px}
#shist .clear:hover{background:var(--panel)}
/* content scroll */
#scroll{flex:1;overflow-y:auto;padding:4px 24px 130px}
.paget{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:10px 2px 4px;display:flex;align-items:center;gap:10px}
.paget .back{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--panel)}
.paget .back:hover{background:var(--panel2)}
.paget .back .ic{width:18px;height:18px}
.sub{font-size:13px;color:var(--dim);margin:0 2px 14px}
/* home sections */
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:13px;white-space:nowrap;color:var(--dim)}
.chip:hover{border-color:var(--acc2);color:var(--tx)}
.sec{margin-top:24px}
.sec h2{font-size:19px;font-weight:750;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec h2 .go{font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:500}
.sec h2 .go:hover{border-color:var(--tx);color:var(--tx)}
.railwrap{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.rail{width:150px;flex-shrink:0;cursor:pointer}
.art{position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:linear-gradient(145deg,#232330,#101016)}
.art img{width:100%;height:100%;object-fit:cover}
.art .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3a3a48}
.art .ph .ic{width:36px;height:36px}
.rail .ov{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;opacity:0;transition:.15s;background:linear-gradient(0deg,rgba(0,0,0,.35),transparent 55%)}
.rail:hover .ov{opacity:1}
.rail .ov .pb{width:34px;height:34px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.rail .ov .pb .ic{width:15px;height:15px;color:#fff}
.rail .ov .pb .ic svg{fill:#fff;stroke:none}
.rname{font-size:13px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub2{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
/* rows */
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:12px;padding:7px 8px;border-radius:11px;cursor:pointer}
.row:hover{background:var(--panel2)}
.row.cur{background:var(--panel2)}
.row .rt{position:relative;width:44px;height:44px;aspect-ratio:1;border-radius:8px;overflow:hidden;flex-shrink:0;background:linear-gradient(145deg,#232330,#101016)}
.row .rt img{width:100%;height:100%;object-fit:cover}
.row .rt .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);opacity:0;transition:.12s}
.row:hover .rt .ov,.row.cur .rt .ov{opacity:1}
.row .rt .ov .ic{width:18px;height:18px;color:#fff}
.row .rt .ov .ic svg{fill:#fff;stroke:none}
.rm{flex:1;min-width:0}
.rtitle{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .rtitle{color:var(--acc)}
.rsub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rr{display:flex;align-items:center;gap:2px;flex-shrink:0}
.likedH{width:18px;height:18px;color:var(--acc);display:inline-flex}
.likedH .ic{width:18px;height:18px}
.likedH svg{fill:var(--acc);stroke:none}
.dots{padding:7px;border-radius:50%;color:var(--dim)}
.dots:hover{color:var(--tx);background:var(--panel)}
.dots .ic{width:17px;height:17px}
.empty{color:var(--dim);font-size:13.5px;padding:30px 4px;line-height:1.7}
/* mini player */
#mini{position:fixed;left:236px;right:0;bottom:0;z-index:20;background:rgba(15,15,21,.88);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 20px}
#prog{position:absolute;top:-1px;left:0;right:0;height:2px;background:var(--line);cursor:pointer}
#progFill{height:100%;width:0%;background:var(--grad)}
.miniL{display:flex;align-items:center;gap:11px;flex:1;min-width:0;cursor:pointer}
.miniL .art{width:44px;height:44px;aspect-ratio:1;border-radius:9px;flex-shrink:0;border:1px solid var(--line)}
.miniL .art img{width:100%;height:100%;object-fit:cover}
.mt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniC{display:flex;align-items:center;gap:2px}
.mbtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.mbtn:hover{background:var(--panel2)}
.mbtn .ic{width:20px;height:20px}
.mbtn.main{background:var(--grad);width:42px;height:42px;box-shadow:0 4px 16px rgba(255,77,109,.35)}
.mbtn.main:hover{filter:brightness(1.12)}
.mbtn.on{color:var(--acc)}
.miniR{display:flex;align-items:center;gap:4px;flex-shrink:0}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc) var(--v,50%),#3a3a48 var(--v,50%));outline:none;width:90px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
/* player page */
#pv{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
body.pv #pv{display:flex}
body.pv #mini{display:none}
#pvArtBg{position:absolute;inset:0;filter:blur(90px) saturate(1.25);opacity:.3;background-size:cover;background-position:center;transform:scale(1.2);pointer-events:none}
.pvtop{display:flex;align-items:center;gap:12px;padding:14px 18px;position:relative;z-index:2}
.pvtop .ic{width:20px;height:20px}
.pvtop .ic svg{stroke-width:2.2}
.pvtitle{font-size:14px;font-weight:700;letter-spacing:.2px}
.pvbody{flex:1;display:flex;gap:26px;padding:4px 30px 34px;min-height:0;position:relative;z-index:2}
.pvleft{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.pvArt{width:min(46vh,420px);aspect-ratio:1;border-radius:20px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.6);background:linear-gradient(145deg,#232330,#101016)}
.pvArt img{width:100%;height:100%;object-fit:cover}
.pvmeta{text-align:center;margin-top:22px;max-width:520px}
.pvT{font-size:23px;font-weight:800;letter-spacing:-.3px}
.pvA{font-size:14px;color:var(--dim);margin-top:5px}
.pvacts{display:flex;gap:8px;justify-content:center;margin-top:14px}
.pact{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.pact:hover{background:var(--panel2);color:var(--tx)}
.pact .ic{width:19px;height:19px}
.pact.on{color:var(--acc)}
.pact.on svg{fill:var(--acc);stroke:none}
.pvctrl{width:min(640px,94%);margin-top:22px}
.pseek{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--grad) var(--v,0%),#3a3a48 var(--v,0%));outline:none;cursor:pointer}
.pseek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
.ptimes{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin:5px 2px 0}
.pbtns{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px}
.pbtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.pbtn:hover{background:var(--panel2)}
.pbtn .ic{width:21px;height:21px}
.pbtn.big{width:52px;height:52px}
.pbtn.big .ic{width:26px;height:26px}
.pbtn.on{color:var(--acc)}
#pvPlay{background:var(--grad);box-shadow:0 6px 22px rgba(255,77,109,.35)}
#pvPlay:hover{filter:brightness(1.1)}
.pvright{width:340px;flex-shrink:0;background:rgba(15,15,21,.5);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0}
.tabrow{display:flex;padding:0 6px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:13px 8px 11px;font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;border-radius:0}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);border-bottom-color:var(--acc)}
.tabrow{display:flex;padding:0 6px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:13px 8px 11px;font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;border-radius:0}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);border-bottom-color:var(--acc)}
.pvctx{padding:8px 16px 4px;font-size:12px;color:var(--dim)}
.pvhead{display:flex;align-items:center;padding:8px 14px 6px}
.pvhead .go{font-size:12px;color:var(--dim);margin-left:auto}
.pvhead .go:hover{color:var(--acc)}
#pvQueue{flex:1;overflow-y:auto;padding:4px 8px 10px}
#pvLyrics{flex:1;overflow-y:auto;padding:10px 16px}
.lyrseg{display:flex;gap:6px;background:var(--panel);border-radius:999px;padding:3px;margin-bottom:12px}
.lyrseg button{flex:1;padding:6px 8px;border-radius:999px;font-size:12px;color:var(--dim)}
.lyrseg button.on{background:var(--panel2);color:var(--tx)}
#lyrBody{font-size:14.5px;line-height:1.85;color:var(--dim);white-space:pre-wrap}
#lyrBody .l{transition:color .15s}
#lyrBody .l.on{color:#fff;font-weight:700}
.lyrmissing{color:var(--dim);font-size:13.5px;padding:20px 0;line-height:1.8}
.lyrt{font-size:14px;font-weight:700;margin:4px 2px 12px;color:var(--tx)}
.lyrt span{display:block;font-size:11.5px;color:var(--dim);font-weight:500;margin-top:2px}
.lyrt{font-size:14px;font-weight:700;margin:4px 2px 12px;color:var(--tx)}
.lyrt span{display:block;font-size:11.5px;color:var(--dim);font-weight:500;margin-top:2px}
.lyrt{font-size:14px;font-weight:700;margin:4px 2px 12px;color:var(--tx)}
.lyrt span{display:block;font-size:11.5px;color:var(--dim);font-weight:500;margin-top:2px}
.lyrt{font-size:14px;font-weight:700;margin:4px 2px 12px;color:var(--tx)}
.lyrt span{display:block;font-size:11.5px;color:var(--dim);font-weight:500;margin-top:2px}
/* floating menu + modal */
#menu{position:fixed;z-index:90;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:5px;min-width:190px;box-shadow:0 16px 50px rgba(0,0,0,.55)}
#menu .mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:13.5px;color:var(--tx)}
#menu .mi:hover{background:var(--panel)}
#menu .mi.dim{color:var(--dim)}
#menu .mi .ic{width:16px;height:16px}
#menu .sep{height:1px;background:var(--line);margin:4px 6px}
#modal{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
#modal.show{display:flex}
.modal{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(420px,90%);max-height:80vh;overflow-y:auto}
.modal h3{font-size:17px;margin-bottom:12px}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px;color:var(--tx)}
.mrow:hover{background:var(--panel)}
.mrow .ic{width:16px;height:16px;color:var(--acc)}
.np{display:flex;gap:8px;margin-top:10px}
.np input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--tx);outline:none}
.np input:focus{border-color:var(--acc2)}
.np button{background:var(--grad);color:#fff;font-weight:700;border-radius:9px;padding:8px 14px;font-size:13px}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#fff;color:#111;font-size:13px;font-weight:600;padding:9px 18px;border-radius:999px;z-index:120;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1}
#pvFab{position:fixed;right:22px;bottom:76px;z-index:75;width:46px;height:46px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.5);transition:bottom .3s}
#pvFab:hover{background:var(--panel)}
#pvFab .ic{width:20px;height:20px;transition:transform .3s}
#pvFab.up .ic{transform:rotate(180deg)}
body.pv #pvFab{bottom:22px}
@media (max-width:920px){.pvright{width:290px}}
</style>
</head>

<script>
/* ============ helpers & storage ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=id=>`<svg><use href="#${id}"/></svg>`;
function LSget(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function LSset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let hist=LSget('ml_history',{});          // your listening history (kept from before)
let favs=LSget('sv_favs',{});
let pls=LSget('sv_pls',{});
let shist=LSget('sv_shist',[]);
let lyrPref=LSget('sv_lyr','ytm');
const idItem={};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function saveAll(){LSset('sv_favs',favs);LSset('sv_pls',pls);LSset('sv_shist',shist);LSset('sv_lyr',lyrPref)}
function register(arr){(arr||[]).forEach(it=>{if(it&&it.id)idItem[it.id]=it})}

/* ============ state ============ */
const audio=$('#audio');
let queue=[],seq=[],cur=-1;           // seq = play order as queue indexes
let repeat='off',shuffle=false,volume=80,wasVol=80;
let curList=[],quickList=[],curPage='home';        // curList = list rows in main area; quickList = Home Quick picks
let lyr={plain:'',synced:'',cur:-1,timer:null,loadedFor:null};

/* ============ nav / views ============ */
const pgTitle=$('#pgTitle'),pgSub=$('#pgSub');
function setNav(on){
  document.querySelectorAll('.navit').forEach(b=>b.classList.toggle('on',b.dataset.nav===on));
}
function goHome(){curPage='home';curList=[];setNav('home');$('#dynSec').hidden=true;$('#homeSec').hidden=false;pgTitle.hidden=true;pgSub.hidden=true;renderHome();updatePlRows();}
function showDyn(title,sub,html){curPage='dyn';$('#homeSec').hidden=true;$('#dynSec').hidden=false;pgTitle.hidden=false;pgSub.hidden=false;pgTitle.innerHTML=title;pgSub.textContent=sub||'';$('#dynSec').innerHTML=html;setNav(null);updatePlRows();}

/* ============ sidebar playlists ============ */
function updatePlRows(){
  const names=Object.keys(pls);
  const likedN=Object.keys(favs).length;
  let h=`<div class="sbt">Your library</div>
  <button class="plrow ${curPage==='lib'?'on':''}" data-lib="liked"><span class="ic">${ic('i-heart')}</span>Liked music<span class="cnt">${likedN}</span></button>`;
  names.forEach(n=>{h+=`<button class="plrow" data-lib="pl:${esc(n)}"><span class="ic">${ic('i-list')}</span>${esc(n)}<span class="cnt">${pls[n].length}</span></button>`});
  $('#plList').innerHTML=h+'<div class="sbt" style="opacity:.35">Library opens here</div>';
}
function openLiked(){const items=Object.values(favs).filter(x=>x&&x.id);if(!items.length){toast('No liked songs yet — tap the ♥');return}showDyn('Liked music',items.length+' songs',listHTML(items));curList=items;register(items);}
function openPl(name){const items=pls[name]||[];if(!items.length){toast('Playlist is empty');return}showDyn(esc(name),items.length+' songs · '+esc('click ⋮ to remove'),listHTML(items));curList=items;register(items);}

/* ============ rows & rails ============ */
function thumb(it){
  let u=(it&&it.thumb)||'';
  if(!u)return '';
  const i=u.indexOf('=w');
  if(i>0)u=u.slice(0,i)+'=w544-h544-l90-rj';
  return u;
}
function subOf(it){return it.duration?`${it.artist} • ${it.duration}`:(it.artist||'')}
function rowHTML(it){
  const cur=nowItem()&&nowItem().id===it.id;
  return `<div class="row ${cur?'cur':''}" data-play="1" data-id="${esc(it.id)}">
    <div class="rt"><img loading="lazy" src="${esc(thumb(it))}" onerror="this.style.display='none'">
      <div class="ov"><span class="ic">${ic('i-play')}</span></div></div>
    <div class="rm"><div class="rtitle">${esc(it.title)}</div><div class="rsub">${esc(subOf(it))}</div></div>
    <div class="rr">${favs[it.id]?`<span class="likedH">${ic('i-heart')}</span>`:''}
    <button class="dots" data-menu="${esc(it.id)}"><span class="ic">${ic('i-dots')}</span></button></div></div>`;
}
function listHTML(items){return `<div class="list">${(items||[]).map(rowHTML).join('')}</div>`}
function railCard(it,ctx){
  const cur=nowItem()&&nowItem().id===it.id;
  const ph=thumb(it)?'':`<div class="ph"><span class="ic">${ic('i-disc')}</span></div>`;
  return `<div class="rail" data-rail="${ctx}" data-id="${esc(it.id)}" data-title="${esc(it.title||'')}">
    <div class="art">${ph}<img loading="lazy" src="${esc(thumb(it))}" onerror="this.style.display='none'">
      <div class="ov"><span class="pb">${ic('i-play')}</span></div></div>
    <div class="rname">${esc(it.title)}</div><div class="rsub2">${esc(it.artist||'')}</div></div>`;
}
function railHTML(arr,ctx){return `<div class="railwrap">${arr.map(x=>railCard(x,ctx)).join('')}</div>`}

/* ============ personalization core ============ */
function splitArtists(a){return String(a||'').split(/[,&×;]|\bfeat\.?/i).map(s=>s.trim()).filter(s=>s&&!/^feat/i.test(s))}
function topArtists(n){
  const m={};
  Object.values(hist).forEach(h=>{if(h&&h.artist){splitArtists(h.artist).slice(0,2).forEach(x=>{m[x]=(m[x]||0)+h.count})}});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n||3).map(x=>x[0]);
}
function topRecent(n){return Object.values(hist).sort((a,b)=>b.last-a.last).slice(0,n||12)}
function topScored(n){
  const now=Date.now();
  return Object.values(hist).map(h=>{const rec=Math.max(0,1-(now-h.last)/ (14*864e5));const c=Math.min(1,h.count/20);return{h,s:c*.7+rec*.3}})
    .sort((a,b)=>b.s-a.s).slice(0,n||12).map(x=>x.h);
}
function notePlay(it){
  if(!it||!it.id)return;
  const e=hist[it.id]||{id:it.id};
  e.title=it.title;e.artist=it.artist||'';if(it.thumb)e.thumb=it.thumb;
  e.count=(e.count||0)+1;e.last=Date.now();hist[it.id]=e;
  const keys=Object.keys(hist).sort((a,b)=>hist[b].last-hist[a].last);
  if(keys.length>400){const nh={};keys.slice(0,400).forEach(k=>nh[k]=hist[k]);hist=nh}
  LSset('ml_history',hist);
}

/* ============ home sections ============ */
async function renderHome(){
  const sec=$('#homeSec');
  const recent=topRecent(12),scored=topScored(10),arts=topArtists(3);
  let h=`<div class="chips">${['Energize','Party','Relax','Sad','Focus','Workout'].map(m=>`<button class="chip" data-chip="${m}">${m}</button>`).join('')}</div>`;
  const none=!Object.keys(hist).length;
  quickList=scored;
  if(!none){
    if(recent.length)h+=`<div class="sec"><h2>Listen again</h2>${railHTML(recent,'la')}</div>`;
    h+=`<div class="sec"><h2>Quick picks<button class="go" data-qp="1">Play all</button></h2>${listHTML(quickList)}</div>`;
    if(arts.length)h+=`<div class="sec"><h2>Albums for you</h2><div class="railwrap" id="albRail"><div class="empty">Loading your albums…</div></div></div>`;
    h+=`<div class="sec"><h2>Surprise me<button class="go" id="diceBig">🎲 Play a radio from your taste</button></h2><div class="empty" style="padding:6px 2px">Your radio never jumps between languages — it seeds from what you listen to most.</div></div>`;
  }else{
    h+=`<div class="sec"><h2>Welcome to Svara</h2><div class="empty">Search any song and press play.<br>After a few songs, Home fills with <b>Listen again</b>, <b>Quick picks</b> and <b>Albums for you</b> — all from your taste.</div></div>`;
    h+=`<div class="sec"><h2>Popular right now</h2><div id="startRail"><div class="empty">Loading…</div></div></div>`;
  }
  sec.innerHTML=h;
  // background starter content for empty profile
  if(none){try{const r=await fetch('/api/search?q=trending');const j=await r.json();const it=(j.items||[]).slice(0,12);$('#startRail').innerHTML=railHTML(it,'start');}catch(e){$('#startRail').innerHTML=''}}
  // albums for you
  if(!none&&arts.length){
    try{
      let cards='';
      for(const a of arts){
        try{
          const r=await fetch('/api/search?q='+encodeURIComponent(a)+'&type=album');
          const j=await r.json();
          (j.items||[]).slice(0,4).forEach(al=>{cards+=railCard(al,'al')});
        }catch(e){/* skip artist */}
      }
      $('#albRail').innerHTML=cards?`<div class="railwrap">${cards}</div>`:'<div class="empty">No albums found yet — keep listening and this fills with your artists’ albums.</div>';
    }catch(e){$('#albRail').innerHTML='<div class="empty">Could not load albums right now.</div>'}
  }
}

/* ============ playback ============ */
function nowItem(){return cur>=0&&seq[cur]!=null&&queue[seq[cur]]?queue[seq[cur]]:null}
function setNowUI(it){
  const art=thumb(it);
  $('#mTitle').textContent=it.title;$('#mSub').textContent=it.artist||'';
  $('#pvT').textContent=it.title;$('#pvA').textContent=it.artist||'';
  const ma=$('#mArt'),pa=$('#pvImg');
  if(art){ma.src=art;ma.style.display='';pa.src=art;$('#pvArtBg').style.backgroundImage=`url("${art}")`;$('#mArtPh').style.display='none'}
  else{ma.style.display='none';pa.removeAttribute('src');$('#pvArtBg').style.backgroundImage='';$('#mArtPh').style.display='flex'}
  $('#pvCtx').textContent=queue.length?`Playing from ${queue[seq[cur]]?.artist||'your queue'}`:'';
  paintFavs();setTheme(art);resetLyrics();
}
function loadAt(seqPos,autoplay=true){
  if(!queue.length)return;
  if(seqPos<0||seqPos>=seq.length)return;
  cur=seqPos;const it=queue[seq[cur]];if(!it)return;
  audio.src='/api/stream?id='+it.id;
  setNowUI(it);
  if(autoplay)audio.play().catch(()=>{});
  renderQueue();paintRowCursor();
}
function playList(list,idx,openPv){
  if(!list||!list.length)return;
  queue=list.slice();register(queue);
  const n=queue.length;const rest=[...Array(n).keys()].filter(i=>i!==idx);
  if(shuffle){for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}}
  seq=[idx,...rest];cur=-1;
  loadAt(0,true);
  if(openPv)openPV();
}
function syncSeq(keepId){
  if(!queue.length){seq=[];cur=-1;return}
  let c=-1;
  if(keepId)c=queue.findIndex(x=>x.id===keepId);
  if(c<0)c=Math.max(0,queue.findIndex(x=>x.id===(nowItem()?.id)));
  if(c<0)c=0;
  const rest=[...Array(queue.length).keys()].filter(i=>i!==c);
  if(shuffle){for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}}
  seq=[c,...rest];cur=0;
}
function togglePlay(){const it=nowItem();if(!it){if(curList.length)return playList(curList,0,false);return}
  if(audio.paused)audio.play();else audio.pause()}
function nextTrack(manual){
  if(!queue.length)return;
  if(cur+1<seq.length){loadAt(cur+1);return}
  if(manual||repeat!=='off'){loadAt(0)}
  else audio.pause();
}
function prevTrack(){
  if(!queue.length)return;
  if(audio.currentTime>3){audio.currentTime=0;return}
  loadAt(cur>0?cur-1:0);
}
function toggleShuffle(){
  shuffle=!shuffle;
  const id=nowItem()?.id;
  syncSeq(id);
  paintControls();renderQueue();
  toast(shuffle?'Shuffle on':'Shuffle off');
}

async function downloadTrack(it){

  try{

    if(!r.ok){const j=await r.json().catch(()=>null);throw new Error(j?.error||'download failed')}
    const blob=await r.blob();
    const a=document.createElement('a');

    a.download=(it.title||'track').replace(/[\\/:*?"<>|]/g,'')+'.m4a';

    setTimeout(()=>URL.revokeObjectURL(a.href),4000);

}

async function loadLyrics(){
  const it=nowItem();if(!it)return;
  const p=lyrPref;
  const lt=$('#lyrT');if(lt)lt.innerHTML=esc(it.title)+'<span>'+esc(it.artist||'')+'</span>';
  lyr.loadedFor=it.id+':'+p;

  const qs=p==='ytm'
    ?'/api/lyrics?provider=ytm&id='+encodeURIComponent(it.id)
    :'/api/lyrics?provider=lrclib&id='+encodeURIComponent(it.id)+'&title='+encodeURIComponent(it.title)+'&artist='+encodeURIComponent(it.artist||'')+'&duration='+Math.round(audio.duration||0);
  try{
    const r=await fetch(qs);const j=await r.json();
    if(j.error){
      // auto fallback ytm -> lrclib
      if(p==='ytm'&&lyrPref==='ytm'){
        lyrPref='lrclib';saveAll();$('#lYT').classList.remove('on');$('#lLR').classList.add('on');
        lyr.loadedFor=null;loadLyrics();return;
      }
      $('#lyrBody').innerHTML=`<div class="lyrmissing">${esc(j.error)}<br><br>Tip: switch provider above or try another track.</div>`;
      return;
    }
    lyr.plain=j.plain||'';lyr.synced=j.synced||'';lyr.cur=-1;
    renderLyricsBody();
  }catch(e){$('#lyrBody').innerHTML='<div class="lyrmissing">Lyrics failed to load.</div>'}
}
function renderLyricsState(){
  const body=$('#lyrBody');
  if(!body)return;
  const it=nowItem();
  if(!it){body.innerHTML='<div class="lyrmissing">Nothing playing.</div>';return}
  body.innerHTML='<div class="lyrmissing">Loading lyrics…</div>';
}
function renderLyricsBody(){
  const body=$('#lyrBody');
  if(!body)return;
  clearInterval(lyr.timer);lyr.timer=null;
  const it=nowItem();
  if(!it){body.innerHTML='<div class="lyrmissing">Nothing playing.</div>';return}
  if(lyr.synced){
    const lines=parseLrc(lyr.synced);
    if(lines.length){
      body.innerHTML=lines.map((_,i)=>`<div class="l" id="l${i}"></div>`).join('');
      lyr.cur=-1;
      const paint=()=>{
        const t=audio.currentTime||0;
        let idx=lines.length-1;for(let i=0;i<lines.length;i++){if(t>=lines[i].t)idx=i;else break}
        if(idx!==lyr.cur){
          if(lyr.cur>=0)body.children[lyr.cur]?.classList.remove('on');
          lyr.cur=idx;
          const el=body.children[idx];if(el){el.classList.add('on');el.textContent=lines[idx].x;if(el.scrollIntoView)el.scrollIntoView({block:'center',behavior:'smooth'})}
        }
      };
      paint();
      lyr.timer=setInterval(()=>{if(!$('#pv').classList.contains?true:document.body.classList.contains('pv'))paint()},500);
      body.style.whiteSpace='';
      return;
    }
  }
  body.innerHTML=lyr.plain
    ?lyr.plain.split('\n').map(l=>`<div class="l">${esc(l)||'&nbsp;'}</div>`).join('')
    :'<div class="lyrmissing">No lyrics found for this track.</div>';
}
function parseLrc(s){
  const out=[];
  (s||'').split('\n').forEach(line=>{
    const re=/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]\s*(.*)/;
    let m=re.exec(line),off=0;
    while(m){
      let ms=m[3]?+(m[3].length===2?m[3]+'0':m[3].padEnd(3,'0')):0;
      out.push({t:(+m[1])*60+(+m[2])+ms/1000,x:m[4]});
      off=m[0].length;
      const rest=line.slice(off);m=re.exec(rest);if(!rest)break;
      if(!m)break;
    }
  });
  return out;
}

/* ============ theme ============ */
function setTheme(url){
  if(!url)return;
  const im=new Image();
  im.onload=()=>{
    try{
      const c=document.createElement('canvas');c.width=c.height=40;
      const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,40,40);
      const d=x.getImageData(0,0,40,40).data;
      const b={};for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const k=((d[i]>>4)<<8)|((d[i+1]>>4)<<4)|(d[i+2]>>4);b[k]=(b[k]||0)+1}
      const s=Object.entries(b).sort((a,b)=>b[1]-a[1]);if(!s.length)return;
      const k1=+s[0][0];const c1=[(k1>>8)<<4,((k1>>4)&15)<<4,(k1&15)<<4];
      let c2=null;
      for(let i=1;i<s.length;i++){const k=+s[i][0];const cc=[(k>>8)<<4,((k>>4)&15)<<4,(k&15)<<4];if(Math.abs(cc[0]-c1[0])+Math.abs(cc[1]-c1[1])+Math.abs(cc[2]-c1[2])>90){c2=cc;break}}
      if(!c2)c2=c1.map(v=>Math.round(v*.65));
      const dr=(c,f)=>c.map(v=>Math.min(255,Math.round(v*f)));
      const rs=document.documentElement.style;
      rs.setProperty('--amb',dr(c1,.62).join(','));
      rs.setProperty('--amb2',dr(c2,.5).join(','));
      const th=$('#theme');
      th.style.opacity=0;
      requestAnimationFrame(()=>{
        th.style.background=`radial-gradient(1100px 760px at 16% -6%, rgba(var(--amb),.34), transparent 62%),radial-gradient(900px 700px at 112% 12%, rgba(var(--amb2),.28), transparent 55%),radial-gradient(1200px 900px at 50% 128%, rgba(var(--amb),.16), transparent 60%)`;
        th.style.opacity=1;
      });
    }catch(e){}
  };
  im.onerror=()=>{};
  im.src='/api/thumb?url='+encodeURIComponent(url);
}

/* tabs */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  const lyrOn=t.dataset.tab==='lyr';
  $('#pvLyrics').hidden=!lyrOn;$('#pvQueue').hidden=lyrOn;$('#pvHead').hidden=lyrOn;$('#pvCtx').hidden=lyrOn;
  if(lyrOn){ensureLyricsUI();if(!lyr.loadedFor)loadLyrics()}
});
/* lyrics provider seg (built on first open of lyrics) */
function ensureLyricsUI(){
  if($('#lyrSeg'))return;
  $('#pvLyrics').innerHTML=`<div class="lyrt" id="lyrT"></div>
    <div class="lyrseg" id="lyrSeg">
    <button id="lYT" class="${lyrPref==='ytm'?'on':''}">YouTube Music</button>

    <div id="lyrBody"></div>`;
  $('#lYT').onclick=()=>{lyrPref='ytm';saveAll();$('#lYT').classList.add('on');$('#lLR').classList.remove('on');resetLyrics();loadLyrics()};
  $('#lLR').onclick=()=>{lyrPref='lrclib';saveAll();$('#lLR').classList.add('on');$('#lYT').classList.remove('on');resetLyrics();loadLyrics()};
}
/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Escape')e.target.blur();return}
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  if(e.code==='ArrowRight')audio.currentTime=Math.min(audio.duration||0,(audio.currentTime||0)+5);
  if(e.code==='ArrowLeft')audio.currentTime=Math.max(0,(audio.currentTime||0)-5);
  if(e.key==='Escape'){hideMenu();closeModal();if(document.body.classList.contains('pv'))closePV()}
});

/* 3) fill + hover preview + duration + volume (#19 #18 #33) */
var psFill=$('#psFill'), psGhost=$('#psGhost'), psTip=$('#psTip'), psWrap=$('#pseekWrap');

  psWrap.addEventListener('mousemove',function(e){

    var r=psWrap.getBoundingClientRect();

/* 4) true album-art theming (#2) with a race guard (#40) */
var themeToken=0, themeRaf=0, themeCur={acc:[255,92,122],acc2:[168,85,247],accTx:[255,143,163]};
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2,d=mx-mn;

  var t0=performance.now(),D=520;

setTheme=function(url){
  var token=++themeToken;

/* 6) queue: play next / add / remove (#13 #14 #15 #30) */
insertNext=function(it){
  if(!it)return;
  var curIt=nowItem();
  if(curIt&&curIt.id===it.id){toast('Already playing');return}
  var qi=queue.findIndex(function(x){return x.id===it.id});
  if(qi<0){queue.push(it);register([it]);qi=queue.length-1}
  seq=seq.filter(function(s){return s!==qi});
  if(cur<0||!curIt){seq.unshift(qi);cur=0;loadAt(0,true)}
  else{
    var ci=queue.findIndex(function(x){return x.id===curIt.id});
    var at=seq.indexOf(ci);
    seq.splice(at<0?seq.length:at+1,0,qi);
    cur=seq.indexOf(ci);
  }
  renderQueue();toast('Playing next');
};
addQueue=function(it){
  if(!it)return;
  if(queue.findIndex(function(x){return x.id===it.id})>=0){toast('Already in queue');return}
  register([it]);
  var wasEmpty=!queue.length;
  queue.push(it);
  if(wasEmpty){seq=[0];cur=0;loadAt(0,true)}
  else seq.push(queue.length-1);
  renderQueue();
  toast(wasEmpty?'Playing':'Added to queue');
};
removeFromQueue=function(id){
  var curIt=nowItem(), curId=curIt?curIt.id:null;
  var qi=queue.findIndex(function(x){return x.id===id}); if(qi<0)return;
  var wasCur=curId===id;
  queue.splice(qi,1);
  if(!queue.length){seq=[];cur=-1;audio.pause();audio.removeAttribute('src');$('#mTitle').textContent='Nothing playing';$('#mSub').textContent='';paintControls();renderQueue();return}
  if(wasCur){seq=[];for(var i=0;i<queue.length;i++)seq.push(i);cur=0;loadAt(0,true);renderQueue();toast('Removed from queue');return}
  seq=seq.filter(function(s){return s!==qi}).map(function(s){return s>qi?s-1:s});
  var ci=queue.findIndex(function(x){return x.id===curId});
  cur=seq.indexOf(ci);
  if(cur<0){seq.unshift(ci);cur=0}
  renderQueue();toast('Removed from queue');
};

/* 8) lyrics: sync + click-to-seek + big view + fullscreen (#25 #26 #27) */
var lyrToken=0, lyrAuto=true, lyrAutoT=null;
function parseLrc2(s){
  var out=[];
  String(s||'').split('\n').forEach(function(line){
    var tags=line.match(/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g);
    if(!tags)return;
    var text=line.replace(/\[[^\]]*\]/g,'').trim();
    tags.forEach(function(tag){
      var m=tag.match(/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/); if(!m)return;
      var frac=m[3]||'';
      var ms=frac?(frac.length===1?+frac*100:frac.length===2?+frac*10:+frac):0;
      out.push({t:(+m[1])*60+(+m[2])+ms/1000,x:text});
    });
  });
  out.sort(function(a,b){return a.t-b.t});
  return out;
}
function paintLyrChip(){
  var a=$('#lYT'), b=$('#lLR'); if(!a||!b)return;
  a.classList.toggle('on',lyrPref==='ytm');
  b.classList.toggle('on',lyrPref==='lrclib');
}
function ensureLyricsUI(){
  var host=$('#pvLyrics'); if(!host||$('#lyrBar'))return;
  host.innerHTML='<div class="lyrbar" id="lyrBar"><div class="lyrt" id="lyrT"></div>'+
    '<div class="lyrchip" id="lyrSeg"><button id="lYT">YouTube Music</button><button id="lLR">LRClib</button></div>'+
    '<button class="lyrbtn" id="lyrFull" title="Fullscreen lyrics"><span class="ic">'+ic('i-expand')+'</span></button></div>'+
    '<div id="lyrBody"></div>';
  paintLyrChip();
  $('#lYT').onclick=function(){lyrPref='ytm';saveAll();paintLyrChip();lyr.loadedFor=null;loadLyrics()};
  $('#lLR').onclick=function(){lyrPref='lrclib';saveAll();paintLyrChip();lyr.loadedFor=null;loadLyrics()};
  $('#lyrFull').onclick=toggleLyrFull;
}
loadLyrics=async function(){
  var body=$('#lyrBody'); if(!body)return;
  var it=nowItem();
  if(!it){body.innerHTML='<div class="lyrmissing">Nothing playing.</div>';return}
  var token=++lyrToken;
  lyr.loadedFor=it.id+':'+(lyrPref||'auto');
  var t=$('#lyrT'); if(t)t.innerHTML=esc(it.title)+'<span>'+esc(it.artist||'')+'</span>';
  body.innerHTML='<div class="lyrmissing">Loading lyrics…</div>';
  var qs=new URLSearchParams();
  qs.set('provider',(lyrPref==='ytm'||lyrPref==='lrclib')?lyrPref:'auto');
  qs.set('id',it.id); qs.set('title',it.title||''); qs.set('artist',it.artist||'');
  var dur=audio.duration||0; if(dur>0)qs.set('duration',String(Math.round(dur)));
  try{
    var r=await fetch('/api/lyrics?'+qs.toString());
    var j=await r.json();
    if(token!==lyrToken)return;
    lyr.plain=j.plain||''; lyr.synced=j.synced||''; lyr.note=j.note||''; lyr.error=j.error||''; lyr.lines=[];
    renderLyricsBody();
  }catch(e){
    if(token!==lyrToken)return;
    body.innerHTML='<div class="lyrmissing">Lyrics failed to load.</div>';
  }
};
renderLyricsBody=function(){
  var body=$('#lyrBody'); if(!body)return;
  clearInterval(lyr.timer); lyr.timer=null; lyr.cur=-1; lyr.lines=[];
  var note=lyr.note?'<div class="lyrnote">'+esc(lyr.note)+'</div>':'';
  if(lyr.synced){
    var lines=parseLrc2(lyr.synced);
    if(lines.length){
      lyr.lines=lines;
      body.innerHTML=note+lines.map(function(l,i){
        return '<div class="l sync" id="l'+i+'" data-i="'+i+'" data-t="'+l.t+'">'+(esc(l.x)||'&nbsp;')+'</div>';
      }).join('');
      paintLyrics(true);
      lyr.timer=setInterval(function(){paintLyrics(false)},240);
      return;
    }
  }
  if(lyr.plain){
    body.innerHTML=note+lyr.plain.split('\n').map(function(l){return '<div class="l">'+(esc(l)||'&nbsp;')+'</div>'}).join('');
    return;
  }
  body.innerHTML=lyr.error?('<div class="lyrmissing">'+esc(lyr.error)+'</div>'):'<div class="lyrmissing">No lyrics found for this track.</div>';
};
function paintLyrics(force){
  var body=$('#lyrBody'), lines=lyr.lines;
  if(!body||!lines||!lines.length)return;
  var t=audio.currentTime||0, lo=0, hi=lines.length-1, idx=-1;
  while(lo<=hi){var mid=(lo+hi)>>1; if(lines[mid].t<=t){idx=mid;lo=mid+1} else hi=mid-1}
  if(idx===lyr.cur&&!force)return;
  var prev=lyr.cur>=0?body.querySelector('#l'+lyr.cur):null;
  if(prev)prev.classList.remove('on');
  lyr.cur=idx;
  if(idx<0)return;
  var el=body.querySelector('#l'+idx); if(!el)return;
  el.classList.add('on');
  if(lyrAuto&&el.scrollIntoView){try{el.scrollIntoView({block:'center',behavior:force?'auto':'smooth'})}catch(e){}}
}
(function(){
  var host=$('#pvLyrics'); if(!host)return;
  var pause=function(){lyrAuto=false;clearTimeout(lyrAutoT);lyrAutoT=setTimeout(function(){lyrAuto=true},4000)};
  ['wheel','touchstart','pointerdown'].forEach(function(ev){host.addEventListener(ev,pause,{passive:true})});
})();
document.addEventListener('click',function(e){
  var l=e.target.closest('#lyrBody .l[data-t]'); if(!l)return;
  var t=parseFloat(l.dataset.t); if(!isFinite(t))return;

}

function toggleLyrFull(){
  var on=document.body.classList.toggle('lyrfull');

/* 9) live search suggestions (#21) */
var sugTimer=null, sugToken=0;
function renderSuggest(q){
  var el=$('#shist'); if(!el)return;
  if(!q){ if(typeof renderSHist==='function')renderSHist(); return }
  var token=++sugToken;
  el.hidden=false;
  clearTimeout(sugTimer);
  sugTimer=setTimeout(function(){
    Promise.all([
      fetch('/api/suggest?q='+encodeURIComponent(q)).then(function(r){return r.json()}).catch(function(){return {items:[]}}),
      fetch('/api/search?q='+encodeURIComponent(q)).then(function(r){return r.json()}).catch(function(){return {items:[]}})
    ]).then(function(res){
      if(token!==sugToken)return;
      var sugg=(res[0]&&res[0].items||[]).slice(0,4);
      var items=(res[1]&&res[1].items||[]).slice(0,6);
      if(!sugg.length&&!items.length){el.innerHTML='<div class="shgrp">No matches</div>';return}
      var h='';
      if(sugg.length)h+='<div class="shgrp">Suggestions</div>'+sugg.map(function(s){
        return '<button class="shr" data-sh="'+esc(s)+'"><span class="ic">'+ic('i-search')+'</span><span class="st">'+esc(s)+'</span></button>';
      }).join('');
      if(items.length){
        register(items);
        h+='<div class="shgrp">Top results</div>'+items.map(function(it){
          return '<button class="shr" data-play-item="'+esc(it.id)+'"><span class="kart"><img src="'+esc(thumb(it))+'" onerror="this.style.display=\'none\'"></span>'+
            '<span style="flex:1;min-width:0"><span class="st">'+esc(it.title)+'</span>'+
            '<span class="subx">'+esc(it.artist||'')+(it.duration?' • '+esc(it.duration):'')+'</span></span></button>';
        }).join('');
      }
      el.innerHTML=h;
    });
  },280);
}
$('#q').addEventListener('input',function(){renderSuggest($('#q').value.trim())});
$('#q').addEventListener('focus',function(){if($('#q').value.trim())renderSuggest($('#q').value.trim())});
$('#q').addEventListener('keydown',function(e){
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;

  e.preventDefault();
  var i=rows.findIndex(function(r){return r.classList.contains('on')});
  i=e.key==='ArrowDown'?(i<0?0:Math.min(rows.length-1,i+1)):(i<=0?rows.length-1:i-1);
  rows.forEach(function(r,k){r.classList.toggle('on',k===i)});
  rows[i].scrollIntoView({block:'nearest'});
  $('#q').value=rows[i].dataset.sh||rows[i].querySelector('.st').textContent.trim();
});

/* 10) correct download extension (#41) */
downloadTrack=async function(it){
  if(!it)return;
  try{
    toast('Downloading “'+it.title+'”…');
    var r=await fetch('/api/download?id='+it.id);
    if(!r.ok){var j=await r.json().catch(function(){return null});throw new Error((j&&j.error)||'download failed')}
    var name=it.title||'track';
    var cd=r.headers.get('content-disposition')||'';
    var m=cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
    if(m){name=decodeURIComponent(m[1])}
    else{
      var ct=(r.headers.get('content-type')||'').toLowerCase();
      var ext=ct.indexOf('webm')>=0?'webm':ct.indexOf('ogg')>=0?'opus':ct.indexOf('mpeg')>=0?'mp3':'m4a';
      name=name+'.'+ext;
    }
    var blob=await r.blob();
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
    toast('Downloaded');
  }catch(e){toast('Download failed: '+e.message)}
};

paintLyrChip();
paintSeek();
if(!$('#homeSec').hidden)renderHome();
})();

<script id="v3seekjs">
(function(){
  var wrap=document.getElementById('pseekWrap');
  var input=document.getElementById('pseek');
  var fill=document.getElementById('psFill');
  if(!wrap||!input||!fill)return;

  var knob=document.getElementById('v3knob');
  if(!knob){knob=document.createElement('div');knob.id='v3knob';knob.className='v3knob';wrap.appendChild(knob)}

  var last=-2;
  function pct(){
    var d=audio.duration;
    if(!isFinite(d)||d<=0)return -1;           // live stream / not loaded yet
    var p=(audio.currentTime||0)/d*100;
    return p<0?0:(p>100?100:p);                // clamp: never past the end
  }
  function paint(){
    var p=pct();
    if(p<0){ if(last!==-1){last=-1;fill.style.width='0%';knob.style.opacity=0} return }
    if(p===last)return;
    last=p;
    knob.style.opacity=1;
    knob.style.left=p+'%';                     // same value as the fill → always aligned
    fill.style.width=p+'%';
  }
  try{paintSeek=function(){paint()}}catch(e){}  // lyrics click-to-seek + startup still work

  ['timeupdate','loadedmetadata','durationchange','seeked','playing','emptied','ended','pause']
    .forEach(function(ev){audio.addEventListener(ev,paint)});
  input.addEventListener('input',paint);
  input.addEventListener('change',paint);

  (function loop(){paint();requestAnimationFrame(loop)})();   // smooth, ~60fps
})();
</script>

   "=w544-h544-l90-rj", which some artists answer with a PORTRAIT or square crop
   (measured: 363×544, 544×544, 408×544) — that is the cropped-face square. So: ask for the
   wide token; if the URL is not on a banner host, keep whatever the API gave (shown unblurred,
   object-fit:cover) — never stretched into a box. */
function heroArt(a){
  var raw = (a && (a.banner || a.thumb || '')) || '';
  /* one artwork shape everywhere: v3art's normaliser decides whether this is a real URL */
  var u = (typeof window.artURL === 'function') ? window.artURL(raw) : raw;
  if(!u) return '';
  if(/^https:\/\/(lh3|yt3)\.googleusercontent\.com\//.test(u)){
    /* ask BOTH banner hosts for the widest 2.4:1 token. The API normalises artwork
       to =w544… (=w544 → a bad 363×544 portrait / 544×544 square crop), and some
       hosts ship other shapes (=s544…) or none at all, so replace whatever token
       is there — never use the 544 crop for the hero. */
    var hero = '=w2400-h1000-p-l90-rj';
    return /=\w[^"?]*$/.test(u) ? u.replace(/=\w[^"?]*$/, hero) : u + hero;
  }
  return u;
}

/* ---------- BUG #5: search paging / infinite scroll ---------- */
var S = { q:'', sessionId:null, next:false, loading:false, items:[] };
/* 4L: search generation token. Every doSearch() owns one; loadMore() reads it before its await so
   a page-2 response that lands after a NEWER search can be dropped instead of mutating it.
   Deliberately separate from the artist layer's artGen — the two views page independently. */
var Sg = 0;
function paintSearch(){
  var html = '<div class="list">'+S.items.map(function(it){ return rowHTML(it) }).join('')+'</div>'+
             '<div class="v3sent" id="v3sent"></div>';
  showDyn('Results for “'+esc(S.q)+'”', S.items.length+' songs', html);
  curList = S.items.slice(); register(S.items);
}
async function loadMore(){
  if(!S.sessionId || !S.next || S.loading) return;
  /* 4L: bind this in-flight page to the search that asked for it — read both BEFORE the await.
     `st` is the state object we may write to (never the global `S`), `gen` the generation that
     owns it. `st !== S` after the await ⇒ a newer doSearch() replaced the state: drop the page. */
  var gen = Sg, st = S;
  st.loading = true;
  var s = document.getElementById('v3sent'); if(s) s.textContent = 'Loading more…';
  try{
    var r = await fetch('/api/search/next?sessionId='+encodeURIComponent(st.sessionId));
    var j = await r.json();
    /* 4L: a newer doSearch() has already replaced S — this response belongs to a query the user
       has moved on from, so drop it: no mutation, no paint. */
    if(gen !== Sg || st !== S){ st.loading = false; return }
    var add = j.items||[];
    if(add.length) st.items = st.items.concat(add);
    st.next = !!j.next;
    if(!add.length && !st.next) st.sessionId = null;
    /* loadMore is async: if the user has navigated away (artist page, album, home)
       while page 2 was in flight, repainting would call showDyn() and steal the view. */
    if(curPage!=='dyn'){ st.loading = false; return }
    paintSearch();
    var s2 = document.getElementById('v3sent');
    if(s2) s2.textContent = st.next ? '' : 'End of results';
  }catch(e){ st.next = false }
  st.loading = false;
}
doSearch = async function(q, record){
  q = String(q||'').trim(); if(!q) return;
  if(record!==false && typeof pushSHist==='function') pushSHist(q);
  var sh = document.getElementById('shist'); if(sh) sh.hidden = true;
  var gen = ++Sg;                                  // 4L: this search owns generation `gen`
  S = { q:q, sessionId:null, next:false, loading:false, items:[] };
  try{
    var r = await fetch('/api/search?q='+encodeURIComponent(q));
    var j = await r.json();
    if(gen !== Sg) return;                         // 4L: a newer search started while this was in flight
    if(j.error && !(j.items||[]).length){ toast('Search failed: '+j.error); return }
    S.items = j.items||[]; S.sessionId = j.sessionId||null; S.next = !!j.next;
    paintSearch();
    if(S.next) loadMore();                     // immediately pull page 2 → ~40 results
  }catch(e){ if(gen === Sg) toast('Search failed: '+e.message) }
};
(function scrollPaging(){
  var sc = document.getElementById('scroll'); if(!sc) return;
  sc.addEventListener('scroll', function(){
    if(curPage!=='dyn') return;
    if(sc.scrollTop + sc.clientHeight > sc.scrollHeight - 700) loadMore();
  }, { passive:true });
})();

function seeds(){
  var arts = (typeof topArtists==='function') ? topArtists(14) : [];
  if(!arts.length) return ['trending songs'];
  var last = LS.get('sv_dice_last','');
  var bag = arts.filter(function(a){ return a!==last }); if(!bag.length) bag = arts.slice();
  var picked = [];
  for(var n=0; n<4 && bag.length; n++){
    var total=0; bag.forEach(function(a,i){ total += 1/(i+1) });
    var r=Math.random()*total, acc=0, k=0;
    for(var i=0;i<bag.length;i++){ acc += 1/(i+1); if(r<=acc){ k=i; break } }
    picked.push(bag[k]); bag.splice(k,1);
  }
  LS.set('sv_dice_last', picked[0]||'');
  return picked;
}
function pickBalanced(pool, want){
  var seen={}, out=[], perArtist={}, lastArtist='';
  pool.forEach(function(it){ if(it && it.id) seen[it.id]=seen[it.id]||it });
  var list = Object.keys(seen).map(function(k){ return seen[k] })
    .filter(function(it){ return recentIds.indexOf(it.id)<0 });
  for(var round=0; round<3 && out.length<want; round++){
    list.forEach(function(it){
      if(out.length>=want) return;
      if(out.some(function(x){ return x.id===it.id })) return;
      var a = String(it.artist||'').split(',')[0].trim().toLowerCase();
      perArtist[a] = perArtist[a]||0;
      if(a && perArtist[a] >= 2) return;
      if(a && a === lastArtist) return;
      out.push(it); perArtist[a]++; lastArtist = a;
    });
  }
  return out;
}

downloadTrack = async function(it){
  if(!it) return;
  try{
    toast('Downloading “'+it.title+'”…');
    var r = await fetch('/api/download?id='+encodeURIComponent(it.id)+'&title='+encodeURIComponent(it.title||''));
    if(!r.ok){ var j = await r.json().catch(function(){ return null }); throw new Error((j && j.error) || 'download failed') }
    var name = it.title || 'track';
    var cd = r.headers.get('content-disposition')||'';
    var m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
    if(m){ try{ name = decodeURIComponent(m[1]) }catch(e){ name = m[1] } }
    else {
      var ct = (r.headers.get('content-type')||'').toLowerCase();
      var ext = ct.indexOf('webm')>=0 ? 'webm' : ct.indexOf('ogg')>=0 ? 'opus' : ct.indexOf('mpeg')>=0 ? 'mp3' : 'm4a';
      name = name + '.' + ext;
    }
    var blob = await r.blob();
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href) }, 5000);
    toast('Downloaded');
  }catch(e){ toast('Download failed: '+e.message) }
};

<script id="v3art">
(function(){
  function goodUrl(u){ return typeof u==='string' && /^https?:\/\//i.test(u.trim()) }

  /* ---- ONE artwork normaliser -------------------------------------------------
     Accepts a track/album/artist OBJECT or a plain URL STRING and always returns a
     URL STRING ('' when there is genuinely none), so every renderer — rows, rails,
     queue, mini player, artist page — passes and receives the same shape. */
  function artURL(v){
    var u = (typeof v === 'string') ? v : ((v && (v.thumb || v.banner || v.url)) || '');
    u = String(u == null ? '' : u).trim();
    return goodUrl(u) ? u : '';                   // kills "[object Object]", "undefined", ""
  }
  window.artURL = artURL;                         // heroArt() (v3js) reuses it

  /* ---- initials TILE (Wave 4I: the NO-URL case only) -------------------------
     Brand gradient + the item's initials, drawn as an inline data: URI so nothing has
     to load from a host. Retained for the ONE case where the API returned NO artwork
     URL at all (exposed as window.artTile; the artist hero itself renders its existing
     .nopic gradient for that case). It is NEVER a failure fallback: an image that was
     served and then FAILED gets the flat tile below. */
  function xmlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
  function artTile(label){
    var words = String(label == null ? '' : label).replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
    var ini = words.slice(0,2).map(function(w){ return w.charAt(0) }).join('').toUpperCase() || '♪';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#34304a"/><stop offset="1" stop-color="#141420"/></linearGradient></defs>' +
      '<rect width="100" height="100" fill="url(#g)"/>' +
      '<text x="50" y="52" fill="#9d9db2" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" dominant-baseline="middle">' + xmlEsc(ini) + '</text>' +
      '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  window.artTile = artTile;                       // initials ⇢ ONLY when the API returned no artwork URL
  /* the artwork hosts answer the BIGGEST size tokens with 429 + `text/html` once a
     page fires ~30 image requests at once; the renderer reports that as
     net::ERR_BLOCKED_BY_ORB. So one retry at a smaller token is worth trying before
     giving up. The full-bleed hero keeps its 2.4:1 token (wide), so a retry can never
     introduce bands or a vertical crop; every square box shrinks to a square token.
     Replace the WHOLE token, never part of it: ggpht avatars ship tokens such as
     "=w1000-c-h416-k-c0x00ffffff-no-l90-rj-dcMSWWrhkK", and editing one piecemeal
     (measured "=w400-c-h416-…") comes back 400 text/html while a clean
     "=w320-h320-l90-rj" comes back 200 image/jpeg. The API itself uses this token shape. */
  function smallerToken(u, wide){
    var s = String(u || '');
    var i = s.lastIndexOf('=');
    if(i < 0) return '';
    var next = s.slice(0, i) + (wide ? '=w1200-h500-p-l90-rj' : '=w320-h320-l90-rj');
    return next === s ? '' : next;
  }
  /* flat dark placeholder for an image that was SERVED and then FAILED (after the one
     smaller retry). Deliberately NOT initials: initials mean "the API returned no
     artwork URL at all", which is a different fact (see the poster path in v3js). */
  function flatTile(){
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">' +
      '<rect width="100" height="100" fill="#14141b"/></svg>');
  }

  /* 1) any track without a real artwork URL gets YouTube's own thumbnail */
  var _thumb = thumb;
  thumb = function(it){
    var u = '';
    try{ u = artURL(_thumb(it)) }catch(e){}
    if(!u && it && /^[A-Za-z0-9_-]{11}$/.test(String(it.id||''))){
      u = 'https://i.ytimg.com/vi/'+it.id+'/mqdefault.jpg';
    }
    return u;
  };

  /* Wave 4J — measured root cause: the artwork host answers a request that carries a
     Referer with 429 + `text/html`, which the renderer reports as net::ERR_BLOCKED_BY_ORB,
     so the image silently never paints. /api/thumb fetches the SAME URL server-side with
     NO Referer and gets 200. A retry fired in the SAME burst is throttled again, so the
     second ask is made after a pause — and only if nothing has painted or replaced the
     image meanwhile. */
  var RETRY_MS = 900;
  function proxied(u){ return '/api/thumb?url=' + encodeURIComponent(u) }
  function retryLater(im, url){
    var from = im.getAttribute('src');
    setTimeout(function(){
      if(!im.isConnected) return;
      if(im.complete && im.naturalWidth > 0) return;   // something painted it meanwhile
      if(im.getAttribute('src') !== from) return;      // src changed under us — leave it alone
      im.style.display = '';
      im.setAttribute('src', url);
    }, RETRY_MS);
  }

  /* 2) Wave 4J failure ladder, per image:
        direct load → retry once (~900ms later) via /api/thumb?url=<same URL>
        → the same artwork at a smaller token (proxied the same way) → FLAT DARK placeholder.
        Initials are NEVER part of this ladder: they mean "the API returned no artwork URL
        at all", which is a different fact (the artist hero's .nopic path in v3js). */
  document.addEventListener('error', function(e){
    var im = e.target;
    if(!im || im.tagName!=='IMG') return;
    if(!im.isConnected) return;                   // detached image: nothing to paint
    if(im.complete && im.naturalWidth > 0) return; // ALREADY PAINTED — never swap a good image
    var stage = parseInt(im.dataset.fbr || '0', 10);
    if(stage >= 3) return;                        // the flat placeholder itself failed — stop
    var cur = im.getAttribute('src') || '';
    /* the browser re-fires `error` for the SAME src when its own transport retry fails
       (measured: two events for one URL). That must NOT escalate — and it must NOT cancel
       the retry retryLater() already scheduled for that src. */
    if(im.dataset.fbsrc === cur) return;
    im.dataset.fb = '1';
    im.dataset.fbsrc = cur;
    if(stage === 0){
      /* step 1 — the SAME URL re-asked through the server proxy, which sends no Referer.
         This is the step that actually beats the 429/ORB. */
      im.dataset.fb0 = cur;
      im.dataset.fbr = '1';
      retryLater(im, proxied(cur));
      return;
    }
    if(stage === 1){
      /* step 2 — the original artwork at one smaller size token, proxied the same way. */
      var small = smallerToken(im.dataset.fb0 || cur, im.classList.contains('art-herowide'));
      if(small){ im.dataset.fbr = '2'; retryLater(im, proxied(small)); return }
    }
    im.dataset.fbr = '3';                         // served, then failed → FLAT DARK placeholder
    im.style.display = '';
    im.src = flatTile();
  }, true);

  /* 3) DEFERRED artwork (Wave 4I) ---------------------------------------------
     The artist page's below-fold renderers (top songs, Albums & singles, Fans might
     also like) emit <img loading="lazy" data-src="…"> with NO src, so opening an
     artist requests only the poster instead of ~20-30 avatars at once — which is what
     made the host throttle and the old hero lose the race. One IntersectionObserver
     promotes data-src → src just before the image scrolls in; the error handler above
     owns retries from there. A MutationObserver picks up every fresh render, so no
     renderer has to remember to call anything. */
  function lazyRoot(){ return document.getElementById('scroll') || null }
  var lazyIO = null;
  function promote(im){
    if(!im || !im.isConnected) return;            // the view was left while this sat in the queue
    var s = im.getAttribute('data-src');
    im.removeAttribute('data-src');
    if(s){ im.dataset.fb = ''; im.dataset.fbr = '0'; im.dataset.fbsrc = ''; im.dataset.fb0 = ''; im.setAttribute('src', s) }
  }
  /* ONE intersecting image per tick. Measured: ~13 requests at once is what provokes the
     host's 429 + text/html storm (renderer: net::ERR_BLOCKED_BY_ORB); the same URLs asked
     for one-at-a-time all return 200. So intersecting images are queued and drained with a
     small gap — the poster is eager and is never queued, so it still goes first. */
  var PROMOTE_GAP_MS = 80, lazyQ = [], lazyTimer = null;
  function drain(){
    lazyTimer = null;
    if(lazyQ.length){ promote(lazyQ.shift()); lazyTimer = setTimeout(drain, PROMOTE_GAP_MS) }
  }
  function enqueue(im){
    if(!im) return;
    if(lazyQ.indexOf(im) < 0) lazyQ.push(im);
    if(!lazyTimer) lazyTimer = setTimeout(drain, 0);
  }
  function lazyOne(im){
    if(!im || im.getAttribute('src') || !im.hasAttribute('data-src')) return;
    if(!im.getAttribute('data-src')){ im.removeAttribute('data-src'); return }  // no URL at all → keep the placeholder
    if(!lazyIO){
      try{
        lazyIO = new IntersectionObserver(function(entries){
          for(var i=0;i<entries.length;i++){ var t = entries[i].target; if(entries[i].isIntersecting){ lazyIO.unobserve(t); enqueue(t) } }
        }, { root: lazyRoot(), rootMargin: '200px 0px' });
      }catch(e){ lazyIO = null }
    }
    if(!lazyIO){ enqueue(im); return }            // no IntersectionObserver → queue it anyway, never never
    lazyIO.observe(im);
  }
  function lazyScan(){
    var ims = document.querySelectorAll('img[data-src]');
    for(var i=0;i<ims.length;i++) lazyOne(ims[i]);
  }
  window.artLazy = lazyScan;                      // exposed so any renderer (or a probe) can flush it
  try{ new MutationObserver(lazyScan).observe(document.body, { childList:true, subtree:true }); }catch(e){}

  /* 4) reset the retry state whenever the track changes */
  var _setNow = setNowUI;
  setNowUI = function(it){
    ['pvImg','mArt'].forEach(function(id){
      var im = document.getElementById(id); if(im){ im.dataset.fb = ''; im.dataset.fbr = '0'; im.dataset.fbsrc = ''; im.dataset.fb0 = '' }
    });
    _setNow(it);
  };
})();
</script>

<script id="v3seek2js">
(function(){
  var wrap  = document.getElementById('pseekWrap');
  if(!wrap) return;
  var input = document.getElementById('pseek');
  var seeking = false;

  function frac(clientX){
    var d = audio.duration;
    if(!isFinite(d) || d <= 0) return -1;
    var r = wrap.getBoundingClientRect();
    if(!r.width) return -1;
    var f = (clientX - r.left) / r.width;
    return f < 0 ? 0 : f > 1 ? 1 : f;
  }
  function seekFrom(e){
    var f = frac(e.clientX);
    if(f < 0) return false;
    audio.currentTime = f * audio.duration;
    if(input) input.value = f * 1000;
    try{ paintSeek() }catch(err){}
    return true;
  }
  function stop(e){
    seeking = false;
    wrap.classList.remove('dragging');
    try{ if(e && e.pointerId != null && wrap.hasPointerCapture(e.pointerId)) wrap.releasePointerCapture(e.pointerId) }catch(err){}
  }

  wrap.addEventListener('pointerdown', function(e){
    if(e.button !== undefined && e.button !== 0) return;
    if(!seekFrom(e)) return;                 // no duration loaded yet
    seeking = true;
    wrap.classList.add('dragging');
    try{ wrap.setPointerCapture(e.pointerId) }catch(err){}
    e.preventDefault();
  });
  wrap.addEventListener('pointermove', function(e){
    if(!seeking) return;
    if(seekFrom(e)) e.preventDefault();
  });
  wrap.addEventListener('pointerup', stop);
  wrap.addEventListener('pointercancel', stop);
  wrap.addEventListener('lostpointercapture', stop);
})();
</script>

<script id="v3tipjs">
(function(){
  var wrap  = document.getElementById('pseekWrap'); if(!wrap) return;
  var track = wrap.querySelector('.psTrack');
  var tip   = document.getElementById('psTip');
  var ghost = document.getElementById('psGhost');
  if(!track) return;

  /* a dot at the cursor end of the ghost line */
  var dot = document.getElementById('v3tipdot');
  if(!dot){
    dot = document.createElement('div');
    dot.id = 'v3tipdot'; dot.className = 'v3tipdot';
    track.appendChild(dot);
  }

  var dragging = false;
  function dur(){ var d = audio.duration; return (isFinite(d) && d > 0) ? d : 0 }

  function move(e){
    if(dragging) return;                                  // no bubble while scrubbing
    var d = dur(); if(!d) return;                         // nothing loaded yet
    var r = wrap.getBoundingClientRect(); if(!r.width) return;

    var h = (e.clientX - r.left) / r.width;  h = h < 0 ? 0 : h > 1 ? 1 : h;
    var p = (audio.currentTime || 0) / d;    p = p < 0 ? 0 : p > 1 ? 1 : p;

    if(ghost){                                            // playhead → cursor
      ghost.style.left    = Math.min(p, h) * 100 + '%';
      ghost.style.width   = Math.abs(h - p) * 100 + '%';
      ghost.style.opacity = 1;
    }
    if(dot){ dot.style.left = h * 100 + '%'; dot.style.opacity = 1 }

    if(tip){
      tip.hidden = false;
      tip.textContent = fmt(h * d);
      tip.style.left = h * 100 + '%';
      var tw = tip.offsetWidth || 44, px = h * r.width, shift = 0;   // keep it on the bar
      if(px - tw / 2 < 0)                 shift = tw / 2 - px;
      else if(px + tw / 2 > r.width)      shift = r.width - px - tw / 2;
      tip.style.transform = 'translateX(calc(-50% + ' + Math.round(shift) + 'px))';
    }
  }
  function leave(){
    if(ghost) ghost.style.opacity = 0;
    if(dot)   dot.style.opacity   = 0;
    if(tip)   tip.hidden = true;
  }

  wrap.addEventListener('mousemove', move);               // after the built-in handler → wins
  wrap.addEventListener('mouseleave', leave);
  wrap.addEventListener('pointerdown', function(){ dragging = true; leave() });
  ['pointerup','pointercancel'].forEach(function(ev){
    wrap.addEventListener(ev, function(){ setTimeout(function(){ dragging = false }, 80) });
  });
})();
</script>

<!-- SETTINGS SLIDE-OVER (Wave 4E) — shell only; the body is rendered by the v3js layer -->
<aside id="setPanel" role="dialog" aria-modal="true" aria-label="Settings" aria-hidden="true">
  <header class="setTop">
    <h2>Settings</h2>
    <button class="setX" type="button" data-setact="close" title="Close settings" aria-label="Close settings"><span class="ic"><svg><use href="#i-x"/></svg></span></button>
  </header>
  <div class="setBody" id="setBody"></div>
  <input type="file" id="setFile" accept="application/json,.json" hidden>
</aside>

<!-- ABOUT OVERLAY (Wave 4F) — shell only; the body is rendered by the v3js About block.
     z 98 > #setPanel's 96, so it opens ON TOP of the panel without closing it. -->
<aside id="aboutCard" role="dialog" aria-modal="true" aria-labelledby="abTitle" aria-hidden="true">
  <div class="abBox">
    <header class="abTop">
      <h2 id="abTitle">About</h2>
      <button class="abX" type="button" data-aboutact="close" title="Close About" aria-label="Close About"><span class="ic"><svg><use href="#i-x"/></svg></span></button>
    </header>
    <div class="abBody" id="abBody"></div>
  </div>
</aside>
