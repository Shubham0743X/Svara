<script id="v4fxboot">
/* ================= WAVE 5 (UI-1) — effects mode, decided BEFORE first paint =================
   The wave background must never flash the wrong look, so the mode lands on <html> here, at the
   very top of <body> — setBoot() (in v3js) runs far too late for that.
   Two EXISTING keys only, no new localStorage key (sv_set_shaderIntensity / sv_set_lowPower).
     classic : shaderIntensity 'off' OR lowPower true  → NO canvas is created, app looks like today
     bal     : 'low' | 'medium'                        → scale 3 / 30 fps
     full    : 'high'                                  → scale 2 / 60 fps
   Also seeds the canvas-opacity custom property (and any future glass var) from one place. */
(function(){
  var intensity = 'medium', lowPower = false;
  try{
    var rawI = localStorage.getItem('sv_set_shaderIntensity');
    if(rawI !== null){ try{ intensity = JSON.parse(rawI) }catch(e){ intensity = rawI } }
    var rawL = localStorage.getItem('sv_set_lowPower');
    if(rawL !== null){ try{ lowPower = (JSON.parse(rawL) === true) }catch(e){ lowPower = (rawL === 'true') } }
  }catch(e){}
  if(intensity !== 'off' && intensity !== 'low' && intensity !== 'medium' && intensity !== 'high') intensity = 'medium';
  var mode = (intensity === 'off' || lowPower) ? 'classic' : (intensity === 'high' ? 'full' : 'bal');
  var d = document.documentElement;
  d.dataset.fx = mode;
  d.style.setProperty('--wave-op', '1');     // canvas opacity: inherited, overridden per view by v4wavejs
  window.__waveCfg = { mode: mode, intensity: intensity, lowPower: lowPower };
})();
</script>

<script>
/* ============ helpers & storage ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=id=>`<svg><use href="#${id}"/></svg>`;
function LSget(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function LSset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let hist=LSget('ml_history',{});          // your listening history (kept from before)
let favs=LSget('sv_favs',{});
let pls=LSget('sv_pls',{});
let shist=LSget('sv_shist',[]);
let lyrPref=LSget('sv_lyr','ytm');
const idItem={};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function saveAll(){LSset('sv_favs',favs);LSset('sv_pls',pls);LSset('sv_shist',shist);LSset('sv_lyr',lyrPref)}
function register(arr){(arr||[]).forEach(it=>{if(it&&it.id)idItem[it.id]=it})}

/* ============ state ============ */
const audio=$('#audio');
let queue=[],seq=[],cur=-1;           // seq = play order as queue indexes
let repeat='off',shuffle=false,volume=80,wasVol=80;
let curList=[],quickList=[],curPage='home';        // curList = list rows in main area; quickList = Home Quick picks
let lyr={plain:'',synced:'',cur:-1,timer:null,loadedFor:null};

/* ============ nav / views ============ */
const pgTitle=$('#pgTitle'),pgSub=$('#pgSub');
function setNav(on){
  document.querySelectorAll('.navit').forEach(b=>b.classList.toggle('on',b.dataset.nav===on));
}
function goHome(){curPage='home';curList=[];setNav('home');$('#dynSec').hidden=true;$('#homeSec').hidden=false;pgTitle.hidden=true;pgSub.hidden=true;renderHome();updatePlRows();}
function showDyn(title,sub,html){curPage='dyn';$('#homeSec').hidden=true;$('#dynSec').hidden=false;pgTitle.hidden=false;pgSub.hidden=false;pgTitle.innerHTML=title;pgSub.textContent=sub||'';$('#dynSec').innerHTML=html;setNav(null);updatePlRows();}

/* ============ sidebar playlists ============ */
function updatePlRows(){
  const names=Object.keys(pls);
  const likedN=Object.keys(favs).length;
  let h=`<div class="sbt">Your library</div>
  <button class="plrow ${curPage==='lib'?'on':''}" data-lib="liked"><span class="ic">${ic('i-heart')}</span>Liked music<span class="cnt">${likedN}</span></button>`;
  names.forEach(n=>{h+=`<button class="plrow" data-lib="pl:${esc(n)}"><span class="ic">${ic('i-list')}</span>${esc(n)}<span class="cnt">${pls[n].length}</span></button>`});
  $('#plList').innerHTML=h+'<div class="sbt" style="opacity:.35">Library opens here</div>';
}
function openLiked(){const items=Object.values(favs).filter(x=>x&&x.id);if(!items.length){toast('No liked songs yet — tap the ♥');return}showDyn('Liked music',items.length+' songs',listHTML(items));curList=items;register(items);}
function openPl(name){const items=pls[name]||[];if(!items.length){toast('Playlist is empty');return}showDyn(esc(name),items.length+' songs · '+esc('click ⋮ to remove'),listHTML(items));curList=items;register(items);}

/* ============ rows & rails ============ */
/* Wave 4AD — the size token is now context-specific. thumb(it) with no size still means
   the big 544px token (player hero, #mArt, the queue, the 4Z top-result card and the
   artist banner all keep it, unchanged); the list/rail renderers ask for what their own
   box can actually display instead of making every 44-64px row decode a 544x544 bitmap. */
var THUMB_ROW='w160-h160-l90-rj',THUMB_RAIL='w256-h256-l90-rj',THUMB_BIG='w544-h544-l90-rj';
function thumb(it,size){
  let u=(it&&it.thumb)||'';
  if(!u)return '';
  const i=u.indexOf('=w');
  if(i>0)u=u.slice(0,i)+'='+(size||THUMB_BIG);
  return u;
}
/* 4Z-b: artist + ' • ' + duration — but a track with no artist shows the duration alone,
   never a stray " • " (the artist is now backfilled server-side, this is the safety net). */
function subOf(it){return it.duration?(it.artist?it.artist+' • '+it.duration:it.duration):(it.artist||'')}
function rowHTML(it){
  const cur=nowItem()&&nowItem().id===it.id;
  return `<div class="row ${cur?'cur':''}" data-play="1" data-id="${esc(it.id)}">
    <div class="rt"><img loading="lazy" src="${esc(thumb(it,THUMB_ROW))}" onerror="this.style.display='none'">
      <div class="ov"><span class="ic">${ic('i-play')}</span></div></div>
    <div class="rm"><div class="rtitle">${esc(it.title)}</div><div class="rsub">${esc(subOf(it))}</div></div>
    <div class="rr">${favs[it.id]?`<span class="likedH">${ic('i-heart')}</span>`:''}
    <button class="dots" data-menu="${esc(it.id)}"><span class="ic">${ic('i-dots')}</span></button></div></div>`;
}
function listHTML(items){return `<div class="list">${(items||[]).map(rowHTML).join('')}</div>`}
function railCard(it,ctx){
  const cur=nowItem()&&nowItem().id===it.id;
  const ph=thumb(it,THUMB_RAIL)?'':`<div class="ph"><span class="ic">${ic('i-disc')}</span></div>`;
  return `<div class="rail" data-rail="${ctx}" data-id="${esc(it.id)}" data-title="${esc(it.title||'')}">
    <div class="art">${ph}<img loading="lazy" src="${esc(thumb(it,THUMB_RAIL))}" onerror="this.style.display='none'">
      <div class="ov"><span class="pb">${ic('i-play')}</span></div></div>
    <div class="rname">${esc(it.title)}</div><div class="rsub2">${esc(it.artist||'')}</div></div>`;
}
function railHTML(arr,ctx){return `<div class="railwrap">${arr.map(x=>railCard(x,ctx)).join('')}</div>`}

/* ============ personalization core ============ */
function splitArtists(a){return String(a||'').split(/[,&×;]|\bfeat\.?/i).map(s=>s.trim()).filter(s=>s&&!/^feat/i.test(s))}
function topArtists(n){
  const m={};
  Object.values(hist).forEach(h=>{if(h&&h.artist){splitArtists(h.artist).slice(0,2).forEach(x=>{m[x]=(m[x]||0)+h.count})}});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n||3).map(x=>x[0]);
}
function topRecent(n){return Object.values(hist).sort((a,b)=>b.last-a.last).slice(0,n||12)}
function topScored(n){
  const now=Date.now();
  return Object.values(hist).map(h=>{const rec=Math.max(0,1-(now-h.last)/ (14*864e5));const c=Math.min(1,h.count/20);return{h,s:c*.7+rec*.3}})
    .sort((a,b)=>b.s-a.s).slice(0,n||12).map(x=>x.h);
}
function notePlay(it){
  if(!it||!it.id)return;
  const e=hist[it.id]||{id:it.id};
  e.title=it.title;e.artist=it.artist||'';if(it.thumb)e.thumb=it.thumb;
  e.count=(e.count||0)+1;e.last=Date.now();hist[it.id]=e;
  const keys=Object.keys(hist).sort((a,b)=>hist[b].last-hist[a].last);
  if(keys.length>400){const nh={};keys.slice(0,400).forEach(k=>nh[k]=hist[k]);hist=nh}
  LSset('ml_history',hist);
}

/* ============ home sections ============ */
async function renderHome(){
  const sec=$('#homeSec');
  const recent=topRecent(12),scored=topScored(10),arts=topArtists(3);
  let h=`<div class="chips">${['Energize','Party','Relax','Sad','Focus','Workout'].map(m=>`<button class="chip" data-chip="${m}">${m}</button>`).join('')}</div>`;
  const none=!Object.keys(hist).length;
  quickList=scored;
  if(!none){
    if(recent.length)h+=`<div class="sec"><h2>Listen again</h2>${railHTML(recent,'la')}</div>`;
    h+=`<div class="sec"><h2>Quick picks<button class="go" data-qp="1">Play all</button></h2>${listHTML(quickList)}</div>`;
    if(arts.length)h+=`<div class="sec"><h2>Albums for you</h2><div class="railwrap" id="albRail">${typeof skRail==='function'?skRail(6):'<div class="empty">Loading your albums…</div>'}</div></div>`;
    h+=`<div class="sec"><h2>Surprise me<button class="go" id="diceBig">🎲 Play a radio from your taste</button></h2><div class="empty" style="padding:6px 2px">Your radio never jumps between languages — it seeds from what you listen to most.</div></div>`;
  }else{
    h+=`<div class="sec"><h2>Welcome to Svara</h2><div class="empty">Search any song and press play.<br>After a few songs, Home fills with <b>Listen again</b>, <b>Quick picks</b> and <b>Albums for you</b> — all from your taste.</div></div>`;
    h+=`<div class="sec"><h2>Popular right now</h2><div id="startRail">${typeof skRail==='function'?skRail(6):'<div class="empty">Loading…</div>'}</div></div>`;
  }
  sec.innerHTML=h;
  // background starter content for empty profile
  if(none){try{const r=await fetch('/api/search?q=trending');const j=await r.json();const it=(j.items||[]).slice(0,12);$('#startRail').innerHTML=railHTML(it,'start');if(typeof skReveal==='function')skReveal(document.getElementById('startRail'));}catch(e){$('#startRail').innerHTML=''}}
  // albums for you
  if(!none&&arts.length){
    try{
      let cards='';
      for(const a of arts){
        try{
          const r=await fetch('/api/search?q='+encodeURIComponent(a)+'&type=album');
          const j=await r.json();
          (j.items||[]).slice(0,4).forEach(al=>{cards+=railCard(al,'al')});
        }catch(e){/* skip artist */}
      }
      $('#albRail').innerHTML=cards?`<div class="railwrap">${cards}</div>`:'<div class="empty">No albums found yet — keep listening and this fills with your artists’ albums.</div>';
      if(typeof skReveal==='function')skReveal(document.getElementById('albRail'));
    }catch(e){$('#albRail').innerHTML='<div class="empty">Could not load albums right now.</div>'}
  }
}

/* ============ playback ============ */
function nowItem(){return cur>=0&&seq[cur]!=null&&queue[seq[cur]]?queue[seq[cur]]:null}
/* ============ Wave 4AE: the stream is still being fetched ============
   A cold /api/stream measured 0.7-4.9s, and until now the UI showed nothing at all while
   it was in flight: the mini player printed the artist line as if playback had already
   started. `pendStart` is the id whose stream is being fetched — loadAt() arms it, the
   audio element's OWN events disarm it; nothing else. While armed, the now-playing
   surfaces read "Starting…" instead of the artist line. The play/pause icon and every
   transport control keep their existing behaviour. */
var pendStart=null;
function startingNow(){return !!(pendStart && nowItem() && nowItem().id===pendStart)}
/* True when the element no longer NAMES the pending stream. Setting a NEW src makes the
   element fire `abort`/`emptied` for the OLD load — that must not be mistaken for "playback
   was stopped", or the state would clear ~7ms after it was armed (measured).
   The src ATTRIBUTE is the only reliable witness: `audio.currentSrc` still reports the
   PREVIOUS resource while the new load is aborting, so trusting it here cleared the state
   immediately and hid the real failure path. */
function pendStreamGone(){
  if(!pendStart)return true;
  var a=String(audio.getAttribute('src')||'');
  if(!a)return true;                     // src removed ⇒ nothing is being fetched any more
  return a.indexOf(pendStart)<0;         // a different track was requested instead
}
/* Repaint ONLY the artist / “Starting…” line: the mini player, the full player, and —
   when the player page is actually open — the queue's now-playing row.
   FALLBACK only: the v3js layer owns the real markup (artistLinksHTML is private to that
   block) and replaces this function below. Kept so a surface can never go blank if that
   layer is absent. Never setNowUI(): that would re-run setTheme()/resetLyrics() for a
   track that is already loaded. */
var paintStarting=function(){
  var it=nowItem(); if(!it)return;
  var sub=startingNow()?'Starting…':(it.artist||'');
  var ms=document.getElementById('mSub'); if(ms)ms.textContent=sub;
  var pa=document.getElementById('pvA'); if(pa)pa.textContent=sub;
  if(document.body.classList.contains('pv'))renderQueue();
};
/* `playing`/`error` always clear; `emptied`/`abort` clear only when the element really
   stopped pointing at the pending stream — so a failed stream can never leave
   "Starting…" stuck, and a new load can never clear the state it just armed. */
['playing','error','emptied','abort'].forEach(function(ev){
  audio.addEventListener(ev,function(){
    if(!pendStart)return;
    if((ev==='emptied'||ev==='abort')&&!pendStreamGone())return;
    pendStart=null;
    paintStarting();
  });
});
function setNowUI(it){
  const art=thumb(it);
  const sub0=startingNow()?'Starting…':(it.artist||'');
  $('#mTitle').textContent=it.title;$('#mSub').textContent=sub0;
  $('#pvT').textContent=it.title;$('#pvA').textContent=sub0;
  const ma=$('#mArt'),pa=$('#pvImg');
  if(art){ma.src=art;ma.style.display='';pa.src=art;$('#pvArtBg').style.backgroundImage=`url("${art}")`;$('#mArtPh').style.display='none'}
  else{ma.style.display='none';pa.removeAttribute('src');$('#pvArtBg').style.backgroundImage='';$('#mArtPh').style.display='flex'}
  $('#pvCtx').textContent=queue.length?`Playing from ${queue[seq[cur]]?.artist||'your queue'}`:'';
  paintFavs();setTheme(art);resetLyrics();
}
function loadAt(seqPos,autoplay=true){
  if(!queue.length)return;
  if(seqPos<0||seqPos>=seq.length)return;
  cur=seqPos;const it=queue[seq[cur]];if(!it)return;
  pendStart=it.id;               // 4AE: a new track always re-arms the “Starting…” state
  audio.src='/api/stream?id='+it.id;
  setNowUI(it);
  if(autoplay)audio.play().catch(()=>{ if(pendStart===it.id){pendStart=null;paintStarting()} });   // 4AE: a refused play() must not leave “Starting…” stuck
  renderQueue();paintRowCursor();
}
function playList(list,idx,openPv){
  if(!list||!list.length)return;
  queue=list.slice();register(queue);
  const n=queue.length;const rest=[...Array(n).keys()].filter(i=>i!==idx);
  if(shuffle){for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}}
  seq=[idx,...rest];cur=-1;
  loadAt(0,true);
  if(openPv)openPV();
}
function syncSeq(keepId){
  if(!queue.length){seq=[];cur=-1;return}
  let c=-1;
  if(keepId)c=queue.findIndex(x=>x.id===keepId);
  if(c<0)c=Math.max(0,queue.findIndex(x=>x.id===(nowItem()?.id)));
  if(c<0)c=0;
  const rest=[...Array(queue.length).keys()].filter(i=>i!==c);
  if(shuffle){for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}}
  seq=[c,...rest];cur=0;
}

async function downloadTrack(it){
  if(!it)return;
  try{
    toast('Downloading “'+it.title+'”…');
    const r=await fetch('/api/download?id='+it.id);
    if(!r.ok){const j=await r.json().catch(()=>null);throw new Error(j?.error||'download failed')}
    const blob=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(it.title||'track').replace(/[\\/:*?"<>|]/g,'')+'.m4a';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Downloaded');
  }catch(e){toast('Download failed: '+e.message)}
}

function resetLyrics(){

async function loadLyrics(){
  const it=nowItem();if(!it)return;
  const p=lyrPref;
  const lt=$('#lyrT');if(lt)lt.innerHTML=esc(it.title)+'<span>'+esc(it.artist||'')+'</span>';
  lyr.loadedFor=it.id+':'+p;
  $('#lyrBody').innerHTML='<div class="lyrmissing">Loading lyrics…</div>';
  const qs=p==='ytm'
    ?'/api/lyrics?provider=ytm&id='+encodeURIComponent(it.id)
    :'/api/lyrics?provider=lrclib&id='+encodeURIComponent(it.id)+'&title='+encodeURIComponent(it.title)+'&artist='+encodeURIComponent(it.artist||'')+'&duration='+Math.round(audio.duration||0);
  try{
    const r=await fetch(qs);const j=await r.json();
    if(j.error){
      // auto fallback ytm -> lrclib
      if(p==='ytm'&&lyrPref==='ytm'){
        lyrPref='lrclib';saveAll();$('#lYT').classList.remove('on');$('#lLR').classList.add('on');
        lyr.loadedFor=null;loadLyrics();return;
      }
      $('#lyrBody').innerHTML=`<div class="lyrmissing">${esc(j.error)}<br><br>Tip: switch provider above or try another track.</div>`;
      return;
    }
    lyr.plain=j.plain||'';lyr.synced=j.synced||'';lyr.cur=-1;
    renderLyricsBody();
  }catch(e){$('#lyrBody').innerHTML='<div class="lyrmissing">Lyrics failed to load.</div>'}
}
function renderLyricsState(){
  const body=$('#lyrBody');
  if(!body)return;
  const it=nowItem();
  if(!it){body.innerHTML='<div class="lyrmissing">Nothing playing.</div>';return}
  body.innerHTML='<div class="lyrmissing">Loading lyrics…</div>';
}
function renderLyricsBody(){
  const body=$('#lyrBody');
  if(!body)return;
  clearInterval(lyr.timer);lyr.timer=null;
  const it=nowItem();
  if(!it){body.innerHTML='<div class="lyrmissing">Nothing playing.</div>';return}
  if(lyr.synced){
    const lines=parseLrc(lyr.synced);
    if(lines.length){
      body.innerHTML=lines.map((_,i)=>`<div class="l" id="l${i}"></div>`).join('');
      lyr.cur=-1;
      const paint=()=>{
        const t=audio.currentTime||0;
        let idx=lines.length-1;for(let i=0;i<lines.length;i++){if(t>=lines[i].t)idx=i;else break}
        if(idx!==lyr.cur){
          if(lyr.cur>=0)body.children[lyr.cur]?.classList.remove('on');
          lyr.cur=idx;
          const el=body.children[idx];if(el){el.classList.add('on');el.textContent=lines[idx].x;if(el.scrollIntoView)el.scrollIntoView({block:'center',behavior:'smooth'})}
        }
      };
      paint();
      lyr.timer=setInterval(()=>{if(!$('#pv').classList.contains?true:document.body.classList.contains('pv'))paint()},500);
      body.style.whiteSpace='';
      return;
    }
  }
  body.innerHTML=lyr.plain
    ?lyr.plain.split('\n').map(l=>`<div class="l">${esc(l)||'&nbsp;'}</div>`).join('')
    :'<div class="lyrmissing">No lyrics found for this track.</div>';
}
function parseLrc(s){
  const out=[];
  (s||'').split('\n').forEach(line=>{
    const re=/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]\s*(.*)/;
    let m=re.exec(line),off=0;
    while(m){
      let ms=m[3]?+(m[3].length===2?m[3]+'0':m[3].padEnd(3,'0')):0;
      out.push({t:(+m[1])*60+(+m[2])+ms/1000,x:m[4]});
      off=m[0].length;
      const rest=line.slice(off);m=re.exec(rest);if(!rest)break;
      if(!m)break;
    }
  });
  return out;
}

/* tabs */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  const lyrOn=t.dataset.tab==='lyr';
  $('#pvLyrics').hidden=!lyrOn;$('#pvQueue').hidden=lyrOn;$('#pvHead').hidden=lyrOn;$('#pvCtx').hidden=lyrOn;

    <div class="lyrseg" id="lyrSeg">

document.addEventListener('keydown',e=>{

<script id="v2js">
/* ================= Svara v2 behaviour ================= */
(function(){

var ic=function(id){return '<svg><use href="#'+id+'"/></svg>'};

/* 1) fix mirrored prev/next, add pin + expand icons (#1) */
var sx=document.getElementById('i-next'), sp=document.getElementById('i-prev');

  };

  add('i-collapse','<path d="M9 4v5H4"/><path d="M15 20v-5h5"/><path d="M20 9h-5V4"/><path d="M4 15h5v5"/>');
})();

/* 2) rebuild the scrubber row: controls first, times flanking the bar (#17) */
(function(){
  var ctrl=document.querySelector('.pvctrl'); if(!ctrl||document.getElementById('pseekWrap'))return;
  var input=document.getElementById('pseek'), times=ctrl.querySelector('.ptimes'), btns=ctrl.querySelector('.pbtns');
  var tc=document.getElementById('tCur'), td=document.getElementById('tDur');
  if(!input||!btns||!tc||!td)return;
  tc.classList.add('ptime'); td.classList.add('ptime');
  var wrap=document.createElement('div'); wrap.className='pseekwrap'; wrap.id='pseekWrap';
  wrap.innerHTML='<div class="psTrack"><div class="psFill" id="psFill"></div><div class="psGhost" id="psGhost"></div></div>';
  wrap.appendChild(input);
  var tip=document.createElement('div'); tip.className='psTip'; tip.id='psTip'; tip.hidden=true; wrap.appendChild(tip);
  var row=document.createElement('div'); row.className='pseekrow'; row.appendChild(tc); row.appendChild(wrap); row.appendChild(td);
  if(times)times.remove();
  ctrl.replaceChildren(btns,row);
})();

/* 3) fill + hover preview + duration + volume (#19 #18 #33) */
var psFill=$('#psFill'), psGhost=$('#psGhost'), psTip=$('#psTip'), psWrap=$('#pseekWrap');
function paintSeek(){
  if(!psFill)return;
  var d=audio.duration||0;
  psFill.style.width=(d?((audio.currentTime||0)/d*100):0).toFixed(2)+'%';
}
audio.addEventListener('timeupdate',paintSeek);
audio.addEventListener('loadedmetadata',function(){$('#tDur').textContent=fmt(audio.duration||0);paintSeek();});
audio.addEventListener('durationchange',function(){$('#tDur').textContent=fmt(audio.duration||0);});
if(psWrap&&psTip&&psGhost){
  psWrap.addEventListener('mousemove',function(e){
    var d=audio.duration||0; if(!d)return;
    var r=psWrap.getBoundingClientRect();
    var h=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    var p=Math.max(0,Math.min(1,(audio.currentTime||0)/d));
    var a=Math.min(p,h), b=Math.max(p,h);
    psGhost.style.left=(a*100)+'%'; psGhost.style.width=((b-a)*100)+'%'; psGhost.style.opacity=1;
    psTip.hidden=false; psTip.textContent=fmt(h*d); psTip.style.left=(h*100)+'%';
  });

}
var volEl=$('#vol'); if(volEl)volEl.style.setProperty('--v',(volEl.value||80)+'%');

/* 4) true album-art theming (#2) with a race guard (#40) */
var themeToken=0, themeRaf=0, themeCur={acc:[255,92,122],acc2:[168,85,247],accTx:[255,143,163]};
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2,d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h/=6;}return [h,s,l];}
function hsl2rgb(h,s,l){var r,g,b;if(!s){r=g=b=l}else{var q=l<.5?l*(1+s):l+s-l*s,p=2*l-q,f=function(t){if(t<0)t+=1;if(t>1)t-=1;

function themeAnimate(acc,acc2,accTx){
  cancelAnimationFrame(themeRaf);
  var from={acc:themeCur.acc.slice(),acc2:themeCur.acc2.slice(),accTx:themeCur.accTx.slice()};
  var t0=performance.now(),D=520;
  var step=function(now){
    var t=Math.min(1,(now-t0)/D), e=t*t*(3-2*t);
    var mix=function(a,b){return a.map(function(v,i){return Math.round(v+(b[i]-v)*e)})};
    var A=mix(from.acc,acc),B=mix(from.acc2,acc2),T=mix(from.accTx,accTx),s=document.documentElement.style;
    s.setProperty('--acc','rgb('+A.join(',')+')');
    s.setProperty('--acc2','rgb('+B.join(',')+')');
    s.setProperty('--grad','rgb('+A.join(',')+')');
    s.setProperty('--amb',A.join(','));
    s.setProperty('--amb2',A.join(','));
    s.setProperty('--acc-tx','rgb('+T.join(',')+')');
    themeCur={acc:A,acc2:B,accTx:T};
    if(t<1)themeRaf=requestAnimationFrame(step);
  };

window.setTheme=function(url){
  var token=++themeToken;
  if(!url)return;
  var im=new Image();
  im.onload=function(){
    if(token!==themeToken)return;
    try{
      var c=document.createElement('canvas'); c.width=c.height=64;
      var ctx=c.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(im,0,0,64,64);
      var d=ctx.getImageData(0,0,64,64).data,bk={};
      for(var i=0;i<d.length;i+=4){
        if(d[i+3]<200)continue;
        var r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
        if(mx<38)continue;
        if(!mx||(mx-mn)/mx<0.18)continue;
        var k=((r>>5)<<10)|((g>>5)<<5)|(b>>5);
        var e=bk[k]||(bk[k]={n:0,r:0,g:0,b:0});
        e.n++;e.r+=r;e.g+=g;e.b+=b;
      }
      var cand=Object.keys(bk).map(function(k){
        var e=bk[k],r=e.r/e.n,g=e.g/e.n,b=e.b/e.n,mx=Math.max(r,g,b),mn=Math.min(r,g,b);

      }).sort(function(x,y){return y.s-x.s});
      if(!cand.length)return;
      var hsl=rgb2hsl(cand[0].r,cand[0].g,cand[0].b);
      var acc=hsl2rgb(hsl[0],Math.min(0.92,Math.max(0.52,hsl[1])),Math.min(0.62,Math.max(0.46,hsl[2])));

      var acc2=hsl2rgb(hsl[0],Math.min(0.85,Math.max(0.42,hsl[1]*0.9)),Math.min(0.7,Math.max(0.52,hsl[2]+0.06)));

      var th=document.getElementById('theme');
      if(th){
        th.style.opacity=0;
        requestAnimationFrame(function(){

        });

    }catch(e){}
  };

};

var pins=LSget('sv_pins',[])||[], v2Page={t:null,name:null};

/* 6) queue: play next / add / remove (#13 #14 #15 #30) */
insertNext=function(it){
  if(!it)return;
  var curIt=nowItem();
  if(curIt&&curIt.id===it.id){toast('Already playing');return}
  var qi=queue.findIndex(function(x){return x.id===it.id});
  if(qi<0){queue.push(it);register([it]);qi=queue.length-1}
  seq=seq.filter(function(s){return s!==qi});
  if(cur<0||!curIt){seq.unshift(qi);cur=0;loadAt(0,true)}
  else{
    var ci=queue.findIndex(function(x){return x.id===curIt.id});
    var at=seq.indexOf(ci);
    seq.splice(at<0?seq.length:at+1,0,qi);
    cur=seq.indexOf(ci);
  }
  renderQueue();toast('Playing next');
};
addQueue=function(it){
  if(!it)return;
  if(queue.findIndex(function(x){return x.id===it.id})>=0){toast('Already in queue');return}
  register([it]);
  var wasEmpty=!queue.length;
  queue.push(it);
  if(wasEmpty){seq=[0];cur=0;loadAt(0,true)}
  else seq.push(queue.length-1);
  renderQueue();
  toast(wasEmpty?'Playing':'Added to queue');
};
removeFromQueue=function(id){
  var curIt=nowItem(), curId=curIt?curIt.id:null;
  var qi=queue.findIndex(function(x){return x.id===id}); if(qi<0)return;
  var wasCur=curId===id;
  queue.splice(qi,1);
  if(!queue.length){seq=[];cur=-1;audio.pause();audio.removeAttribute('src');$('#mTitle').textContent='Nothing playing';$('#mSub').textContent='';paintControls();renderQueue();return}
  if(wasCur){seq=[];for(var i=0;i<queue.length;i++)seq.push(i);cur=0;loadAt(0,true);renderQueue();toast('Removed from queue');return}
  seq=seq.filter(function(s){return s!==qi}).map(function(s){return s>qi?s-1:s});
  var ci=queue.findIndex(function(x){return x.id===curId});
  cur=seq.indexOf(ci);
  if(cur<0){seq.unshift(ci);cur=0}
  renderQueue();toast('Removed from queue');
};

/* 8) lyrics: sync + click-to-seek + big view + fullscreen (#25 #26 #27) */
var lyrToken=0, lyrAuto=true, lyrAutoT=null;
function parseLrc2(s){
  var out=[];
  String(s||'').split('\n').forEach(function(line){
    var tags=line.match(/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g);
    if(!tags)return;
    var text=line.replace(/\[[^\]]*\]/g,'').trim();
    tags.forEach(function(tag){
      var m=tag.match(/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/); if(!m)return;
      var frac=m[3]||'';
      var ms=frac?(frac.length===1?+frac*100:frac.length===2?+frac*10:+frac):0;
      out.push({t:(+m[1])*60+(+m[2])+ms/1000,x:text});
    });
  });
  out.sort(function(a,b){return a.t-b.t});
  return out;
}

}

    '<button class="lyrbtn" id="lyrFull" title="Fullscreen lyrics"><span class="ic">'+ic('i-expand')+'</span></button></div>'+
    '<div id="lyrBody"></div>';
  paintLyrChip();
  $('#lYT').onclick=function(){lyrPref='ytm';saveAll();paintLyrChip();lyr.loadedFor=null;loadLyrics()};
  $('#lLR').onclick=function(){lyrPref='lrclib';saveAll();paintLyrChip();lyr.loadedFor=null;loadLyrics()};
  $('#lyrFull').onclick=toggleLyrFull;
}
loadLyrics=async function(){
  var body=$('#lyrBody'); if(!body)return;
  var it=nowItem();
  if(!it){body.innerHTML='<div class="lyrmissing">Nothing playing.</div>';return}
  var token=++lyrToken;
  lyr.loadedFor=it.id+':'+(lyrPref||'auto');
  var t=$('#lyrT'); if(t)t.innerHTML=esc(it.title)+'<span>'+esc(it.artist||'')+'</span>';
  body.innerHTML='<div class="lyrmissing">Loading lyrics…</div>';
  var qs=new URLSearchParams();
  qs.set('provider',(lyrPref==='ytm'||lyrPref==='lrclib')?lyrPref:'auto');
  qs.set('id',it.id); qs.set('title',it.title||''); qs.set('artist',it.artist||'');
  var dur=audio.duration||0; if(dur>0)qs.set('duration',String(Math.round(dur)));
  try{
    var r=await fetch('/api/lyrics?'+qs.toString());
    var j=await r.json();
    if(token!==lyrToken)return;
    lyr.plain=j.plain||''; lyr.synced=j.synced||''; lyr.note=j.note||''; lyr.error=j.error||''; lyr.lines=[];
    renderLyricsBody();
  }catch(e){
    if(token!==lyrToken)return;
    body.innerHTML='<div class="lyrmissing">Lyrics failed to load.</div>';
  }
};
renderLyricsBody=function(){
  var body=$('#lyrBody'); if(!body)return;
  clearInterval(lyr.timer); lyr.timer=null; lyr.cur=-1; lyr.lines=[];
  var note=lyr.note?'<div class="lyrnote">'+esc(lyr.note)+'</div>':'';
  if(lyr.synced){
    var lines=parseLrc2(lyr.synced);
    if(lines.length){
      lyr.lines=lines;
      body.innerHTML=note+lines.map(function(l,i){
        return '<div class="l sync" id="l'+i+'" data-i="'+i+'" data-t="'+l.t+'">'+(esc(l.x)||'&nbsp;')+'</div>';
      }).join('');
      paintLyrics(true);
      lyr.timer=setInterval(function(){paintLyrics(false)},240);
      return;
    }
  }
  if(lyr.plain){
    body.innerHTML=note+lyr.plain.split('\n').map(function(l){return '<div class="l">'+(esc(l)||'&nbsp;')+'</div>'}).join('');
    return;
  }
  body.innerHTML=lyr.error?('<div class="lyrmissing">'+esc(lyr.error)+'</div>'):'<div class="lyrmissing">No lyrics found for this track.</div>';
};
function paintLyrics(force){
  var body=$('#lyrBody'), lines=lyr.lines;
  if(!body||!lines||!lines.length)return;
  var t=audio.currentTime||0, lo=0, hi=lines.length-1, idx=-1;
  while(lo<=hi){var mid=(lo+hi)>>1; if(lines[mid].t<=t){idx=mid;lo=mid+1} else hi=mid-1}
  if(idx===lyr.cur&&!force)return;
  var prev=lyr.cur>=0?body.querySelector('#l'+lyr.cur):null;
  if(prev)prev.classList.remove('on');
  lyr.cur=idx;
  if(idx<0)return;
  var el=body.querySelector('#l'+idx); if(!el)return;
  el.classList.add('on');
  if(lyrAuto&&el.scrollIntoView){try{el.scrollIntoView({block:'center',behavior:force?'auto':'smooth'})}catch(e){}}
}

/* 9) live search suggestions (#21) */
var sugTimer=null, sugToken=0;
/* D1: a TOP RESULTS row reads "Title • Artist • Duration". It rendered as
   "Starboy (feat. Daft Punk)The Weeknd • 3:51" because the title span and the meta span are both
   inline and nothing separated them — the separator is the row's own ' • '. The artist is a real
   link: the same attributes every other artist affordance carries (data-artist-id /
   data-artist-name), consumed by the artist layer's ONE delegated click handler — this block runs
   before it and adds no listener of its own. No channel id ⇒ the name still carries
   data-artist-name, which is the handler's existing lookup path (PLAN §9.3). */
function sugArtistHTML(it){
  var list=(it&&it.artists&&it.artists.length)?it.artists:((it&&it.artist)?[{name:it.artist,id:''}]:[]);
  return list.map(function(a){
    var n=(a&&a.name)?String(a.name):''; if(!n) return '';
    return '<span class="alink"'+(a.id?' data-artist-id="'+esc(a.id)+'"':'')+
      ' data-artist-name="'+esc(n)+'">'+esc(n)+'</span>';
  }).filter(Boolean).join(', ');
}
function renderSuggest(q){
  var el=$('#shist'); if(!el)return;
  if(!q){ ++sugToken; if(typeof renderSHist==='function')renderSHist(); return }   // 4AF: bump on the empty path too — a late failure can never repaint over “Recent searches”
  var token=++sugToken;
  el.hidden=false;
  /* 4AE: the dropdown used to stay completely empty for ~1.3s (280ms debounce + both
     fetches). This placeholder is the same `.shr` markup as a real suggestion row — so the
     panel keeps its exact height and cannot jump — but carries no data-sh / data-play-item,
     so it is inert, and `data-ph` keeps it out of the arrow-key row list below. The existing
     token guard still decides whether real rows are allowed to replace it. */
  el.innerHTML='<button class="shr" type="button" disabled data-ph="1"><span class="ic">'+ic('i-search')+'</span><span class="st">Searching…</span></button>';
  clearTimeout(sugTimer);
  sugTimer=setTimeout(function(){
    Promise.all([
      fetch('/api/suggest?q='+encodeURIComponent(q)).then(function(r){return r.json()}).catch(function(){return {failed:true}}),
      fetch('/api/search?q='+encodeURIComponent(q)).then(function(r){return r.json()}).catch(function(){return {failed:true}})
    ]).then(function(res){
      if(token!==sugToken)return;
      var f0=!!(res[0]&&res[0].failed), f1=!!(res[1]&&res[1].failed);
      var sugg=(!f0&&res[0]&&res[0].items||[]).slice(0,4);
      var items=(!f1&&res[1]&&res[1].items||[]).slice(0,6);
      if(f0 && f1){
        /* 4AF: BOTH fetches FAILED (server stopped / network down) — the inert "Searching…"
           row must be replaceable, not permanent. Swap it for an equally inert row instead of
           falsely claiming "No matches". The token guard above plus the still-current input
           value keep a late failure from repainting a newer query. */
        if($('#q').value.trim()===q)
          el.innerHTML='<button class="shr" type="button" disabled data-ph="1"><span class="ic">'+ic('i-search')+'</span><span class="st">Suggestions unavailable</span></button>';
        return;
      }
      if(!sugg.length&&!items.length){el.innerHTML='<div class="shgrp">No matches</div>';return}
      var h='';
      if(sugg.length)h+='<div class="shgrp">Suggestions</div>'+sugg.map(function(s){
        return '<button class="shr" data-sh="'+esc(s)+'"><span class="ic">'+ic('i-search')+'</span><span class="st">'+esc(s)+'</span></button>';
      }).join('');
      if(items.length){
        register(items);
        h+='<div class="shgrp">Top results</div>'+items.map(function(it){
          var meta=sugArtistHTML(it)+(it.duration?' • '+esc(it.duration):'');
          return '<button class="shr" data-play-item="'+esc(it.id)+'"><span class="kart"><img src="'+esc(thumb(it,THUMB_ROW))+'" onerror="this.style.display=\'none\'"></span>'+
            '<span style="flex:1;min-width:0"><span class="st">'+esc(it.title)+'</span>'+
            '<span class="subx">'+(meta?' • '+meta:'')+'</span></span></button>';
        }).join('');
      }
      el.innerHTML=h;
    });
  },280);
}
$('#q').addEventListener('input',function(){renderSuggest($('#q').value.trim())});
$('#q').addEventListener('focus',function(){if($('#q').value.trim())renderSuggest($('#q').value.trim())});
$('#q').addEventListener('keydown',function(e){
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
  var rows=$$('#shist .shr:not([data-ph])'); if(!rows.length)return;
  e.preventDefault();
  var i=rows.findIndex(function(r){return r.classList.contains('on')});
  i=e.key==='ArrowDown'?(i<0?0:Math.min(rows.length-1,i+1)):(i<=0?rows.length-1:i-1);
  rows.forEach(function(r,k){r.classList.toggle('on',k===i)});
  rows[i].scrollIntoView({block:'nearest'});
  $('#q').value=rows[i].dataset.sh||rows[i].querySelector('.st').textContent.trim();
});

/* 10) correct download extension (#41) */
downloadTrack=async function(it){
  if(!it)return;
  try{
    toast('Downloading “'+it.title+'”…');
    var r=await fetch('/api/download?id='+it.id);
    if(!r.ok){var j=await r.json().catch(function(){return null});throw new Error((j&&j.error)||'download failed')}
    var name=it.title||'track';
    var cd=r.headers.get('content-disposition')||'';
    var m=cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
    if(m){name=decodeURIComponent(m[1])}
    else{
      var ct=(r.headers.get('content-type')||'').toLowerCase();
      var ext=ct.indexOf('webm')>=0?'webm':ct.indexOf('ogg')>=0?'opus':ct.indexOf('mpeg')>=0?'mp3':'m4a';
      name=name+'.'+ext;
    }
    var blob=await r.blob();
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
    toast('Downloaded');
  }catch(e){toast('Download failed: '+e.message)}
};

paintSeek();
if(!$('#homeSec').hidden)renderHome();

<script id="v3seekjs">
(function(){
  var wrap=document.getElementById('pseekWrap');
  var input=document.getElementById('pseek');
  var fill=document.getElementById('psFill');
  if(!wrap||!input||!fill)return;

  var knob=document.getElementById('v3knob');
  if(!knob){knob=document.createElement('div');knob.id='v3knob';knob.className='v3knob';wrap.appendChild(knob)}

  var last=-2;
  function pct(){
    var d=audio.duration;
    if(!isFinite(d)||d<=0)return -1;           // live stream / not loaded yet
    var p=(audio.currentTime||0)/d*100;
    return p<0?0:(p>100?100:p);                // clamp: never past the end
  }
  function paint(){
    var p=pct();
    if(p<0){ if(last!==-1){last=-1;fill.style.width='0%';knob.style.opacity=0} return }
    if(p===last)return;
    last=p;
    knob.style.opacity=1;
    knob.style.left=p+'%';                     // same value as the fill → always aligned
    fill.style.width=p+'%';
  }
  try{paintSeek=function(){paint()}}catch(e){}  // lyrics click-to-seek + startup still work

  ['timeupdate','loadedmetadata','durationchange','seeked','playing','emptied','ended','pause']
    .forEach(function(ev){audio.addEventListener(ev,paint)});
  input.addEventListener('input',paint);
  input.addEventListener('change',paint);

  /* Wave 4AD — this used to be a PERMANENT rAF loop: it kept asking for a frame on
     every vsync of the app's whole lifetime, including while paused and while the
     track had no duration at all, i.e. it did per-frame work for a bar that could
     not move. It now runs ONLY while audio is actually playing or the seek bar is
     being dragged, and it is cancelled on pause/ended/emptied.
     Nothing else changed: every event-driven paint() call above is still registered,
     and paintSeek() still points at paint(), so play/pause/seek/ended/next-track and
     the lyrics click-to-seek all repaint immediately from their own listeners. */
  var rafId=0, draggingSeek=false;
  function wants(){ var d=audio.duration; return draggingSeek || (!audio.paused && isFinite(d) && d>0) }
  function frame(){ rafId=0; paint(); if(wants())rafId=requestAnimationFrame(frame) }
  function sync(){ if(wants()){ if(!rafId)rafId=requestAnimationFrame(frame) } else if(rafId){ cancelAnimationFrame(rafId);rafId=0 } }
  ['play','playing','pause','ended','emptied','loadedmetadata','durationchange','seeked']
    .forEach(function(ev){audio.addEventListener(ev,sync)});
  input.addEventListener('pointerdown',function(){ draggingSeek=true; sync() });
  ['pointerup','pointercancel'].forEach(function(ev){
    window.addEventListener(ev,function(){ if(!draggingSeek)return; draggingSeek=false; paint(); sync() });
  });
  paint(); sync();                                            // one immediate paint, then only if it can move
})();
</script>

<script id="v2auto">
/* Auto lyrics source: prefer whichever provider has time-synced lyrics */
(function(){

<script id="v3js">

/* ---------- BUG #1: recent searches ---------- */

/* ---------- BUG #2: seek bar ---------- */
function ensureKnob(){
  if(document.getElementById('v3knob')) return;
  var track = document.querySelector('.psTrack'); if(!track) return;
  var k = document.createElement('div'); k.id='v3knob'; k.className='v3knob';

}
var _paintSeek = paintSeek;
paintSeek = function(){
  try{ _paintSeek() }catch(e){}
  var d = audio.duration||0;
  var pct = d>0 ? Math.max(0, Math.min(100, (audio.currentTime||0)/d*100)) : 0;
  var fillEl = document.getElementById('psFill');
  if(fillEl) fillEl.style.width = pct.toFixed(2)+'%';        // clamped — no more overshoot
  ensureKnob();
  var k = document.getElementById('v3knob');
  if(k) k.style.left = pct.toFixed(2)+'%';                   // knob centre === fill edge
};

/* ---------- BUG #6: Up Next in playback order ---------- */
renderQueue = function(){
  var el = $('#pvQueue'); if(!el) return;
  var it = nowItem();
  var ctx = $('#pvCtx'); if(ctx) ctx.textContent = it ? ('Playing from '+(it.artist||'your queue')) : 'Nothing playing';
  if(!queue.length){ el.innerHTML = '<div class="empty">Queue is empty — add songs from ⋮ → “Add to queue”.</div>';
    if($('#pvFab')) syncFab(); return }
  var curQi = it ? queue.findIndex(function(x){ return x.id===it.id }) : -1;
  var order = [];
  if(curQi>=0) order.push(curQi);
  var ci = seq.indexOf(curQi);
  var walk = ci>=0 ? seq.slice(ci+1).concat(seq.slice(0,ci)) : seq.slice();
  walk.forEach(function(qi){ if(qi>=0 && qi<queue.length && order.indexOf(qi)<0) order.push(qi) });
  queue.forEach(function(_,i){ if(order.indexOf(i)<0) order.push(i) });   // safety net
  el.innerHTML = order.map(function(qi,pos){
    var x = queue[qi]; if(!x) return '';
    var isCur = (pos===0 && curQi>=0);
    var A = artistLinksHTML(x);   // 4Z-b: computed once — an empty artist must not leave a stray " • "
    if(isCur && startingNow()) A = 'Starting…';   // 4AE: the now-playing row mirrors the stream state
    return '<div class="row '+(isCur?'cur':'')+'" data-q="'+qi+'" data-qid="'+esc(x.id)+'">'+
      '<div class="rt"><img loading="lazy" src="'+esc(thumb(x))+'" onerror="this.style.display=\'none\'">'+
        '<div class="ov"><span class="ic">'+ic(isCur?'i-vol':'i-play')+'</span></div></div>'+
      '<div class="rm"><div class="rtitle">'+esc(x.title)+'</div>'+
        '<div class="rsub">'+(isCur?'<span class="np">Now playing</span> · ':'')+A+
          (x.duration ? (A ? ' • ' : '')+esc(x.duration) : '')+'</div></div>'+
      '<div class="rr"><button class="dots" data-menu="'+esc(x.id)+'"><span class="ic">'+ic('i-dots')+'</span></button></div></div>';
  }).join('');
  register(queue);
  if($('#pvFab')) syncFab();
};
(function bindQueueClicks(){
  var q = document.getElementById('pvQueue'); if(!q) return;
  q.addEventListener('click', function(e){
    if(e.target.closest('[data-menu]')) return;              // ⋮ still works
    var row = e.target.closest('[data-qid]'); if(!row) return;
    e.preventDefault(); e.stopPropagation();
    var id = row.getAttribute('data-qid');
    var qi = queue.findIndex(function(x){ return x.id===id }); if(qi<0) return;
    var pos = seq.indexOf(qi); if(pos<0){ seq.push(qi); pos=seq.length-1 }
    cur = pos; loadAt(pos, true); renderQueue();
  }, true);
})();

/* ---------- BUG #7: page title ---------- */
var _showDyn = showDyn, _goHome = goHome;
showDyn = function(t,s,h){

  sView = _sPaint; _sPaint = false;

};
goHome = function(){

function homeLine(){

/* ---------- WAVE 1: clickable artist names + artist page ---------- */
/* Artist links are rendered in exactly one place and reused by rows, the
   now-playing bar and the artist page. No id ⇒ plain text, never a dead link. */
function artistLinksHTML(it){
  var flat = (it && it.artist) || '';
  var names = splitArtists(flat);
  /* No flat string? The METADATA is the identity — this is what stops album and video
     rows from rendering a blank artist line while `artists[]` sat there unused. */
  if(!names.length) names = (it.artists || []).map(a => a && a.name ? String(a.name).trim() : '').filter(Boolean);
  if(!names.length) return esc(flat);
  var norm = function(v){ return String(v == null ? '' : v).replace(/\s+/g,' ').replace(/^[,\s]+|[,\s]+$/g,'').toLowerCase() };
  var ids = {}, meta = it.artists || [];
  /* IDs come ONLY from `artists[]`. YouTube ships combined credits
     ("Lofi Sleep Chill & Study", "Alex Kennon, Joris Voorn") as ONE entry with ONE
     channel id; splitArtists() breaks those into display names, so an entry owns every
     name it contains. No exact/contained match ⇒ no id ⇒ probe, never a wrong artist. */
  meta.forEach(function(a){
    if(!a || !a.name) return;
    var m = norm(a.name); if(!m) return;
    if(!ids[m]) ids[m] = a.id || '';
    /* Separators become spaces so a trailing comma still matches: verified that these
       ARE the channels' real names — UC0_Ba_aRYYM8CWYVWdYe5cg → "Alex Kennon, Joris
       Voorn", UC1itStv5HQODNJr1zyUmDyg → "Lofi Sleep Chill & Study". */
    var hay = ' ' + m.replace(/[,&;×]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
    names.forEach(function(n){ var w = norm(n); if(!w || ids[w]) return; if(hay.indexOf(' '+w+' ') >= 0) ids[w] = a.id || '' });
  });
  return names.map(function(n){
    var id = ids[norm(n)] || '';
    return '<span class="alink"' + (id ? ' data-artist-id="'+esc(id)+'"' : '') +
      ' data-artist-name="'+esc(n)+'">'+esc(n)+'</span>';
  }).join(', ');
}
function subHTML(it){
  var a = artistLinksHTML(it);
  /* 4W-D2: the All list labels every row with its own type, so a song row reads
     "Song • <clickable artist> • 3:51" instead of the artist alone. `label` is attached to
     type=all search rows ONLY (server /api/search), so every other list keeps the exact output
     below — the label branch cannot fire anywhere else. */
  if(it && it.label){
    var parts = [esc(it.label)];
    if(a) parts.push(a);
    if(it.duration) parts.push(esc(it.duration));
    return parts.join(' • ');
  }
  /* 4Z-b: no artist ⇒ no stray " • ": render the duration alone. */
  return (it && it.duration) ? (a ? a + ' • ' + esc(it.duration) : esc(it.duration)) : a;
}
/* --- artist hero artwork (restored for Wave 4J, matching the full-bleed hero) ---
   VERIFIED: the artist header DOES carry a genuinely wide banner. Both banner hosts
   (lh3.googleusercontent.com and yt3.googleusercontent.com) serve ANY size token, so long
   as the `-p-` flag is kept: 7/7 artists returned 200 + 2400×1000 for "=w2400-h1000-p-l90-rj"
   (the banner's own aspect is exactly 2.4:1). /api/artist rewrites every size token to
   "=w544-h544-l90-rj", which some artists answer with a PORTRAIT or square crop
   (measured: 363×544, 544×544, 408×544) — that is the cropped-face square. So: ask for the
   wide token; if the URL is not on a banner host, keep whatever the API gave (shown unblurred,
   object-fit:cover) — never stretched into a box. */
function heroArt(a){
  var raw = (a && (a.banner || a.thumb || '')) || '';
  /* one artwork shape everywhere: v3art's normaliser decides whether this is a real URL */
  var u = (typeof window.artURL === 'function') ? window.artURL(raw) : raw;
  if(!u) return '';
  if(/^https:\/\/(lh3|yt3)\.googleusercontent\.com\//.test(u)){
    /* ask BOTH banner hosts for the widest 2.4:1 token. The API normalises artwork
       to =w544… (=w544 → a bad 363×544 portrait / 544×544 square crop), and some
       hosts ship other shapes (=s544…) or none at all, so replace whatever token
       is there — never use the 544 crop for the hero. */
    var hero = '=w2400-h1000-p-l90-rj';
    return /=\w[^"?]*$/.test(u) ? u.replace(/=\w[^"?]*$/, hero) : u + hero;
  }
  return u;
}
/* --- artist song rows: thumbnail | title | artist | album | duration ---
   One renderer for the 5-row preview AND the Show-all list. `data-artrow`
   is handled by the delegated artist handler, so a click queues the FULL
   catalogue from that row (not the 5-row preview). Album comes from `sub`
   (Wave 4A); there is no plays column by decision (§6 item 7). */
function artSongRowHTML(it){

  return '<div class="row artrow ' + (cur ? 'cur' : '') + '" data-artrow="'+esc(it.id)+'" data-id="'+esc(it.id)+'">'+
    /* Wave 4I — deferred: NO src until v3art's IntersectionObserver promotes data-src. */

      '<div class="ov"><span class="ic">'+ic('i-play')+'</span></div></div>'+
    '<div class="rm"><div class="rtitle">'+esc(it.title)+'</div>'+
      '<div class="rsub">'+artistLinksHTML(it)+'</div></div>'+
    '<div class="artalb">'+esc(it.sub||'')+'</div>'+
    '<div class="artdur">'+esc(it.duration||'')+'</div>'+
    '<div class="rr">'+(favs[it.id] ? '<span class="likedH">'+ic('i-heart')+'</span>' : '')+
    '<button class="dots" data-menu="'+esc(it.id)+'"><span class="ic">'+ic('i-dots')+'</span></button></div></div>';
}
function artSongsHTML(items){ return '<div class="list">'+(items||[]).map(artSongRowHTML).join('')+'</div>' }
/* rowHTML lives in the base layer and is used by search results, home rows,
   liked/playlists and the artist top-songs list. Same markup, artist names

var _rowHTML = rowHTML;
rowHTML = function(it){

/* railCard lives in the base layer and is used by the Home rails ("Listen again",
   "Albums for you", the trending rail) — and by railHTML(). Same markup, the artist

var _railCard = railCard;
railCard = function(it, ctx){
  var ph = thumb(it,THUMB_RAIL) ? '' : '<div class="ph"><span class="ic">'+ic('i-disc')+'</span></div>';
  return '<div class="rail" data-rail="'+esc(ctx)+'" data-id="'+esc(it.id)+'" data-title="'+esc(it.title||'')+'">'+

      '<div class="ov"><span class="pb">'+ic('i-play')+'</span></div></div>'+
    '<div class="rname">'+esc(it.title)+'</div>'+
    '<div class="rsub2">'+artistLinksHTML(it)+'</div></div>';
};
/* now-playing bar artist. Runs after the base textContent so it wins;
   the v3art wrapper still works because it wraps this wrapper. */
var _setNowA = setNowUI;
setNowUI = function(it){
  _setNowA(it);
  /* 4Z-b: when a track has NO artist, the line shows its duration instead of going blank
     (and never a stray " • "). With an artist present this is exactly the old link markup. */
  var A = artistLinksHTML(it || {});
  var line = (!A && it && it.duration) ? esc(it.duration) : A;
  /* 4AE: this is the LAST writer of #pvA / #mSub, so the pending-stream state must be
     honoured here as well or it would overwrite the base layer's “Starting…”. */
  if(startingNow()) line = 'Starting…';
  var a = document.getElementById('pvA');
  if(a) a.innerHTML = line;
  /* mini bar: the ARTIST, as a real link. Set here (after the base textContent) so no
     other layer can leave the album there; the delegated handler stopPropagation()s the
     click, so this opens the artist page instead of the full player (#miniOpen). */
  var s = document.getElementById('mSub');
  if(s) s.innerHTML = line;
};
/* 4AE: the LAST writer of #pvA / #mSub owns this repaint, because artistLinksHTML() is
   private to this block. Identical line construction to the wrapper above, so clearing the
   pending state restores the real artist LINK rather than leaving plain text behind. */
paintStarting = function(){
  var it = nowItem(); if(!it) return;
  var A = artistLinksHTML(it || {});
  var line = (!A && it.duration) ? esc(it.duration) : A;
  if(startingNow()) line = 'Starting…';
  var a = document.getElementById('pvA'); if(a) a.innerHTML = line;
  var s = document.getElementById('mSub'); if(s) s.innerHTML = line;
  if(document.body.classList.contains('pv')) renderQueue();
};

/* --- the artist view: lives in #scroll, replaces #homeSec / #dynSec --- */
var artPrev = null, artData = null;
var artFull = [], artFullReq = null, artListOpen = false;   // artFull = full catalogue (§9.2)
// Navigation generation. Artist look-ups are async (a name-only link needs a /api/artist?name=
// round trip); if the user goes Back before it lands, the late response must NOT re-open the view.
var artGen = 0;
/* the artist's WHOLE catalogue (up to 150 rows) from /api/artist/songs.
   Prefetched when the page opens so a row click can start from that row. */
function loadArtistSongs(){
  if(artFull.length) return Promise.resolve(artFull);
  if(artFullReq) return artFullReq;
  var id = (artData && artData.id) || '';
  if(!id) return Promise.resolve([]);
  artFullReq = fetch('/api/artist/songs?id='+encodeURIComponent(id))
    .then(function(r){ return r.json() })
    .then(function(j){
      var songs = ((j && j.songs) || []).filter(function(x){ return x && x.id && x.kind!=='album' });
      if(songs.length){ artFull = songs; register(songs) }
      return artFull;
    })
    .catch(function(){ artFullReq = null; return [] });
  return artFullReq;
}
function artSection(){
  var el = document.getElementById('artSec');
  if(!el){
    el = document.createElement('div');
    el.id = 'artSec'; el.hidden = true;
    var sc = document.getElementById('scroll');
    if(sc) sc.insertBefore(el, document.getElementById('dynSec') || null);
  }
  return el;
}
function hideArtist(){
  var el = document.getElementById('artSec'); if(el) el.hidden = true;
  artPrev = null; artData = null; artFull = []; artFullReq = null; artListOpen = false;
  artGen++;                                  // invalidates any artist fetch still in flight
}
function rememberView(){
  if(artPrev) return;                       // nested artist click keeps the original view
  var pt = document.getElementById('pgTitle'), ps = document.getElementById('pgSub');
  artPrev = {
    home: document.getElementById('homeSec').hidden,
    dyn: document.getElementById('dynSec').hidden,
    page: curPage, list: curList.slice(), doc: document.title,
    t: pt.innerHTML, tHid: pt.hidden, tCls: pt.className,
    s: ps.textContent, sHid: ps.hidden
  };
}
function restoreView(){
  var el = document.getElementById('artSec'); if(el) el.hidden = true;
  artGen++;                                  // a pending look-up must not steal the view back
  var p = artPrev; artPrev = null; if(!p) return;
  document.getElementById('homeSec').hidden = p.home;
  document.getElementById('dynSec').hidden = p.dyn;
  curPage = p.page; curList = p.list;
  var pt = document.getElementById('pgTitle'), ps = document.getElementById('pgSub');
  pt.innerHTML = p.t; pt.hidden = p.tHid; pt.className = p.tCls;
  ps.textContent = p.s; ps.hidden = p.sHid;
  setNav(p.page === 'home' ? 'home' : null);
  try{ document.title = p.doc }catch(e){}
}
function albumCard(a){
  var ph = thumb(a,THUMB_RAIL) ? '' : '<div class="ph"><span class="ic">'+ic('i-disc')+'</span></div>';
  return '<div class="rail" data-artalbum="'+esc(a.id)+'" data-title="'+esc(a.title||'')+'">'+
    '<div class="art">'+ph+'<img loading="lazy" alt="" data-src="'+esc(thumb(a,THUMB_RAIL))+'" onerror="this.style.display=\'none\'">'+
      '<div class="ov"><span class="pb">'+ic('i-play')+'</span></div></div>'+
    '<div class="rname">'+esc(a.title)+'</div>'+
    '<div class="rsub2">'+(a.year ? esc(a.year) : esc(a.artist||''))+'</div></div>';
}
function relatedCard(a){
  var ph = thumb(a,THUMB_RAIL) ? '' : '<div class="ph"><span class="ic">'+ic('i-disc')+'</span></div>';
  return '<div class="art-relcard" data-artist-id="'+esc(a.id||'')+'" data-artist-name="'+esc(a.name||'')+'">'+
    '<div class="ring">'+ph+'<img loading="lazy" alt="" data-src="'+esc(thumb(a,THUMB_RAIL))+'" onerror="this.style.display=\'none\'"></div>'+
    '<div class="nm">'+esc(a.name)+'</div>'+
    (a.audience ? '<div class="ad">'+esc(a.audience)+'</div>' : '')+
  '</div>';
}
function renderArtist(a){
  artData = a; artListOpen = false;
  var el = document.getElementById('artSec'); if(!el) return;
  var top = a.topSongs || [], albums = a.albums || [], rel = a.related || [];
  var pic = heroArt(a);
  var aud = a.monthlyAudience || '';
  if(aud && !/monthly/i.test(aud)) aud += ' monthly audience';
  var h = '<button class="art-back" data-artback="1"><span class="ic">'+ic('i-back')+'</span>Back</button>';
  /* Wave 4D hero (restored for Wave 4J) — everything sits ON the clear full-bleed
     banner: name, monthly audience, the 2-line-clamped description with MORE/LESS, and
     Play all / Mix. `.art-fit` is the 2.4:1 floor; the hero grows when the description
     expands. The wide banner is the FIRST image in the view and the ONLY eager one
     (fetchpriority="high", never deferred), so it always wins the race; every other
     artist-page image is deferred by v3art's IntersectionObserver (data-src) and paced

/* 4Z: pickTopArtist() chooses which artist the TOP RESULT card names. The old rule ('first

   'the' dropped. */
function trNorm(s){

  try{ t = t.normalize('NFD').replace(/[\u0300-\u036f]/g,'') }catch(e){}

function trEdit(a, b){

function trAudience(sub){
  var s = String(sub == null ? '' : sub).toLowerCase().replace(/,/g,'');
  var m = s.match(/(\d+(?:\.\d+)?)\s*([kmb])\b/) || s.match(/(\d+(?:\.\d+)?)\s*subscribers?\b/);
  if(!m) return 0;
  var n = parseFloat(m[1]); if(!(n > 0)) return 0;
  var u = m[2] || '';
  return Math.round(n * (u === 'k' ? 1e3 : u === 'm' ? 1e6 : u === 'b' ? 1e9 : 1));
}
/* A candidate MATCHES the query when: the names are equal, OR a name token equals a query token,
   OR the query is a whole token of the name, OR the whole name is within a small edit distance of
   the query ('weekend' vs 'weeknd'). Fan profiles (label 'Profile') are NOT the artist and are
   never candidates — that is exactly the 'stranger' this card must not show. Among matches the
   LARGEST parsed audience wins; a tie keeps the earlier row. No match ⇒ null ⇒ no card. */
function pickTopArtist(rows, query){
  var q = trNorm(query); if(!q) return null;
  var qT = q.split(' '), best = null, bestAud = -1;
  for(var i=0;i<rows.length;i++){
    var r = rows[i]; if(!r || !r.id) continue;
    if(((r.kind) || 'track') !== 'artist') continue;
    if(r.label && r.label !== 'Artist') continue;
    var n = trNorm(r.title || r.artist || ''); if(!n) continue;
    var nT = n.split(' ');
    var cand = (n === q)
      || qT.some(function(t){ return t && nT.indexOf(t) >= 0 })
      || nT.indexOf(q) >= 0
      || (Math.abs(n.length - q.length) <= 2 && trEdit(n, q) <= 2);
    if(!cand) continue;
    var aud = trAudience(r.sub);
    if(aud > bestAud){ bestAud = aud; best = r }
  }
  return best;
}
/* 4Z: the TOP RESULT card. Only the All filter mixes row types, so only there can an artist
   genuinely sit at the top of the list. The card is NOT a result row — it is rendered ABOVE the
   list, carries no ⋮ menu, and is never counted in the header (paintSearch keeps counting
   `vis.length`). No MATCHING artist row ⇒ no card, and nothing else changes. The avatar reuses the
   row's own normalised artwork (`thumb`), never a new size token. */
function topResultHTML(vis){
  if(S.filter !== 'all') return '';
  var a = pickTopArtist(vis, S.q);
  if(!a || !a.id) return '';
  var name = a.title || a.artist || '';
  var art = thumb(a);
  var aud = a.sub || 'Artist';
  return '<div class="topres">'+
    '<div class="trart" data-artist-id="'+esc(a.id)+'" data-artist-name="'+esc(name)+'" title="Open artist page">'+
      (art ? '<img loading="lazy" alt="" src="'+esc(art)+'">' : '<span class="ic">'+ic('i-disc')+'</span>')+
    '</div>'+
    '<div class="trinfo">'+
      '<div class="trname" data-artist-id="'+esc(a.id)+'" data-artist-name="'+esc(name)+'">'+esc(name)+'</div>'+
      '<div class="traud">'+esc(aud)+'</div>'+
      '<div class="tracts">'+
        '<button class="trbtn" type="button" data-trshuffle="'+esc(a.id)+'" data-trname="'+esc(name)+'"><span class="ic">'+ic('i-dice')+'</span>Shuffle</button>'+
        '<button class="trbtn ghost" type="button" data-trmix="'+esc(a.id)+'" data-trname="'+esc(name)+'"><span class="ic">'+ic('i-dice')+'</span>Mix</button>'+
      '</div>'+
    '</div></div>';
}
/* 4W-TR: Shuffle / Mix CALL the artist page's own actions instead of reimplementing them. The
   artist page keeps its context in `artData`/`artFull`; the card seeds exactly that context for
   this artist and then invokes the SAME paths the page's buttons use:
     Shuffle → withArtistSongs(...) + playList(...,0,true)   (the page's Play all)
     Mix     → mixArtist()                                    (the page's Mix)
   openArtist()/hideArtist() reset artData/artFull on every navigation, so a seeded context can
   never leak into a later artist page. */
function topResultAction(mod, id, name){
  if(!id) return;
  artData = { id:id, name:name || '' };
  artFull = []; artFullReq = null;
  if(mod === 'mix'){ mixArtist(); return; }
  withArtistSongs(function(list){ playList(list, 0, true) });
}
function paintSearch(){
  /* 4W: type=all is YouTube's raw answer and can carry playlists/podcasts Svara can neither play
     nor open. They are dropped HERE, at render time, so the API stays an honest mirror and no dead
     row or “not playable” pill can appear. The header counts only the VISIBLE rows. */
  var vis = S.items.filter(function(it){ return ((it && it.kind) || 'track') !== 'other' });
  var html = topResultHTML(vis) +
             '<div class="list">'+vis.map(searchRowHTML).join('')+'</div>'+
             /* 4AE: a zero-row result must say WHICH zero it is — still paging, or honestly
                empty — instead of leaving a bare gap. The #v3sent sentinel is kept either way. */
             (vis.length ? '' : '<div class="empty">'+(S.next ? 'Loading results…' : 'No results for “'+esc(S.q)+'”.')+'</div>')+
             '<div class="v3sent" id="v3sent"></div>';
  _sPaint = true;                 // handshake: the showDyn wrapper learns this IS the search view
  showDyn('Results for “'+esc(S.q)+'”', vis.length+' '+sNoun(S.filter), html);
  /* curList feeds playList(): it must hold ONLY playable rows, otherwise clicking a song in a
     mixed type=all result set would queue albums and artists behind it. */
  curList = vis.filter(function(it){ return ((it && it.kind) || 'track') === 'track' }).slice();
  register(S.items);
  var sent = document.getElementById('v3sent');
  if(sent){
    /* All is a SINGLE YouTube batch with no continuation: never leave a “Loading more…” behind and
       never claim an “End of results” that would imply paging happened. */
    var paged = S.filter !== 'all';
    sent.textContent = (paged && !S.next && vis.length) ? 'End of results' : '';
  }
  syncFilters();
}
async function loadMore(){
  if(!S.sessionId || !S.next || S.loading || S.filter === 'all') return;
  /* 4L: bind this in-flight page to the search that asked for it — read both BEFORE the await.
     `st` is the state object we may write to (never the global `S`), `gen` the generation that
     owns it. `st !== S` after the await ⇒ a newer doSearch() replaced the state: drop the page. */
  var gen = Sg, st = S;
  st.loading = true;
  var s = document.getElementById('v3sent'); if(s) s.textContent = 'Loading more…';
  try{
    var r = await fetch('/api/search/next?sessionId='+encodeURIComponent(st.sessionId));
    var j = await r.json();
    /* 4L: a newer doSearch() has already replaced S — this response belongs to a query the user
       has moved on from, so drop it: no mutation, no paint. */
    if(gen !== Sg || st !== S){ st.loading = false; return }
    var add = j.items||[];
    if(add.length) st.items = st.items.concat(add);
    st.next = !!j.next;
    if(!add.length && !st.next) st.sessionId = null;
    /* loadMore is async: if the user has navigated away (artist page, album, home)
       while page 2 was in flight, repainting would call showDyn() and steal the view. */
    if(curPage!=='dyn'){ st.loading = false; return }
    paintSearch();
    var s2 = document.getElementById('v3sent');
    if(s2) s2.textContent = st.next ? '' : 'End of results';
  }catch(e){ st.next = false }
  st.loading = false;
}
doSearch = async function(q, record, filter){
  q = String(q||'').trim(); if(!q) return;
  if(record!==false && typeof pushSHist==='function') pushSHist(q);
  var sh = document.getElementById('shist'); if(sh) sh.hidden = true;
  /* 4W: the chip is part of the request. A plain search-bar submit passes no filter and keeps
     whichever chip is selected; a chip tap passes its own value. Unknown values fall back. */
  var f = (filter && SFILTERS.some(function(x){ return x[0]===filter })) ? filter : sFilter;
  sFilter = f;
  var gen = ++Sg;      // 4W: bumped BEFORE the fetch — every older doSearch() AND loadMore() is stale now
  S = { q:q, sessionId:null, next:false, loading:false, items:[], filter:f };
  var st = S;          // 4AF: the state object THIS search owns — a stale failure must never paint a newer search
  /* 4AE: paint the placeholder BEFORE the fetch. The search itself takes ~1.0-1.3s and until
     now the view said nothing for that whole time. `_sPaint` (never `sView`) is the existing
     one-shot handshake with the showDyn wrapper, so the filter chips appear as they would for
     a real result set and showDyn() still leaves the artist page. loadMore() is never called
     from here — pagination is untouched. */
  curList = []; register([]); _sPaint = true;
  showDyn('Results for “'+esc(q)+'”', 'Searching…', (typeof skRows==='function' ? skRows(8) : '<div class="empty">Searching…</div>'));
  try{
    var r = await fetch('/api/search?q='+encodeURIComponent(q)+'&type='+encodeURIComponent(f));
    var j = await r.json();
    if(gen !== Sg) return;   // a newer search/filter started: no S mutation, no paint, no retitle, no sentinel
    if(j.error && !(j.items||[]).length){
      /* 4AF: a FAILED request must never be mislabelled "No results" (that string stays for an
         honest empty 200), and it must never leave the 4AE "Searching…" placeholder on screen.
         Repaint ONLY while this request still owns the view: gen === Sg && S === st. */
      if(gen === Sg && S === st){
        st.loading = false;
        _sPaint = true;
        showDyn('Results for “'+esc(q)+'”', 'Search failed', '<div class="empty">Search failed — check the connection and try again.</div>');
      }
      toast('Search failed: '+j.error); return
    }
    S.items = j.items||[]; S.sessionId = j.sessionId||null; S.next = !!j.next;
    paintSearch();
    if(typeof skReveal==='function')skReveal(document.getElementById('dynSec'));   // 4AJ: reveal the real rows
    if(S.next && S.filter !== 'all') loadMore();   // page 2 → ~40 results (All never paginates)
  }catch(e){
    if(gen === Sg && S === st){
      /* 4AF: a rejected fetch (server stopped / network down) used to toast only, leaving
         "Searching…" on screen forever. Paint the same honest failure state instead. */
      st.loading = false;
      _sPaint = true;
      showDyn('Results for “'+esc(q)+'”', 'Search failed', '<div class="empty">Search failed — check the connection and try again.</div>');
    }
    if(gen === Sg) toast('Search failed: '+e.message);
  }
};

/* ---------- WAVE 4W: search filter chips (All / Songs / Albums / Artists) ---------- */
var SFILTERS = [['all','All'],['song','Songs'],['album','Albums'],['artist','Artists']];
/* `sFilter` is the selected chip and lives OUTSIDE S, because every doSearch() replaces S wholesale
   — a brand-new query therefore keeps the filter the user picked.
   `sView` is true only while the search RESULTS view is on screen. `_sPaint` is the one-shot
   handshake with paintSearch(); the showDyn wrapper consumes it, so every other caller (home,
   liked music, playlists, the artist “show all” list) leaves the chips hidden. */
var sFilter = 'all', sView = false, _sPaint = false;
function buildFilters(){
  var el = document.getElementById('searchFilters');
  if(!el || el.getAttribute('data-built')) return;
  el.innerHTML = SFILTERS.map(function(f){
    return '<button class="fchip" type="button" data-sfilter="'+f[0]+'" aria-pressed="false">'+f[1]+'</button>';
  }).join('');
  el.setAttribute('data-built','1');   // built exactly once — repeating a search can never add a second row
}
function syncFilters(){
  var el = document.getElementById('searchFilters'); if(!el) return;
  buildFilters();
  /* Visible on the results view only: home, artist page, and the full player all hide the row. */
  var art = document.getElementById('artSec'), dyn = document.getElementById('dynSec');
  var show = !!(sView && curPage === 'dyn' && dyn && !dyn.hidden
                && !(art && !art.hidden) && !document.body.classList.contains('pv'));
  el.hidden = !show;
  Array.prototype.forEach.call(el.querySelectorAll('[data-sfilter]'), function(b){
    var act = b.getAttribute('data-sfilter') === sFilter;
    b.classList[act ? 'add' : 'remove']('on');
    b.setAttribute('aria-pressed', act ? 'true' : 'false');
  });
}
/* A chip tap re-runs the CURRENT query with the new filter, keeping the search box untouched.
   record=false: it is the same query, so it must not leave a second recent-search entry.
   doSearch() bumps Sg before it fetches, so every older search and in-flight page-2 request is
   already invalidated before the new one starts — an old response can no longer mutate S, paint
   rows, change the title, or write to the pagination sentinel. */
document.addEventListener('click', function(e){
  var t = e.target && e.target.closest ? e.target.closest('[data-sfilter]') : null;
  if(!t) return;
  e.preventDefault(); e.stopPropagation();
  var f = t.getAttribute('data-sfilter') || 'all';
  if(!SFILTERS.some(function(x){ return x[0]===f })) return;
  if(f === sFilter){ syncFilters(); return }          // already active — nothing to reload
  sFilter = f; syncFilters();
  if(S.q) doSearch(S.q, false, f);
}, true);
/* 4W-TR: the top-result card's two pills. Capture phase + stopPropagation so a pill click can
   never bubble into the row/artist handlers; the card's avatar/name keep using the existing
   [data-artist-id] delegated path (they carry no pill attribute). */
document.addEventListener('click', function(e){
  var t = e.target && e.target.closest ? e.target.closest('[data-trshuffle],[data-trmix]') : null;
  if(!t) return;
  e.preventDefault(); e.stopPropagation();
  var mix = t.hasAttribute('data-trmix');
  var id = t.getAttribute(mix ? 'data-trmix' : 'data-trshuffle') || '';
  topResultAction(mix ? 'mix' : 'shuffle', id, t.getAttribute('data-trname') || '');
}, true);
/* An album row carries an ALBUM id, not playable audio — open the album page, never the player. */
document.addEventListener('click', function(e){
  var t = e.target && e.target.closest ? e.target.closest('[data-openalbum]') : null;
  if(!t) return;
  e.preventDefault(); e.stopPropagation();
  openAlbum(t.getAttribute('data-openalbum')||'', t.getAttribute('data-title')||'');
}, true);
/* View switches that never pass through showDyn()/goHome() must re-evaluate the chips too.

function seeds(){
  var arts = (typeof topArtists==='function') ? topArtists(14) : [];
  if(!arts.length) return ['trending songs'];
  var last = LS.get('sv_dice_last','');
  var bag = arts.filter(function(a){ return a!==last }); if(!bag.length) bag = arts.slice();
  var picked = [];
  for(var n=0; n<4 && bag.length; n++){
    var total=0; bag.forEach(function(a,i){ total += 1/(i+1) });
    var r=Math.random()*total, acc=0, k=0;
    for(var i=0;i<bag.length;i++){ acc += 1/(i+1); if(r<=acc){ k=i; break } }
    picked.push(bag[k]); bag.splice(k,1);
  }
  LS.set('sv_dice_last', picked[0]||'');
  return picked;
}
function pickBalanced(pool, want){
  var seen={}, out=[], perArtist={}, lastArtist='';
  pool.forEach(function(it){ if(it && it.id) seen[it.id]=seen[it.id]||it });
  var list = Object.keys(seen).map(function(k){ return seen[k] })
    .filter(function(it){ return recentIds.indexOf(it.id)<0 });
  for(var round=0; round<3 && out.length<want; round++){
    list.forEach(function(it){
      if(out.length>=want) return;
      if(out.some(function(x){ return x.id===it.id })) return;
      var a = String(it.artist||'').split(',')[0].trim().toLowerCase();
      perArtist[a] = perArtist[a]||0;
      if(a && perArtist[a] >= 2) return;
      if(a && a === lastArtist) return;
      out.push(it); perArtist[a]++; lastArtist = a;
    });
  }
  return out;
}
diceRadio = async function(){

  diceBusy = true;
  var btn = document.getElementById('diceBtn'); if(btn) btn.classList.add('busy');

  try{

      jobs.push(fetch('/api/radio?id='+encodeURIComponent(t.id)+'&title='+encodeURIComponent(t.title||'')+
        '&artist='+encodeURIComponent(t.artist||'')+'&n=15')
        .then(function(r){ return r.json() }).then(function(j){ return j.items||[] }).catch(function(){ return [] }));
    });
    seeds().slice(0,3).forEach(function(a){
      jobs.push(fetch('/api/search?q='+encodeURIComponent(a+' songs'))
        .then(function(r){ return r.json() }).then(function(j){ return j.items||[] }).catch(function(){ return [] }));
    });
    var results = await Promise.all(jobs);
    var pool = []; results.forEach(function(arr){ arr.forEach(function(it){ if(it && it.kind!=='album') pool.push(it) }) });
    var picked = pickBalanced(pool, 20);
    if(!picked.length){ toast('Not enough listening history yet — play a few songs first'); return }
    playList(picked, 0, true);
    toast('🎲 Radio: '+picked.length+' similar songs');

};

var fetched = {};
function appendRadio(items){

    if(!it || !it.id) return;
    if(queue.some(function(x){ return x.id===it.id })) return;
    if(recentIds.indexOf(it.id)>=0) return;

    var cnt = 0; queue.forEach(function(x){ if(String(x.artist||'').split(',')[0].trim().toLowerCase()===a) cnt++ });
    if(a && cnt>=2) return;
    register([it]);

}

/* ---------- download gets a proper filename ---------- */
downloadTrack = async function(it){
  if(!it) return;
  try{
    toast('Downloading “'+it.title+'”…');
    var r = await fetch('/api/download?id='+encodeURIComponent(it.id)+'&title='+encodeURIComponent(it.title||''));
    if(!r.ok){ var j = await r.json().catch(function(){ return null }); throw new Error((j && j.error) || 'download failed') }
    var name = it.title || 'track';
    var cd = r.headers.get('content-disposition')||'';
    /* RFC 5987 first: Express sends BOTH a lossy ASCII filename="???.webm" and the real
       UTF-8 filename*=UTF-8''%E2%80%A6.webm. Matching the plain form first saved the
       mojibake name (e.g. "___ ___ _____.webm") for any non-Latin title. */
    var m = cd.match(/filename\*=UTF-8''([^;]+)/i) || cd.match(/filename="?([^";]+)"?/i);
    if(m){ try{ name = decodeURIComponent(m[1]) }catch(e){ name = m[1] } }
    else {
      var ct = (r.headers.get('content-type')||'').toLowerCase();
      var ext = ct.indexOf('webm')>=0 ? 'webm' : ct.indexOf('ogg')>=0 ? 'opus' : ct.indexOf('mpeg')>=0 ? 'mp3' : 'm4a';
      name = name + '.' + ext;
    }
    var blob = await r.blob();
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href) }, 5000);
    toast('Downloaded');
  }catch(e){ toast('Download failed: '+e.message) }
};
