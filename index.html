<script id="v3seekjs">
(function(){
  var wrap=document.getElementById('pseekWrap');
  var input=document.getElementById('pseek');
  var fill=document.getElementById('psFill');
  if(!wrap||!input||!fill)return;

  var knob=document.getElementById('v3knob');
  if(!knob){knob=document.createElement('div');knob.id='v3knob';knob.className='v3knob';wrap.appendChild(knob)}

  var last=-2;
  function pct(){
    var d=audio.duration;
    if(!isFinite(d)||d<=0)return -1;           // live stream / not loaded yet
    var p=(audio.currentTime||0)/d*100;
    return p<0?0:(p>100?100:p);                // clamp: never past the end
  }
  function paint(){
    var p=pct();
    if(p<0){ if(last!==-1){last=-1;fill.style.width='0%';knob.style.opacity=0} return }
    if(p===last)return;
    last=p;
    knob.style.opacity=1;
    knob.style.left=p+'%';                     // same value as the fill → always aligned
    fill.style.width=p+'%';
  }
  try{paintSeek=function(){paint()}}catch(e){}  // lyrics click-to-seek + startup still work

  ['timeupdate','loadedmetadata','durationchange','seeked','playing','emptied','ended','pause']
    .forEach(function(ev){onAudio(ev,paint)});
  input.addEventListener('input',paint);
  input.addEventListener('change',paint);

  /* Wave 4AD — this used to be a PERMANENT rAF loop: it kept asking for a frame on
     every vsync of the app's whole lifetime, including while paused and while the
     track had no duration at all, i.e. it did per-frame work for a bar that could
     not move. It now runs ONLY while audio is actually playing or the seek bar is
     being dragged, and it is cancelled on pause/ended/emptied.
     Nothing else changed: every event-driven paint() call above is still registered,
     and paintSeek() still points at paint(), so play/pause/seek/ended/next-track and
     the lyrics click-to-seek all repaint immediately from their own listeners. */
  var rafId=0, draggingSeek=false;
  function wants(){ var d=audio.duration; return draggingSeek || (!audio.paused && isFinite(d) && d>0) }
  function frame(){ rafId=0; paint(); if(wants())rafId=requestAnimationFrame(frame) }
  function sync(){ if(wants()){ if(!rafId)rafId=requestAnimationFrame(frame) } else if(rafId){ cancelAnimationFrame(rafId);rafId=0 } }
  ['play','playing','pause','ended','emptied','loadedmetadata','durationchange','seeked']
    .forEach(function(ev){onAudio(ev,sync)});
  input.addEventListener('pointerdown',function(){ draggingSeek=true; sync() });
  ['pointerup','pointercancel'].forEach(function(ev){
    window.addEventListener(ev,function(){ if(!draggingSeek)return; draggingSeek=false; paint(); sync() });
  });
  paint(); sync();                                            // one immediate paint, then only if it can move
})();
</script>

<script id="v2auto">
/* Auto lyrics source: prefer whichever provider has time-synced lyrics */
(function(){
  /* WAVE 14 — this migration used to write 'auto' into EVERY profile that lacked the marker,
     including one where no provider had ever been chosen, so the app's own default was silently
     overridden on first run. Now an install that already HAD a stored provider is migrated exactly
     as before, and a profile with no stored provider keeps the default (LRClib). The one-shot
     marker is still written either way. */
  if(!localStorage.getItem('sv_lyr_v2')){
    try{
      if(localStorage.getItem('sv_lyr') !== null){ localStorage.setItem('sv_lyr','"auto"'); lyrPref='auto' }
      localStorage.setItem('sv_lyr_v2','1');
    }catch(e){}
  }
  setInterval(function(){
    var chip=document.getElementById('lyrSeg'); if(!chip)return;
    if(!document.getElementById('lAU')){
      var b=document.createElement('button');
      b.id='lAU'; b.textContent='Auto';
      b.onclick=function(){
        lyrPref='auto'; saveAll(); lyr.loadedFor=null; loadLyrics();
        Array.prototype.forEach.call(chip.children,function(x){x.classList.toggle('on',x.id==='lAU')});
      };
      chip.insertBefore(b,chip.firstChild);
    }
    var explicit=(lyrPref==='ytm'||lyrPref==='lrclib');
    Array.prototype.forEach.call(chip.children,function(x){
      x.classList.toggle('on', explicit ? (x.id===(lyrPref==='ytm'?'lYT':'lLR')) : (x.id==='lAU'));
    });
  },600);
})();
</script>

/* ---------- BUG #6: Up Next in playback order ---------- */
renderQueue = function(){
  var el = $('#pvQueue'); if(!el) return;
  var it = nowItem();
  var ctx = $('#pvCtx'); if(ctx) ctx.textContent = it ? ('Playing from '+(it.artist||'your queue')) : 'Nothing playing';
  if(!queue.length){ el.innerHTML = '<div class="empty">Queue is empty — add songs from ⋮ → “Add to queue”.</div>';
    if($('#pvFab')) syncFab(); return }
  var curQi = it ? queue.findIndex(function(x){ return x.id===it.id }) : -1;
  var order = [];
  if(curQi>=0) order.push(curQi);

     order. It used to WRAP the play order around (seq.slice(ci+1).concat(seq.slice(0,ci))), which

  queue.forEach(function(_,i){ if(order.indexOf(i)<0 && seq.indexOf(i)<0) order.push(i) });

    var x = queue[qi]; if(!x) return '';
    var isCur = (pos===0 && curQi>=0);

    if(isCur && startingNow()) A = 'Starting…';   // 4AE: the now-playing row mirrors the stream state
    return '<div class="row '+(isCur?'cur':'')+'" data-q="'+qi+'" data-qid="'+esc(x.id)+'">'+

  }).join('');

(function bindQueueClicks(){
  var q = document.getElementById('pvQueue'); if(!q) return;
  q.addEventListener('click', function(e){
    if(e.target.closest('[data-menu]')) return;              // ⋮ still works

    e.preventDefault(); e.stopPropagation();

/* ---------- WAVE 1: clickable artist names + artist page ---------- */
/* Artist links are rendered in exactly one place and reused by rows, the
   now-playing bar and the artist page. No id ⇒ plain text, never a dead link. */
function artistLinksHTML(it){
  var flat = (it && it.artist) || '';
  var names = splitArtists(flat);
  /* No flat string? The METADATA is the identity — this is what stops album and video
     rows from rendering a blank artist line while `artists[]` sat there unused. */
  if(!names.length) names = (it.artists || []).map(a => a && a.name ? String(a.name).trim() : '').filter(Boolean);
  if(!names.length) return esc(flat);
  var norm = function(v){ return String(v == null ? '' : v).replace(/\s+/g,' ').replace(/^[,\s]+|[,\s]+$/g,'').toLowerCase() };
  /* 4AP: a name that EQUALS the track's own title is not an identity — it is a title-only
     credit (poisoned by a producer that fell back to a text field holding the title). Render it
     as PLAIN text: no data-artist-id and no data-artist-name, so it is never clickable and can
     never dial a wrong channel. Rows with a real credit are untouched. */
  var tNorm = norm((it && it.title) || '');
  var ids = {}, meta = it.artists || [];
  /* IDs come ONLY from `artists[]`. YouTube ships combined credits
     ("Lofi Sleep Chill & Study", "Alex Kennon, Joris Voorn") as ONE entry with ONE
     channel id; splitArtists() breaks those into display names, so an entry owns every
     name it contains. No exact/contained match ⇒ no id ⇒ probe, never a wrong artist. */
  meta.forEach(function(a){
    if(!a || !a.name) return;
    var m = norm(a.name); if(!m) return;
    if(!ids[m]) ids[m] = a.id || '';
    /* Separators become spaces so a trailing comma still matches: verified that these
       ARE the channels' real names — UC0_Ba_aRYYM8CWYVWdYe5cg → "Alex Kennon, Joris
       Voorn", UC1itStv5HQODNJr1zyUmDyg → "Lofi Sleep Chill & Study". */
    var hay = ' ' + m.replace(/[,&;×]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
    names.forEach(function(n){ var w = norm(n); if(!w || ids[w]) return; if(hay.indexOf(' '+w+' ') >= 0) ids[w] = a.id || '' });
  });
  return names.map(function(n){
    if(tNorm && norm(n) === tNorm) return esc(n);   /* 4AP: title-only -> plain, never a link */
    var id = ids[norm(n)] || '';
    return '<span class="alink"' + (id ? ' data-artist-id="'+esc(id)+'"' : '') +
      ' data-artist-name="'+esc(n)+'">'+esc(n)+'</span>';
  }).join(', ');
}
function subHTML(it){
  var a = artistLinksHTML(it);
  /* 4W-D2: the All list labels every row with its own type, so a song row reads
     "Song • <clickable artist> • 3:51" instead of the artist alone. `label` is attached to
     type=all search rows ONLY (server /api/search), so every other list keeps the exact output
     below — the label branch cannot fire anywhere else. */
  if(it && it.label){
    var parts = [esc(it.label)];
    if(a) parts.push(a);
    if(it.duration) parts.push(esc(it.duration));
    return parts.join(' • ');
  }
  /* 4Z-b: no artist ⇒ no stray " • ": render the duration alone. */
  return (it && it.duration) ? (a ? a + ' • ' + esc(it.duration) : esc(it.duration)) : a;
}
/* --- artist hero artwork (restored for Wave 4J, matching the full-bleed hero) ---
   VERIFIED: the artist header DOES carry a genuinely wide banner. Both banner hosts
   (lh3.googleusercontent.com and yt3.googleusercontent.com) serve ANY size token, so long
   as the `-p-` flag is kept: 7/7 artists returned 200 + 2400×1000 for "=w2400-h1000-p-l90-rj"
   (the banner's own aspect is exactly 2.4:1). /api/artist rewrites every size token to
   "=w544-h544-l90-rj", which some artists answer with a PORTRAIT or square crop
   (measured: 363×544, 544×544, 408×544) — that is the cropped-face square. So: ask for the
   wide token; if the URL is not on a banner host, keep whatever the API gave (shown unblurred,
   object-fit:cover) — never stretched into a box. */
function heroArt(a){
  var raw = (a && (a.banner || a.thumb || '')) || '';
  /* one artwork shape everywhere: v3art's normaliser decides whether this is a real URL */
  var u = (typeof window.artURL === 'function') ? window.artURL(raw) : raw;
  if(!u) return '';
  if(/^https:\/\/(lh3|yt3)\.googleusercontent\.com\//.test(u)){
    /* ask BOTH banner hosts for the widest 2.4:1 token. The API normalises artwork
       to =w544… (=w544 → a bad 363×544 portrait / 544×544 square crop), and some
       hosts ship other shapes (=s544…) or none at all, so replace whatever token
       is there — never use the 544 crop for the hero. */
    var hero = '=w2400-h1000-p-l90-rj';
    return /=\w[^"?]*$/.test(u) ? u.replace(/=\w[^"?]*$/, hero) : u + hero;
  }
  return u;
}
/* --- artist song rows: thumbnail | title | artist | album | duration ---

    '<button class="dots" data-menu="'+esc(it.id)+'"><span class="ic">'+ic('i-dots')+'</span></button></div></div>';

/* railCard lives in the base layer and is used by the Home rails ("Listen again",
   "Albums for you", the trending rail) — and by railHTML(). Same markup, the artist
   line under each cover becomes links. Same delegated handler as rows/search/pvA. */
var _railCard = railCard;
/* WAVE 13: this wrapper is the card the Home rails actually use, so it must forward the base

/* ---------- Wave 5 (UI-4): a search result seeds a similar-vibe mix ----------
   YouTube Music never makes the search list the up-next queue: picking a row starts that song and
   the queue fills with similar-vibe songs (its “… mix”); end-of-track keeps appending. The seed
   starts IMMEDIATELY — playList() of the one row, no waiting on the network — and /api/radio (the
   same endpoint and ranking maybeContinue() already uses) replaces the tail about a second later.
   Every guard makes a stale or unwanted answer a no-op, so the queue is never clobbered: a newer
   seed, a user who skipped on or edited the queue by hand, a non-track row. Autoplay similar = off
   (Settings → Autoplay, or #v3auto) is then a ONE-song queue — never the search list. */
var seedGen = 0;
seedMixPlay = function(row, list, i){
  var seed = list && list[i];
  if(!seed || !seed.id) return false;
  if(!row || !row.closest('#dynSec')) return false;   // the results section only (not album/artist)
  if(!sView || sMood) return false;                   // a plain search-results view only
  var gen = ++seedGen;
  playList([seed], 0, true);
  if(!v3autoOn) return true;                          // autoplay off: nothing to mix in
  fetch('/api/radio?id='+encodeURIComponent(seed.id)+'&title='+encodeURIComponent(seed.title||'')+
        '&artist='+encodeURIComponent(seed.artist||'')+'&n=25')
    .then(function(r){ return r.json() })
    .then(function(j){
      if(gen !== seedGen) return;                                    // a newer seed owns the queue
      var live = nowItem(); if(!live || live.id !== seed.id) return;  // the user moved on
      if(queue.length !== 1 || queue[0].id !== seed.id) return;       // the queue was edited by hand
      var add = (j && j.items ? j.items : []).filter(function(x){
        return x && x.id && x.id !== seed.id && ((x.kind || 'track') === 'track') &&
               !(typeof tasteExcluded === 'function' && tasteExcluded(x.id));
      });
      if(!add.length) return;
      register(add);
      add.forEach(function(x){ if(!queue.some(function(q){ return q.id === x.id })) queue.push(x) });
      syncSeq(seed.id);     // the seed stays current and first; shuffle only reorders what follows
      renderQueue();
      toast('Added '+add.length+' similar songs');
    })
    .catch(function(){});
  return true;
};

function appendRadio(items){

/* ---------- download gets a proper filename ---------- */
downloadTrack = async function(it){
  if(!it) return;
  try{
    toast('Downloading “'+it.title+'”…');
    var r = await fetch('/api/download?id='+encodeURIComponent(it.id)+'&title='+encodeURIComponent(it.title||''));
    if(!r.ok){ var j = await r.json().catch(function(){ return null }); throw new Error((j && j.error) || 'download failed') }
    var name = it.title || 'track';
    var cd = r.headers.get('content-disposition')||'';
    /* RFC 5987 first: Express sends BOTH a lossy ASCII filename="???.webm" and the real
       UTF-8 filename*=UTF-8''%E2%80%A6.webm. Matching the plain form first saved the
       mojibake name (e.g. "___ ___ _____.webm") for any non-Latin title. */
    var m = cd.match(/filename\*=UTF-8''([^;]+)/i) || cd.match(/filename="?([^";]+)"?/i);
    if(m){ try{ name = decodeURIComponent(m[1]) }catch(e){ name = m[1] } }
    else {
      var ct = (r.headers.get('content-type')||'').toLowerCase();
      var ext = ct.indexOf('webm')>=0 ? 'webm' : ct.indexOf('ogg')>=0 ? 'opus' : ct.indexOf('mpeg')>=0 ? 'mp3' : 'm4a';
      name = name + '.' + ext;
    }
    var blob = await r.blob();
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href) }, 5000);
    toast('Downloaded');
  }catch(e){ toast('Download failed: '+e.message) }
};

     (label + hint + a chevron instead of a control) is wrapped in .setRowAct, which carries
     data-setact="histpage"; the delegated handler resolves it with closest(), so no JS change is
     needed for the click. setRow() itself and every other row are untouched. */
  h += '<div class="setRowAct" data-setact="histpage" tabindex="0" role="button">'+
    setRow('History','<span class="ic" style="width:12px;height:12px;vertical-align:-2px;margin-right:5px">'+ic('i-clock')+'</span>'+Object.keys(hist||{}).length+' tracks','<span class="setChev">›</span>')+
    '</div>';
  h += (setCfm==='hist')
    ? setCfmRow('Clear all listening history?','Clear','hist_yes')
    : setRow('Clear history','Empties Home’s history rows ('+Object.keys(hist||{}).length+' tracks)','<button class="setAct danger" type="button" data-setact="hist">Clear</button>');
  h += (setCfm==='likes')
    ? setCfmRow('Remove every liked song?','Clear','likes_yes')
    : setRow('Clear likes','Empties Liked music ('+Object.keys(favs||{}).length+' songs)','<button class="setAct danger" type="button" data-setact="likes">Clear</button>');
  h += (setCfm==='import')
    ? setCfmRow('Replace your Svara data with '+(setPend?Object.keys(setPend).length:0)+' keys from the file?','Import','import_yes')
    : setRow('Export','Downloads every Svara localStorage key as JSON','<button class="setAct" type="button" data-setact="export">Export</button>')+
      setRow('Import','Restores a file exported here — nothing is written unless it validates','<button class="setAct" type="button" data-setact="import">Import</button>');
  h += '</div>';
  /* Wave 4F — the About group is now ONE full-width button at the BOTTOM of the panel; the
     version / name / links it used to hold live in the #aboutCard overlay it opens. No group
     heading: the button already says what it is. */
  h += '<div class="setGrp"><button class="setAbout" type="button" data-setact="about" aria-haspopup="dialog" aria-expanded="false" aria-controls="aboutCard">'+
      '<span>About Svara</span><span class="ic"><svg><use href="#i-down"/></svg></span>'+
    '</button></div>';
  b.innerHTML = h;
  b.scrollTop = keep;
}
/* mirror the live player into the open panel, but never fight a control in use */
function setSync(){
  var p = setPanelEl(); if(!p) return;
  var v = p.querySelector('input[data-setkey="volume"]');
  if(v){ if(document.activeElement!==v && +v.value!==volume) v.value = volume; v.style.setProperty('--v', volume+'%') }
  var n = document.getElementById('setVolNum'); if(n) n.textContent = volume+'%';
  var sh = p.querySelector('input[data-setkey="shuffle"]'); if(sh && sh.checked!==!!shuffle) sh.checked = !!shuffle;
  var ap = p.querySelector('input[data-setkey="autoplay"]'); if(ap && ap.checked!==!!v3autoOn) ap.checked = !!v3autoOn;
  var rp = p.querySelector('input[data-setkey="repeat"][value="'+repeat+'"]'); if(rp && !rp.checked) rp.checked = true;
  var pr = p.querySelector('input[data-setkey="provider"][value="'+setLive('provider')+'"]'); if(pr && !pr.checked) pr.checked = true;
  var gx = p.querySelector('input[data-setkey="gfxLevel"][value="'+setGfxLevel()+'"]'); if(gx && !gx.checked) gx.checked = true;
  var ts = p.querySelector('input[data-setkey="typeScale"][value="'+setLive('typeScale')+'"]'); if(ts && !ts.checked) ts.checked = true;
  /* Wave 5 (UI-2): the sliding thumb reads its index from data-i on the .setSeg container, so
     every path that can move a radio (this 900 ms resync, an import, a rollback) must re-derive it */
  syncSeg('repeat'); syncSeg('provider'); syncSeg('gfxLevel'); syncSeg('typeScale');
}
/* Wave 5 (UI-2) — ONE helper for the sliding segmented control's thumb index. The radios stay the
   single source of truth: this reads whichever one is :checked and mirrors its position into
   data-i (the CSS keys --i off it). Written only when it actually changes, so the panel's open
   resync does not spam attribute mutations at the liquid-metal scan. */
function syncSeg(name){
  var p = setPanelEl(); if(!p) return;
  var first = p.querySelector('.setSeg input[data-setkey="'+name+'"]');
  var seg = first ? first.closest('.setSeg') : null; if(!seg) return;
  var all = seg.querySelectorAll('input[data-setkey="'+name+'"]');
  var on = seg.querySelector('input[data-setkey="'+name+'"]:checked');
  var i = 0;
  for(var k=0;k<all.length;k++){ if(all[k]===on){ i=k; break } }
  var want = String(i);
  if(seg.getAttribute('data-i') !== want) seg.setAttribute('data-i', want);
}
function setShow(on){
  var p = setPanelEl(), g = document.getElementById('setBtn');
  if(!p) return;
  setOpen = !!on; setCfm = '';
  if(setOpen){
    setRender();                                   // populated before the first visible frame
    p.classList.add('on'); p.removeAttribute('aria-hidden');
    if(g) g.setAttribute('aria-expanded','true');
    setSysLoad(); setFileWire();
  } else {
    p.classList.remove('on'); p.setAttribute('aria-hidden','true');
    if(g) g.setAttribute('aria-expanded','false');
    if(aboutOpen) aboutShow(false);              // Wave 4F: the card never outlives its panel
  }
}
function setSysLoad(){
  if(setSysAsked) return;
  setSysAsked = true;
  fetch('/api/system').then(function(r){ return r.json() }).then(function(j){
    setSys = (j && typeof j==='object') ? j : null;
    if(setOpen) setRender();
    if(aboutOpen) aboutRender();                  // Wave 4F: the version lands in the card too
  }).catch(function(){ setSys = null; if(setOpen) setRender(); if(aboutOpen) aboutRender() });
}

/* ONE config object. Every empty string renders as a disabled, non-focusable control with
   title="Not published yet" — never href="" and never a dead link. Wave 5: `repo` is filled in
   (the repository is public), so the only value still empty is the optional avatar hook. */
var ABOUT = {
  name: 'Shubham Nag',
  role: 'Creator & Maintainer · Product Architect & Designer',
  // avatar: '',    // future photo hook — no placeholder is rendered today (Wave 4N-b)
  github: 'https://github.com/Shubham0743X',                    // GitHub profile URL
  instagram: 'https://www.instagram.com/notso_shubhamm?mdxt=MWV1YzcxNmNhcXRhZA==',   // Instagram profile URL (verbatim as supplied)
  repo: 'https://github.com/Shubham0743X/Svara',   // repository URL — the About card's "View Repository" button
};
var ABOUT_TIP = 'Not published yet';
function aboutEl(){ return document.getElementById('aboutCard') }
/* the OS is detected CLIENT-SIDE — no build-time assumption, no server route.
   4N: mode 'pill' returns the display name with its real case ("Windows"), matching the spec; the
   default stays uppercase for any other caller. */
function aboutOS(mode){
  var p = '', ua = '';
  try{ p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '' }catch(e){}
  try{ ua = navigator.userAgent || '' }catch(e){}
  var s = String(p || '');
  var os = '—';
  if(/win/i.test(s) || /Windows/i.test(ua)) os = 'Windows';
  else if(/mac/i.test(s) || /Mac OS X/i.test(ua)) os = 'macOS';
  else if(/linux/i.test(s) || /Linux/i.test(ua)) os = 'Linux';
  return mode === 'pill' ? os : os.toUpperCase();
}
/* a value ⇒ a real link; an EMPTY string ⇒ a disabled control that cannot be clicked or focused */
function aboutLink(url, cls, inner, label){
  var c = 'abBtn ' + cls;
  if(url) return '<a class="'+c+'" href="'+esc(url)+'" target="_blank" rel="noreferrer" title="'+esc(label)+'" aria-label="'+esc(label)+'">'+inner+'</a>';
  return '<button class="'+c+'" type="button" disabled tabindex="-1" aria-disabled="true" title="'+ABOUT_TIP+'" aria-label="'+esc(label)+' — '+ABOUT_TIP+'">'+inner+'</button>';
}
/* the app mark reuses the sidebar lockup as it is: the traced wordmark SVG is CLONED and the
   green glyph is the very data-URI the sidebar draws (read off #sbWord::after) — nothing re-traced */
function aboutMark(){
  var m = document.getElementById('abMark'); if(!m) return;
  m.innerHTML = '';
  var src = document.getElementById('sbWord'); if(!src) return;
  var svg = src.querySelector('svg');
  if(svg){
    var c = svg.cloneNode(true);
    c.removeAttribute('role'); c.removeAttribute('aria-label'); c.setAttribute('aria-hidden','true');
    m.appendChild(c);
  }
  var g = document.createElement('span'); g.className = 'abGlyph'; g.setAttribute('aria-hidden','true');
  var bg = '';
  try{ bg = getComputedStyle(src, '::after').backgroundImage || '' }catch(e){}
  if(bg && bg !== 'none') g.style.backgroundImage = bg;
  m.appendChild(g);
}
function aboutRender(){
  var b = document.getElementById('abBody'); if(!b) return;
  var h = '';
  /* CARD 1 — the app: the brand lockup on top, the version/platform pills directly below it */
  /* CARD 2 — the developer: name at the large heading size, role in accent */
  h += '<div class="abCards">'+
    '<div class="abCard abApp">'+
      '<div class="abMark" id="abMark"></div>'+
      '<div class="abPillRow"><span class="abPill abPill--acc" id="abPillV">'+esc((setSys && setSys.version) || '—')+'</span>'+
      '<span class="abPill" id="abPill">'+esc(aboutOS('pill'))+'</span></div>'+
    '</div>'+
    '<div class="abCard"><div class="abCardTop">'+
      '<div class="abWho">'+
        '<div class="abName">'+esc(ABOUT.name)+'</div>'+
        '<div class="abRole">'+esc(ABOUT.role)+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="abLinks">'+
      aboutLink(ABOUT.github, 'abIco', '<span class="ic"><svg><use href="#i-github"/></svg></span>', 'GitHub profile')+
      aboutLink(ABOUT.instagram, 'abIco', '<span class="ic"><svg><use href="#i-instagram"/></svg></span>', 'Instagram profile')+
    '</div></div>'+
  '</div>';
  /* below both cards, unchanged in function */
  h += '<div class="abGrp"><div class="abGrpH">Community &amp; info</div><div class="abRepoRow">'+
    aboutLink(ABOUT.repo, 'abRepo', '<span>View Repository</span>', 'View Repository')+
  '</div></div>';
  b.innerHTML = h;
  aboutMark();
}
function aboutShow(on){
  var c = aboutEl(); if(!c) return;

  else { c.classList.remove('on'); c.setAttribute('aria-hidden','true') }

/* the card's own close paths: the X and a REAL click outside the card box. Same isTrusted rule
   as the panel, so a programmatic click can never close a card it just opened. */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest || !aboutOpen) return;
  if(t.closest('[data-aboutact="close"]')){ aboutShow(false); return }
  if(e.isTrusted !== false && !t.closest('.abBox') && !t.closest('[data-setact="about"]')) aboutShow(false);
});
function setFileWire(){
  var f = document.getElementById('setFile');
  if(!f || f.dataset.wired) return;
  f.dataset.wired = '1';
  f.onchange = function(){ var file = this.files && this.files[0]; this.value = ''; if(file) setImportFile(file) };
}
/* volume: the mini player's #vol input stays the single owner of playback volume */
function setVolume(v){
  v = +v; if(!isFinite(v)) v = 0;
  v = Math.max(0, Math.min(100, Math.round(v)));
  var el = $('#vol');
  if(el){ el.value = v; el.dispatchEvent(new Event('input', { bubbles:true })) }
  else { volume = v; audio.volume = v/100 }
  setPut('sv_set_volume', v);
  var sl = setQ('input[data-setkey="volume"]');
  if(sl){ sl.style.setProperty('--v', volume+'%'); if(document.activeElement!==sl) sl.value = volume }
  var n = document.getElementById('setVolNum'); if(n) n.textContent = volume+'%';
}
/* lyrics provider: reuse the player's own chip handlers, never re-implement the fetch */
function setProvider(p){
  if(p!=='auto' && p!=='ytm' && p!=='lrclib') return;
  try{ ensureLyricsUI() }catch(e){}
  var b = document.getElementById(p==='auto' ? 'lAU' : p==='ytm' ? 'lYT' : 'lLR');
  if(b) b.click();
  else { lyrPref = p; saveAll() }    // chips not built yet: same state, no fetch to redo
  setPut('sv_set_lyricsProvider', lyrPref);
}
function setClearHist(){
  hist = {};
  try{ LSset('ml_history', {}) }catch(e){}
  try{ updatePlRows() }catch(e){}
  try{ renderHome() }catch(e){}
  toast('Listening history cleared');
}
function setClearLikes(){
  favs = {};
  try{ LSset('sv_favs', {}) }catch(e){}
  try{ updatePlRows() }catch(e){}
  try{ paintFavs() }catch(e){}
  try{ refreshHearts() }catch(e){}
  toast('Liked music cleared');
}
function setExport(){
  var keys = {}, n = 0, k;
  try{
    for(var i=0;i<localStorage.length;i++){
      k = localStorage.key(i);
      if(!k || !/^(sv_|ml_)[a-z_0-9]*$/i.test(k)) continue;
      keys[k] = localStorage.getItem(k); n++;
    }
  }catch(e){}
  var payload = { app:'svara', exported:new Date().toISOString(), version:(setSys&&setSys.version)||'', keys:keys };
  try{
    var blob = new Blob([JSON.stringify(payload,null,2)], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'svara-data-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href) }, 5000);
    toast('Exported '+n+' keys');
  }catch(e){ toast('Export failed: '+e.message) }
}
function setImportFile(file){
  var fr = new FileReader();
  fr.onload = function(){
    var data = null;
    try{ data = JSON.parse(String(fr.result||'')) }catch(e){ toast('Import failed: not valid JSON'); return }
    if(!data || typeof data!=='object' || Array.isArray(data)){ toast('Import failed: expected a JSON object'); return }
    var src = data.keys;
    if(!src || typeof src!=='object' || Array.isArray(src)) src = data;      // also accept a flat export
    var out = {}, bad = null;
    Object.keys(src).forEach(function(k){
      if(bad) return;
      if(!/^(sv_|ml_)[a-z_0-9]*$/i.test(k)){ bad = k; return }
      var v = src[k];
      if(v===null || v===undefined) return;
      if(typeof v==='string'){ try{ JSON.parse(v) }catch(e){ bad = k; return } out[k] = v }
      else { try{ out[k] = JSON.stringify(v) }catch(e){ bad = k } }
    });
    if(bad){ toast('Import failed: unexpected key “'+bad+'”'); return }
    var n = Object.keys(out).length;
    if(!n){ toast('Import failed: no Svara data in the file'); return }
    setPend = out; setCfm = 'import'; setRender();
    toast('Loaded '+n+' keys — press Import to apply');
  };
  fr.onerror = function(){ toast('Import failed: could not read the file') };
  fr.readAsText(file);
}
function setImportApply(){
  var out = setPend; setPend = null; setCfm = '';
  var n = out ? Object.keys(out).length : 0;
  setRender();
  if(!n) return;
  var snap = {};
  SET_KEYS.forEach(function(k){ var v = setStored(k); if(v!==null) snap[k] = v });
  try{
    Object.keys(out).forEach(function(k){ localStorage.setItem(k, out[k]) });
  }catch(e){
    try{                                    // any failure → put the previous data back
      Object.keys(out).forEach(function(k){ localStorage.removeItem(k) });
      SET_KEYS.forEach(function(k){ if(snap[k]!==undefined) localStorage.setItem(k, snap[k]) });
    }catch(e2){}
    toast('Import failed — your data was left as it was');
    return;
  }
  setRefresh();
  toast('Imported '+n+' keys');
}
/* after an import: re-read localStorage into the live state and repaint */
function setRefresh(){
  hist = LSget('ml_history', {}) || {};
  favs = LSget('sv_favs', {}) || {};
  pls  = LSget('sv_pls', {}) || {};
  shist = LSget('sv_shist', []) || [];
  var lp = LSget('sv_lyr', null); if(lp) lyrPref = lp;
  recentTracks = LS.get('sv_tracks', []) || [];
  recentIds = LS.get('sv_recent_ids', []) || [];
  var v = LS.get('sv_set_volume', null); if(typeof v==='number' && isFinite(v)) setVolume(v);
  var sh = LS.get('sv_set_shuffle', null); if(typeof sh==='boolean') shuffle = sh;
  var rp = LS.get('sv_set_repeat', null); if(rp==='off'||rp==='all'||rp==='one') repeat = rp;
  var ap = LS.get('sv_set_autoplay', null);
  if(typeof ap==='boolean'){ v3autoOn = ap; LS.set('sv_auto', ap?'on':'off') }
  try{ if(window.svaraXfade) window.svaraXfade.set(LS.get('sv_set_crossfade','2')||'2') }catch(e){}   // UI-5: an import can change it
  try{ updatePlRows() }catch(e){}
  try{ paintControls(); paintShuf(); paintAuto(); paintFavs(); renderSHist() }catch(e){}
  try{ refreshHearts() }catch(e){}
  if(setOpen) setRender();
}

/* ONE delegated input handler for every control in the panel */
document.addEventListener('input', function(e){
  var t = e.target;
  if(!t || !t.getAttribute || !t.closest || !t.closest('#setPanel')) return;
  var key = t.getAttribute('data-setkey'); if(!key) return;
  if(key==='autoplay'){
    v3autoOn = !!t.checked;
    setPut('sv_set_autoplay', v3autoOn);
    LS.set('sv_auto', v3autoOn ? 'on' : 'off');   // keep the key the #v3auto button writes in step
    paintAuto();
  } else if(key==='shuffle'){
    if(!!t.checked !== !!shuffle) toggleShuffle();   // real queue rebuild + toast
    setPut('sv_set_shuffle', !!shuffle);
    paintShuf();
  } else if(key==='repeat'){
    if((t.value==='off'||t.value==='all'||t.value==='one') && repeat!==t.value){
      repeat = t.value; paintControls();
      toast(repeat==='off' ? 'Repeat off' : repeat==='all' ? 'Repeat all' : 'Repeat one');
    }
    setPut('sv_set_repeat', repeat);
  } else if(key==='volume'){
    setVolume(t.value);
  } else if(key==='crossfade'){
    /* UI-5: persist, then hand the value to the live engine the same way gfxLevel hands off to
       window.svaraGfx — one owner, no duplicated state. */
    setPut('sv_set_crossfade', t.value);
    try{ if(window.svaraXfade) window.svaraXfade.set(t.value) }catch(e){}
    toast(t.value==='off' ? 'Crossfade off' : 'Crossfade: '+t.value+'s');
  } else if(key==='provider'){
    setProvider(t.value);
  } else if(key==='typeScale'){
    /* UI-7: persist, then hand the step to the live layer the same way gfxLevel hands off to
       window.svaraGfx — one owner (window.svaraType), no duplicated state. */
    setPut('sv_set_typeScale', t.value);
    try{ if(window.svaraType) window.svaraType.set(t.value) }catch(e){}
  } else if(key==='gfxLevel'){
    /* Wave 5 — persist then hand off to the EXISTING live hook: v4lmjs listens for
       'svara-gfx-change', re-scans and re-applies (mounts/disposes the liquid-metal layer,
       swaps the static ring, gates ripples) and flips html[data-gfx]. No reload, no duplicated
       resync logic here. */
    if(t.value==='low' || t.value==='medium' || t.value==='high'){
      setPut('sv_set_gfxLevel', t.value);
      try{ window.dispatchEvent(new Event('svara-gfx-change')) }catch(e){}
      toast(t.value==='low' ? 'Graphics: Low' : t.value==='medium' ? 'Graphics: Medium' : 'Graphics: High');
    }
  }
  /* Wave 5 (UI-2): the sliding segmented control keeps its state in the radios; data-i (the thumb
     index) is mirrored from whichever one the user just picked. Persistence above is untouched. */
  if(key==='repeat' || key==='provider' || key==='gfxLevel' || key==='crossfade' || key==='typeScale') syncSeg(key);
});
/* ONE delegated click handler: the gear, every panel action, and click-outside */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;
  if(t.closest('#setBtn')){ setShow(!setOpen); return }
  if(!setOpen) return;
  var a = t.closest('[data-setact]');
  if(a){
    var act = a.getAttribute('data-setact');
    if(act==='close'){ setShow(false); return }
    if(act==='histpage'){ setShow(false); openHistory(true); return }   /* Wave 4AS: the History page */
    if(act==='about'){ aboutShow(true); return }             // Wave 4F: card on top of the panel
    if(act==='cancel'){ setCfm = ''; setRender(); return }
    if(act==='hist'){ setCfm = 'hist'; setRender(); return }
    if(act==='hist_yes'){ setCfm = ''; setRender(); setClearHist(); return }
    if(act==='likes'){ setCfm = 'likes'; setRender(); return }
    if(act==='likes_yes'){ setCfm = ''; setRender(); setClearLikes(); return }
    if(act==='export'){ setExport(); return }
    if(act==='import'){ var f = document.getElementById('setFile'); if(f) f.click(); return }
    if(act==='import_yes'){ setImportApply(); return }
    return;
  }
  /* click outside closes — but only for real clicks: a programmatic click (the lyrics
     provider chip in the player, for instance) must not close the panel underneath us.
     Wave 4F: the About overlay is not the panel, so a click inside it leaves the panel open. */
  if(e.isTrusted !== false && !t.closest('#setPanel') && !t.closest('#aboutCard')) setShow(false);
});
/* Escape closes the panel first: capture phase so the base Esc handler (menu / modal /
   #pv) does not fire as well. While the modal is open, Esc is left to the base handler. */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  var m = document.getElementById('modal');
  if(m && m.classList.contains('show')) return;
  if(!setOpen) return;
  e.stopPropagation(); e.preventDefault();
  if(aboutOpen){ aboutShow(false); return }      // Wave 4F: About closes FIRST …
  setShow(false);                                // … then the panel, then nothing else
}, true);

/* the frozen keys are applied once, at startup, and only when they exist */
(function setBoot(){
  var v = LS.get('sv_set_volume', null);
  if(typeof v==='number' && isFinite(v)) setVolume(v);          // the mini slider stays the owner
  var sh = LS.get('sv_set_shuffle', null);
  if(typeof sh==='boolean') shuffle = sh;                       // flag only: no queue yet to reorder
  var rp = LS.get('sv_set_repeat', null);
  if(rp==='off'||rp==='all'||rp==='one') repeat = rp;
  var ap = LS.get('sv_set_autoplay', null);
  if(typeof ap==='boolean') v3autoOn = ap;
  LS.set('sv_auto', v3autoOn ? 'on' : 'off');
  try{ if(window.svaraXfade) window.svaraXfade.set(LS.get('sv_set_crossfade','2')||'2') }catch(e){}   // UI-5 (engine re-reads it on its own too)
  try{ paintControls(); paintShuf(); paintAuto() }catch(e){}
})();
/* the open panel mirrors the live player (the mini player can change under it) */
setInterval(function(){ if(setOpen) setSync() }, 900);

/* ---------- keepers ---------- */
setInterval(function(){ homeLine(); paintShuf(); paintAuto(); ensureKnob(); }, 1200);
setTimeout(function(){ ensureKnob(); homeLine(); paintShuf(); }, 600);

<script id="v4artfadejs">
(function(){
  /* ============= WAVE 4AI / 4AI-b — track-change cover crossfade (JS half) ============
     Placed AFTER every existing setNowUI wrapper (v3js, then v3art), so this wraps the FINAL
     version and runs last. No markup change, no new dependency, and onload/onerror are never
     overwritten — v3art shares both images.

     4AI-b adds the mini player: #mArt, whose host #mini .miniL .art already carries its own
     gradient, so the IDENTICAL technique drops in. ONE hook, ONE track-id trigger, ONE set of
     wrappers — one surface descriptor per image. No second <img>, no markup change, no second
     style block.

     Why: base setNowUI writes .src instantly, so a track change is a hard cut — and until the
     new URL decodes, the host's own gradient is what you see. So when a REAL cover is already
     displayed we put that old cover on the HOST's inline background (it sits UNDER the img), set
     the img to opacity 0 with no transition, and let the incoming image load. On `load` the
     class comes off: the new cover fades in over the old one, opacity only, .22s (v4artfadecss).
     ~240ms later the old background is retired — invisible, because an opaque, object-fit:cover
     img already covers the whole box.

     v3art's retry/fallback ladder is untouched and keeps working on BOTH images: it reassigns
     .src, and the `error` listener below drops the stale cover so a track that fails can never
     leave the PREVIOUS cover on screen; a later successful load (direct or proxied) paints at
     full opacity, and the flat tile the ladder ends on loads with no fade pending, so it shows.

     Out-of-order safety (rapid skips): a fade in flight is RE-TARGETED to the newest track
     instead of being restarted (the img is mid-load then, so it is no longer "a real image"),
     only pendingId === curId may reveal, a stale `load` is rejected by comparing currentSrc,
     and every clear is token-guarded so a late timer can never wipe a newer fade's background. */
  var reduced = function(){
    try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) }catch(e){ return false }
  };

  /* ONE crossfade per surface: the image that paints, plus the host div that carries the
     outgoing cover on its background. #pv .pvArt and #mini .miniL .art both already paint
     their own gradient, so the identical technique drops into either one unchanged. */
  function surface(img, host){
    if(!img || !host) return null;
    var lastId    = null;   // track id whose cover this img currently holds
    var curId     = null;   // track id of the LATEST setNowUI() call
    var curSrc    = '';     // that call's src (absolute) — used to reject stale `load` events
    var pendingId = null;   // track id we are fading TO (null ⇒ nothing in flight)
    var token     = 0;      // identifies which fade owns the inline background
    /* The host's own rule is the `background` shorthand, which leaves background-size/-position
       at their initial values: an un-sized cover would tile at natural size instead of matching
       the img's object-fit:cover. Set together with the image, cleared together with it. */
    function paint(src){
      host.style.backgroundImage = 'url("' + String(src).replace(/"/g, '%22') + '")';
      host.style.backgroundSize = 'cover';
      host.style.backgroundPosition = 'center';

    /* Retire the old cover. `owner` (when given) must still own the background, otherwise a
       newer fade has already painted its own and this clear would be a gradient flash. */
    function drop(owner){
      if(owner !== undefined && owner !== token) return;
      img.classList.remove('artswap');
      host.style.backgroundImage = '';
      host.style.backgroundSize = '';
      host.style.backgroundPosition = '';
    }
    function clear(){ pendingId = null; drop() }
    /* Runs BEFORE base setNowUI, while the img still holds the OUTGOING cover. */
    function before(id){
      var changed = (id !== null && id !== lastId);
      if(pendingId !== null){
        /* mid-skip: the img is loading (so it is not "a real image" any more) — keep the old
           cover already on screen and just point the pending reveal at the newest track. */
        if(changed) pendingId = id; else clear();
      }else if(changed && !reduced() && img.complete && img.naturalWidth > 0 && img.style.display !== 'none'){
        var oldSrc = img.currentSrc || img.src || '';
        if(oldSrc){
          token++;
          pendingId = id;
          paint(oldSrc);
          img.classList.add('artswap');      // opacity 0, transition:none → instant, no flash
        }

    }
    /* Runs AFTER base setNowUI, when the new src is in place — the staleness witness. */
    function after(id){
      lastId = id; curId = id; curSrc = img.src || '';
      /* the new track has no artwork at all. Base setNowUI signals that per image — it drops
         'src' on #pvImg but HIDES #mArt (whose old src stays in place) — so both facts mean the
         same thing here: nothing to fade to, and the previous cover must not sit there. */
      if(!img.getAttribute('src') || img.style.display === 'none') clear();
    }
    /* ONE persistent listener pair per image. onload/onerror are deliberately NOT touched
       (v3art shares both elements), and `load` only reveals the LATEST pending track. */
    img.addEventListener('load', function(){
      if(!img.naturalWidth) return;                                        // not a real paint
      if(pendingId === null) return;                                       // nothing in flight
      if(pendingId !== curId) return;                                      // track changed again
      if(curSrc && img.currentSrc && img.currentSrc !== curSrc) return;    // stale load
      var owner = token;
      pendingId = null;
      img.classList.remove('artswap');       // fade the new cover in over the old background
      setTimeout(function(){ drop(owner) }, 240);                          // retire the old cover
    });
    img.addEventListener('error', function(){
      /* a failed track must not leave the PREVIOUS cover on screen; the ladder retries and a
         later successful load paints normally. */
      clear();
    });
    return { before: before, after: after, clear: clear };
  }

  var pvFade   = surface(document.getElementById('pvImg'), document.querySelector('#pv .pvArt'));
  var miniFade = surface(document.getElementById('mArt'),  document.querySelector('#mini .miniL .art'));
  var surfaces = [pvFade, miniFade].filter(Boolean);
  if(!surfaces.length) return;                // no player surface at all: nothing to do

  var _setNow = setNowUI;
  setNowUI = function(it){
    var id = (it && it.id) || null;
    var i;
    for(i=0;i<surfaces.length;i++) surfaces[i].before(id);   // capture the outgoing cover
    var r = _setNow(it);                     // unchanged — v3art's retry ladder still runs
    for(i=0;i<surfaces.length;i++) surfaces[i].after(id);
    return r;
  };

  /* Empty player state (queue cleared / last row removed / track with nothing to play): those
     paths all call paintControls(), and none of them may leave a half-faded cover behind. */
  var _paintControls = paintControls;
  paintControls = function(){
    if(!queue.length) for(var i=0;i<surfaces.length;i++) surfaces[i].clear();
    return _paintControls.apply(this, arguments);
  };

  /* Closing the page mid-load clears the PLAYER-page fade now, so reopening can never show a
     leftover cover there. The mini player stays on screen when the page closes, so its fade is
     deliberately left running. */
  var _closePV = closePV;
  closePV = function(){
    if(pvFade) pvFade.clear();
    return _closePV.apply(this, arguments);
  };
})();
</script>

   every handler attribute, and EVERY data-* hook (no data-play / data-id / data-menu / data-q /

   the scope chain at call time. renderHome() ALSO runs once from the base init (~line 1089),
   which is parsed BEFORE this block, so each call site keeps the original text as its fallback
   (`typeof skRows === 'function' ? … : …`): the boot paint is byte-for-byte what it was, and
   every later repaint uses the skeleton. */

                                '<div class="rname sk-bar sk-bar-r"></div>'+
                                '<div class="rsub2 sk-bar sk-bar-s2"></div></div>';

function _4apbNorm(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim() }
function needsCredit(it){ if(!it) return false; return !it.artist || _4apbNorm(it.artist) === _4apbNorm(it.title) }
var _4apbCredit = {};    // id -> {artist, artists, thumb} recovered this session
var _4apbMiss = {};      // id -> searched, found no exact-id row (never re-fetched)
var _4apbInflight = {};  // id -> [callbacks] while a fetch is in flight
function _4apbAdopt(it, c){
  if(!c || !it) return false;
  it.artist = c.artist || '';
  if(c.artists) it.artists = c.artists;
  if(!it.thumb && c.thumb) it.thumb = c.thumb;
  try{ if(hist && hist[it.id]){ hist[it.id].artist = it.artist; if(it.thumb) hist[it.id].thumb = it.thumb; LSset('ml_history', hist) } }catch(e){}
  return !!it.artist;
}
function repairCredit(it, done){
  if(!it || !it.id){ if(done) try{done(it,false)}catch(e){} return }
  if(!needsCredit(it)){ if(done) try{done(it,false)}catch(e){} return }      // already has a usable credit
  if(_4apbCredit[it.id]){ var ok=_4apbAdopt(it,_4apbCredit[it.id]); if(done) try{done(it,ok)}catch(e){} return }
  if(_4apbMiss[it.id]){ if(done) try{done(it,false)}catch(e){} return }        // attempted, no match — never re-fetch
  if(_4apbInflight[it.id]){ if(done) _4apbInflight[it.id].push(done); return }
  _4apbInflight[it.id] = done ? [done] : [];
  fetch('/api/search?q=' + encodeURIComponent(it.title || '') + '&type=song')
    .then(function(r){ return r.json() })
    .then(function(j){
      var row = (j && j.items || []).filter(function(x){ return x && x.id === it.id })[0];   // EXACT id only
      if(row && row.artist){ _4apbCredit[it.id] = { artist: row.artist, artists: row.artists, thumb: row.thumb } }
      else { _4apbMiss[it.id] = true }
    })
    .catch(function(){ _4apbMiss[it.id] = true })                              // error: leave untouched, don't loop
    .then(function(){
      var ok = _4apbCredit[it.id] ? _4apbAdopt(it, _4apbCredit[it.id]) : false;
      var cbs = _4apbInflight[it.id] || []; delete _4apbInflight[it.id];
      cbs.forEach(function(cb){ try{ cb && cb(it, ok) }catch(e){} });
    });
}
/* repaint everywhere the credit appears — ONLY when the repaired item is the one playing */
function afterCreditRepair(it){
  if(!it || !it.id) return;
  var n=(typeof nowItem==='function')&&nowItem();
  if(n && n.id===it.id){
    try{ if(typeof setNowUI==='function') setNowUI(it) }catch(e){}
    try{ if(typeof renderQueue==='function') renderQueue() }catch(e){}
    try{
      var pl=document.getElementById('pvLyrics');
      if(pl && !pl.hidden){ if(typeof lyr==='object' && lyr) lyr.loadedFor=null; if(typeof loadLyrics==='function') loadLyrics() }
    }catch(e){}
  }
  if(typeof repairHomeCredits==='function'){ try{ repairHomeCredits() }catch(e){} }
}
/* Home: repair the entries actually being rendered — bounded to 8, concurrency 2, deduped,
   in-flight-guarded, then re-render Home ONCE (debounced) so the rails pick up the values. */
var _4apbHomeTimer=null;
function _4apbHomeDirty(){
  if(_4apbHomeTimer) return;
  _4apbHomeTimer=setTimeout(function(){ _4apbHomeTimer=null; try{ if(typeof curPage!=='undefined' && curPage==='home') renderHome() }catch(e){} }, 350);
}
function repairHomeCredits(){
  if(typeof curPage==='undefined' || curPage!=='home') return;
  var ids=[], seen={};
  var nodes=document.querySelectorAll('#homeSec [data-id]');
  for(var i=0;i<nodes.length && ids.length<8;i++){
    var id=nodes[i].getAttribute('data-id'); if(!id||seen[id]) continue; seen[id]=1; ids.push(id);
  }
  var queue=[];
  ids.forEach(function(id){ var e=hist && hist[id]; if(e && needsCredit(e)) queue.push(e) });
  if(!queue.length) return;
  var conc=0, idx=0;
  function pump(){
    while(conc<2 && idx<queue.length){
      var e=queue[idx++]; conc++;
      repairCredit(e, function(item, ok){ conc--; pump(); if(ok) _4apbHomeDirty() });
    }
  }
  pump();
}
(function(){
  /* old history entries carry a junk thumb and sometimes no id at all */
  var changed = false;
  /* 4AP: a stored entry whose artist equals its OWN title is a title-only credit (the old
     /api/radio byline() poison). Clear the artist but KEEP the entry — never bulk-delete. */
  var _nc=function(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()};
  try{
    Object.keys(hist||{}).forEach(function(k){
      var e = hist[k]; if(!e || typeof e !== 'object') return;
      if(!e.id){ e.id = k; changed = true }                                   // the key IS the video id
      if(!e.thumb || !/^https?:\/\//i.test(String(e.thumb))){ e.thumb = ''; changed = true }
      if(typeof e.count !== 'number'){ e.count = 1; changed = true }
      if(e.artist && _nc(e.artist) === _nc(e.title)){ e.artist = ''; changed = true }
    });
    if(changed) LSset('ml_history', hist);
  }catch(e){}

  /* re-render so the rails pick up the repaired data */
  setTimeout(function(){ try{ if(curPage==='home') renderHome() }catch(e){} }, 400);
})();
</script>

<script id="v3seek2js">
(function(){
  var wrap  = document.getElementById('pseekWrap');
  if(!wrap) return;
  var input = document.getElementById('pseek');
  var seeking = false;

  function frac(clientX){
    var d = audio.duration;
    if(!isFinite(d) || d <= 0) return -1;
    var r = wrap.getBoundingClientRect();
    if(!r.width) return -1;
    var f = (clientX - r.left) / r.width;
    return f < 0 ? 0 : f > 1 ? 1 : f;
  }
  function seekFrom(e){
    var f = frac(e.clientX);
    if(f < 0) return false;
    audio.currentTime = f * audio.duration;
    if(input) input.value = f * 1000;
    try{ paintSeek() }catch(err){}
    return true;
  }
  function stop(e){
    seeking = false;
    wrap.classList.remove('dragging');
    try{ if(e && e.pointerId != null && wrap.hasPointerCapture(e.pointerId)) wrap.releasePointerCapture(e.pointerId) }catch(err){}
  }

  wrap.addEventListener('pointerdown', function(e){
    if(e.button !== undefined && e.button !== 0) return;
    if(!seekFrom(e)) return;                 // no duration loaded yet
    seeking = true;
    wrap.classList.add('dragging');
    try{ wrap.setPointerCapture(e.pointerId) }catch(err){}
    e.preventDefault();
  });
  wrap.addEventListener('pointermove', function(e){
    if(!seeking) return;
    if(seekFrom(e)) e.preventDefault();
  });
  wrap.addEventListener('pointerup', stop);
  wrap.addEventListener('pointercancel', stop);
  wrap.addEventListener('lostpointercapture', stop);
})();
</script>

<script id="v3tipjs">
(function(){
  var wrap  = document.getElementById('pseekWrap'); if(!wrap) return;
  var track = wrap.querySelector('.psTrack');
  var tip   = document.getElementById('psTip');
  var ghost = document.getElementById('psGhost');
  if(!track) return;

  /* a dot at the cursor end of the ghost line */
  var dot = document.getElementById('v3tipdot');
  if(!dot){
    dot = document.createElement('div');
    dot.id = 'v3tipdot'; dot.className = 'v3tipdot';
    track.appendChild(dot);
  }

  var dragging = false;
  function dur(){ var d = audio.duration; return (isFinite(d) && d > 0) ? d : 0 }

  function move(e){
    if(dragging) return;                                  // no bubble while scrubbing
    var d = dur(); if(!d) return;                         // nothing loaded yet
    var r = wrap.getBoundingClientRect(); if(!r.width) return;

    var h = (e.clientX - r.left) / r.width;  h = h < 0 ? 0 : h > 1 ? 1 : h;
    var p = (audio.currentTime || 0) / d;    p = p < 0 ? 0 : p > 1 ? 1 : p;

    if(ghost){                                            // playhead → cursor
      ghost.style.left    = Math.min(p, h) * 100 + '%';
      ghost.style.width   = Math.abs(h - p) * 100 + '%';
      ghost.style.opacity = 1;
    }
    if(dot){ dot.style.left = h * 100 + '%'; dot.style.opacity = 1 }

    if(tip){
      tip.hidden = false;
      tip.textContent = fmt(h * d);
      tip.style.left = h * 100 + '%';
      var tw = tip.offsetWidth || 44, px = h * r.width, shift = 0;   // keep it on the bar
      if(px - tw / 2 < 0)                 shift = tw / 2 - px;
      else if(px + tw / 2 > r.width)      shift = r.width - px - tw / 2;
      tip.style.transform = 'translateX(calc(-50% + ' + Math.round(shift) + 'px))';
    }
  }
  function leave(){
    if(ghost) ghost.style.opacity = 0;
    if(dot)   dot.style.opacity   = 0;
    if(tip)   tip.hidden = true;
  }

  wrap.addEventListener('mousemove', move);               // after the built-in handler → wins
  wrap.addEventListener('mouseleave', leave);
  wrap.addEventListener('pointerdown', function(){ dragging = true; leave() });
  ['pointerup','pointercancel'].forEach(function(ev){
    wrap.addEventListener(ev, function(){ setTimeout(function(){ dragging = false }, 80) });
  });
})();
</script>

/* ================= WAVE 5 (UI-1) — live wave canvas background =================

   gated behind html[data-fx="full"] / html[data-fx="bal"], and in "classic" the wave script

   so the wave paints ABOVE the album-colour layer and BELOW every surface: #sb (z 5), the tab
   bar, rows, the ⋮ menu / #shist (z 30), Settings (z 96), About (z 98) and the full player.

   v4wavejs flips `mix-blend-mode` in syncView() because only the JS knows Home from non-Home.

   MOTION: the wave ANIMATES on every view (Home at full opacity, every other page at 0.4). It is
   never frozen on a frame; it only stops when the window is hidden or blurred, and reduced-motion
   still paints ONE static frame. Overlays (Settings, About, the queue) never change wave state.

   TUNABLES (one line each):
     --wave-scrim : strength of the flat scrim painted over the wave for text readability (0 = off)

   .rtitle/.rsub, #artSec's .artrow/.artalb/.artdur/.art-hero/.art-fit, .railwrap/.rail/.art/
   .rname/.rsub2 — so every size, radius, gap, padding and font is INHERITED from 4AC and the
   base layer and re-specified NOWHERE. This block only PAINTS: a light alpha fill plus ONE
   shimmer band per region. Nothing here can touch real content: every selector is scoped to
   .sk-region / .sk-hero / .sk-bar / .sk-card, which exist only in skeleton markup.

   and it is never a solid or dark hard-coded colour. The bars carry the EXACT measured line-box
   heights for their real font sizes (15px → 20px, 13px → 17.33px, 11.5px → 15.33px), so a
   skeleton row totals the same 8 + 64 + 8 = 80px as a real one.

   The band is ONE .sk-band per region, animating transform only (compositor work — no layout and
   no re-paint of the rows), and the region clips it with overflow:hidden. It is NOT
   background-position. It is an ELEMENT, not a ::after, and that is a measured decision: the
   existing reduced-motion reset is `*{animation:none!important}`, and the universal selector

<script id="v4wavejs">
/* ================= WAVE 5 (UI-1) — live wave canvas, faithful port =================
   Plain 2D canvas, no WebGL, no library, no new dependency, no build step — one file.
   The visual math is the supplied reference, character-for-character (brightness is the one
   documented change: a nonlinear lift, see `gain`). Safety/perf: fps cap, one rAF loop, pause
   hidden/blur, debounced resize, zero per-frame allocations, reduced-motion static frame, CSS
   opacity gating, and — because the visible-window measurement showed the pixel loop janks the
   MAIN thread at scale 2 — the pixel loop runs in a Blob Web Worker via
   canvas.transferControlToOffscreen() when the browser supports it (main-thread fallback kept).
   `gain` is a NONLINEAR LIFT on the final r/g/b (not a multiply): 1 = bit-identical to the
   reference. The reference math is a DIM navy/indigo wash — it is NOT meant to be bright;
   1.35 is the agreed tuned value. */
(function(){
  'use strict';

  var boot = window.__waveCfg || {};
  /* classic ⇒ no canvas element at all, no loop. This is the leak-proof branch. */
  if(boot.mode === 'classic') return;

  /* ---- ONE config object — every knob is a single edit right here ---- */
  /* boot.mode was resolved ONCE in #v4fxboot: sv_set_gfxLevel ('low'/'medium'/'high') is
     authoritative when set (low ⇒ classic, medium ⇒ bal, high ⇒ full), else the legacy
     shaderIntensity / lowPower mapping. WAVE.scale / WAVE.fps below are consequently FROZEN for
     the session, so a live graphics-level change applies to the wave on the NEXT LAUNCH. */
  var WAVE = { scale:2, fps:60, gain:1.35, homeOpacity:1, dimOpacity:0.4, artistOpacity:0.55 };
  if(boot.mode === 'bal'){ WAVE.scale = 3; WAVE.fps = 30 }          // 'low' | 'medium'
  /* 'full' keeps the LADDER. The visible-window measurement showed scale 2 / 60 fps could not
     hold ~55 fps (rAF ~15 fps, 49 long tasks up to 73 ms), so the pixel loop is moved off the
     main thread (Blob worker + transferControlToOffscreen, see below). The worker cannot do
     scale 2 at 60 either (~20 fps on this CPU), so the escalated scales stay; the worker's job is
     to keep the MAIN thread at baseline. Without OffscreenCanvas the same ladder runs on the
     main thread. One line to revisit if the machine changes. */
  if(boot.mode === 'full'){ WAVE.scale = 4; WAVE.fps = 60 }         // 'high'
  if(boot.lowPower){ WAVE.scale = 4; WAVE.fps = 30 }                // defensive: lowPower already ⇒ classic

  /* (1) Brightness — keep `gain`, but lift nonlinearly instead of multiplying:
       lift = gain - 1
       lc(c) = min(1, c^(1/gain) + 0.02*lift)

     and the reference channels never exceed 1 before this point). Hoisted out of render() so the
     zero-per-frame-allocation rule still holds. */
  var lift = WAVE.gain - 1;
  function lc(c){ return Math.min(1, Math.pow(c, 1 / WAVE.gain) + 0.02 * lift) }

  var startTime = Date.now();

  function fastSin(x){ return SIN_TABLE[Math.floor(((x % (Math.PI*2)) / (Math.PI*2)) * 1024) & 1023] }

    canvas.height = h;

    var time = (Date.now() - startTime) * 0.001;
    for(var y = 0; y < height; y++){
      for(var x = 0; x < width; x++){
        var u_x = (2*x - width) / height;
        var u_y = (2*y - height) / height;
        var a = 0, d = 0;
        for(var i = 0; i < 4; i++){
          a += fastCos(i - d + time*0.5 - a*u_x);
          d += fastSin(i*u_y + a);
        }
        var wave      = (fastSin(a) + fastCos(d)) * 0.5;
        var intensity = 0.3 + 0.4 * wave;
        var baseVal   = 0.1 + 0.15 * fastCos(u_x + u_y + time*0.3);
        var blueAcc   = 0.2  * fastSin(a*1.5 + time*0.2);
        var purpleAcc = 0.15 * fastCos(d*2   + time*0.1);
        var r  = Math.max(0, Math.min(1, baseVal + purpleAcc*0.8)) * intensity;
        var gc = Math.max(0, Math.min(1, baseVal + blueAcc*0.6))   * intensity;
        var b  = Math.max(0, Math.min(1, baseVal + blueAcc*1.2 + purpleAcc*0.4)) * intensity;
        var idx = (y*width + x) * 4;

    rafId = requestAnimationFrame(tick);
    var now = (typeof ts === 'number') ? ts : Date.now();
    if(now - lastDraw < 1000 / WAVE.fps) return;      /* real fps cap, not a suggestion */
    lastDraw = now;
    render();

  }

  function startLoop(){
    if(running) return;
    running = true; window.__wave.running = true;
    lastDraw = 0;
    rafId = requestAnimationFrame(tick);
  }

    var running = false, rafId = 0, lastDraw = 0, frames = 0, posted = 0;
    var SIN = new Float32Array(1024), COS = new Float32Array(1024);
    for(var t = 0; t < 1024; t++){ var an = (t/1024)*Math.PI*2; SIN[t] = Math.sin(an); COS[t] = Math.cos(an) }

    function fastCos(x){ return COS[Math.floor(((x % (Math.PI*2)) / (Math.PI*2)) * 1024) & 1023] }

         measurement can be 0x0). Keep the LAST GOOD frame instead of writing a dead canvas; the
         main thread re-measures on load and on every resize. */

      var sw = Math.floor(w / scale), sh = Math.floor(h / scale);

    }
    function render(){
      if(!data || W < 1 || H < 1) return;             /* nothing measured yet — never touch img */
      var time = (Date.now() - startTime) * 0.001;
      for(var y = 0; y < H; y++){
        for(var x = 0; x < W; x++){
          var u_x = (2*x - W) / H;
          var u_y = (2*y - H) / H;
          var a = 0, d = 0;
          for(var i = 0; i < 4; i++){
            a += fastCos(i - d + time*0.5 - a*u_x);
            d += fastSin(i*u_y + a);
          }
          var wave      = (fastSin(a) + fastCos(d)) * 0.5;
          var intensity = 0.3 + 0.4 * wave;
          var baseVal   = 0.1 + 0.15 * fastCos(u_x + u_y + time*0.3);
          var blueAcc   = 0.2  * fastSin(a*1.5 + time*0.2);
          var purpleAcc = 0.15 * fastCos(d*2   + time*0.1);
          var r  = Math.max(0, Math.min(1, baseVal + purpleAcc*0.8)) * intensity;
          var gc = Math.max(0, Math.min(1, baseVal + blueAcc*0.6))   * intensity;
          var b  = Math.max(0, Math.min(1, baseVal + blueAcc*1.2 + purpleAcc*0.4)) * intensity;
          var idx = (y*W + x) * 4;
          data[idx] = lc(r)*255; data[idx+1] = lc(gc)*255; data[idx+2] = lc(b)*255; data[idx+3] = 255;

      }
      ctx.putImageData(img, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(canvas, 0, 0, W, H, 0, 0, canvas.width, canvas.height);
    }

      ? requestAnimationFrame
      : function(cb){ return setTimeout(function(){ cb(Date.now()) }, 1000 / fps) };
    var CAF = (typeof cancelAnimationFrame === 'function')
      ? cancelAnimationFrame
      : function(id){ clearTimeout(id) };
    function tick(ts){
      if(!running) return;
      rafId = RAF(tick);
      var now = (typeof ts === 'number') ? ts : Date.now();
      if(now - lastDraw < 1000 / fps) return;

    function stop(){ running = false; if(rafId){ CAF(rafId); rafId = 0 } }

      var m = e.data;

      } else if(m.type === 'resize'){
        size(m.w, m.h);
        if(!running) render();
      } else if(m.type === 'start'){ start()
      } else if(m.type === 'stop'){ stop() }

  function setOpacity(op){ canvas.style.setProperty('--wave-op', String(op)) }

  /* Reuses the app's EXISTING view state — no new router. Home is the ONLY view at full opacity;
     every other PAGE (search, liked, playlist, artist, album, full player) sits at dimOpacity but
     the wave keeps ANIMATING everywhere — a frozen dim frame reads as broken with the worker's
     pixel loop. The overlays — Settings (#setPanel), About (#aboutCard) and the queue — are
     deliberately NOT consulted: they sit ON TOP of a page that is already showing, so opening or
     closing one must never change the wave. ONLY the PAGE decides (and only `body.pv` — the
     full-screen player — keeps the 0.4 treatment). */

    try{ if(curPage !== 'home') return false }catch(e){ return false }
    if(document.body.classList.contains('pv')) return false;              // full player page
    if(isArtistView()) return false;                                      // artist page (v3js-local fn)
    return true;
  }

     now dissolves INTO the wave (bottom alpha mask), so unlike every other page there is real
     artwork colour under the `screen` composite. Everything else stays at dimOpacity. */
  function isArtistView(){ var a = document.getElementById('artSec'); return !!(a && !a.hidden) }
  function syncView(){
    var home = isHomeView();
    setOpacity(home ? WAVE.homeOpacity : (isArtistView() ? WAVE.artistOpacity : WAVE.dimOpacity));

    if(!document.hidden) startLoop();       /* wave animates on EVERY view; only hidden/blur stops it */
  }

     openArtist/restoreView are scoped to the v3js IIFE and have no global binding — they are
     handled by the DOM checks in isHomeView() + the observer below instead. */
  function wrapGlobal(name){
    var fn = window[name];
    if(typeof fn !== 'function') return;

  }
  function installHooks(){

       v3js already wraps. Missing bindings are skipped, never thrown over. */

    for(var i = 0; i < names.length; i++) wrapGlobal(names[i]);
    /* Everything else (the artist page and .pv) cannot be wrapped from here — it is scoped to
       the v3js IIFE — and #artSec does not even exist until an artist page opens. So watch
       class/hidden changes anywhere under <body>; only those two attributes, batched by the
       observer. syncView() keys off the PAGE alone, so a Settings/About/queue class change is
       harmless: it re-runs syncView() and changes nothing. The observer must NEVER gate on a
       panel. */
    try{
      if(window.MutationObserver){

        mo.observe(document.body, { attributes:true, attributeFilter:['class','hidden'], subtree:true });
      }
    }catch(e){}

    /* WAVE 14b — RE-MEASURE ON LOAD. The canvas is built during parsing, while the shell window may
       still be 0-sized (it is created with show:false). This is the frame that heals that first
       reading, whether or not the user ever resizes the window. */
    document.addEventListener('DOMContentLoaded', function(){
      resizeCanvas(); syncView();
      /* non-worker + reduced motion paints ONE static frame and never loops, so it needs this
         explicit repaint to come back from a 0-sized first measurement. (Worker mode repaints
         its own paused frame on the resize message.) */
      if(REDUCED && !workerMode) render();
    });
    setTimeout(function(){ syncView() }, 450);        /* the 400ms v3hist Home re-render */

    /* Never leave a loop running off-view. */
    document.addEventListener('visibilitychange', function(){ if(document.hidden) stopLoop(); else syncView() });
    window.addEventListener('blur', function(){ stopLoop() });
    window.addEventListener('focus', function(){ syncView() });

    /* Resize: debounce ~150ms, then rebuild the ImageData and repaint ONE frame. */
    var rt = 0;
    window.addEventListener('resize', function(){
      if(rt) clearTimeout(rt);
      rt = setTimeout(function(){
        rt = 0;
        resizeCanvas();
        if(!running && !workerMode) render();          /* worker repaints its own paused frame */
      }, 150);
    });
  }

  /* ---- Worker escalation: move the pixel loop off the main thread. ---- */
  var worker = null;
  if(workerMode){
    worker = new Worker(URL.createObjectURL(new Blob(
      ['(' + waveEngine.toString() + ')(self);'],
      { type:'application/javascript' }
    )));
    var off = canvas.transferControlToOffscreen();
    worker.postMessage({
      type:'init', canvas:off, w:window.innerWidth, h:window.innerHeight,
      scale:WAVE.scale, fps:WAVE.fps, gain:WAVE.gain, once:REDUCED
    }, [off]);
    worker.onmessage = function(e){ var m = e.data; if(m && m.type === 'frames') window.__wave.frames = m.n };
    /* Same single-loop guard, but each control is now a message to the worker. */
    startLoop = function(){ if(running) return; running = true; window.__wave.running = true; worker.postMessage({ type:'start' }) };
    stopLoop  = function(){ running = false; window.__wave.running = false; worker.postMessage({ type:'stop' }) };
    resizeCanvas = function(){ worker.postMessage({ type:'resize', w:window.innerWidth, h:window.innerHeight }) };
  } else {
    resizeCanvas();
    if(REDUCED) render();                             /* ONE static frame when motion is reduced */
  }
  installHooks();
  syncView();                                         /* Home is the boot view */
})();
</script>

<script id="v4arjs">
/* ===== Wave 4AR — "Remove from taste": exclude a track from every AUTOMATIC pick =====
   Track-level (by video id) ONLY — the artist's other songs stay in taste. Explicit actions
   (search, clicking it, Play now, Play next, Add to queue, playlists, Listen again) are
   untouched; only the automatic paths filter it out: the dice/radio pool, the similar/autoplay
   handoff, and taste scoring. */
var TASTE_EXCLUDED = LSget('sv_taste_excluded', []) || [];
if(!Array.isArray(TASTE_EXCLUDED)) TASTE_EXCLUDED = [];
function tasteExcluded(id){ return !!id && TASTE_EXCLUDED.indexOf(id) >= 0 }
function setTasteExcluded(id, on){
  if(!id) return;
  if(on){ if(TASTE_EXCLUDED.indexOf(id) < 0) TASTE_EXCLUDED = TASTE_EXCLUDED.concat([id]) }
  else TASTE_EXCLUDED = TASTE_EXCLUDED.filter(function(x){ return x !== id });
  LSset('sv_taste_excluded', TASTE_EXCLUDED);
}
/* Ids the autoplay handoff (appendRadio) appended to the queue. The queue NEVER holds two entries
   with the same id — base addQueue and the v2js insertNext both dedupe by id — so an id reliably
   identifies the entry. Cleared whenever playList() replaces the queue (an explicit list), so an
   explicitly queued track can never be mistaken for an auto-added one. This survives syncSeq()
   and loadAt() because neither touches it (they only reorder indices into `queue`). */
var AUTO_QUEUE_IDS = [];
function markAutoQueued(id){ if(id && AUTO_QUEUE_IDS.indexOf(id) < 0) AUTO_QUEUE_IDS.push(id) }
var _4arPlayList = playList;
playList = function(list, idx, openPv){ AUTO_QUEUE_IDS = []; return _4arPlayList(list, idx, openPv) };
function toggleTasteExcluded(it){
  if(!it || !it.id) return;
  var on = !tasteExcluded(it.id);
  setTasteExcluded(it.id, on);
  if(on){
    /* only an entry an AUTOMATIC path added may be dropped; an explicitly queued one stays */
    if(AUTO_QUEUE_IDS.indexOf(it.id) >= 0){
      AUTO_QUEUE_IDS = AUTO_QUEUE_IDS.filter(function(x){ return x !== it.id });
      if(typeof removeFromQueue === 'function' && queue.some(function(x){ return x && x.id === it.id })) removeFromQueue(it.id);
    }
  }
  toast(on ? "Removed from taste — won't play on its own" : 'Added back to taste');
}
/* Home's Quick picks are the taste-scored list — repaint so the change shows immediately. */
try{ if(typeof curPage !== 'undefined' && curPage === 'home') renderHome() }catch(e){}
</script>

/* ---------- About GitHub: the AnimateIcons "github" TAIL WIGGLE (hover / focus-visible) ----------

      {transform:'rotate(20deg)',offset:1/3,easing:'ease-in-out'},
      {transform:'rotate(-15deg)',offset:2/3,easing:'ease-in-out'},
      {transform:'rotate('+a0+'deg)',offset:1,easing:'ease-in-out'}

}
function ghStop(el){

  var a0=ghAngle(st.tail);                    // read while the loop/return still applies
  if(st.tailAn){ try{ st.tailAn.cancel() }catch(e){} st.tailAn=null }
  if(st.returnAn){ try{ st.returnAn.cancel() }catch(e){} st.returnAn=null }

    st.returnAn=st.tail.animate([
      {transform:'rotate('+a0+'deg)',offset:0,easing:'ease-in-out'},
      {transform:'rotate(0deg)',offset:1,easing:'ease-in-out'}
    ],{duration:300,easing:'ease-in-out'});

  }catch(e){}
}
function ghSync(el){
  var st=el.__v4gh; if(!st) return;

     tied to the GitHub button only. */

/* ---------- boot ---------- */

}

<script id="v4settingsjs">
/* ===== Wave 4AY — the animated Settings gear (#setBtn) =====
   #setBtn now owns an INLINE copy of the i-settings glyph. The sprite <symbol id="i-settings">
   is left untouched, so every other settings icon in the app is unaffected — only this button
   can spin. The glyph turns 0 -> 180deg while the panel opens and 180 -> 0deg while it closes,
   both driven by ONE spring (stiffness 50 / damping 10 / mass 1) integrated once per animation
   frame with RK4. No CSS transition and no @keyframes: the angle is written straight to the
   element's transform each frame.

   State is read from aria-expanded, which setShow() already maintains — this file never calls
   setShow(), so the panel's open/close logic is completely untouched. It listens to all four
   close paths for free, because Settings button, X button, Escape and click-outside all funnel
   through setShow(), and setShow() is the only writer of aria-expanded. */
(function(){
'use strict';
/* ---- ONE config object — every knob is a single edit right here ---- */
var GEAR = { stiffness:50, damping:10, mass:1, open:180, closed:0, eps:0.5 };

  try{ if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return true }catch(e){}
  try{ if(localStorage.getItem('sv_set_reduceMotion')==='true') return true }catch(e){}

var svg = btn && btn.querySelector('.ic svg');

   resolves to (12,12) — the gear's centre — and the rotated teeth still sit inside the 18px box
   (max glyph radius ~10.4/24*18 = 7.8px < 9px), so nothing is clipped. */
svg.style.transformOrigin = '50% 50%';
svg.style.willChange = 'transform';

var angle = 0, vel = 0, target = 0, raf = 0, last = 0;

function paint(){ svg.style.transform = 'rotate(' + angle + 'deg)' }

/* the whole spring, written out so the arithmetic is auditable. State is (angle, vel);
   a = ( -k*(angle - target) - c*vel ) / m . Classic RK4 over the frame's dt — with the brief's
   constants this gives the expected peak of ~187.8deg at ~0.63s and a 0.5deg settle at ~1.03s. */
function accel(a, v){ return (-GEAR.stiffness * (a - target) - GEAR.damping * v) / GEAR.mass }
function integrate(dt){
  var k1x = vel,                  k1v = accel(angle, vel);
  var k2x = vel + dt/2*k1v,       k2v = accel(angle + dt/2*k1x, vel + dt/2*k1v);
  var k3x = vel + dt/2*k2v,       k3v = accel(angle + dt/2*k2x, vel + dt/2*k2v);
  var k4x = vel + dt*k3v,         k4v = accel(angle + dt*k3x,     vel + dt*k3v);

  vel   += dt/6 * (k1v + 2*k2v + 2*k3v + k4v);

/* ONE rAF loop. It is started only by a target change and stops the moment the spring is at
   rest, so no frame is scheduled while the gear sits still — including at page load. */
function frame(now){
  raf = 0;
  if(!last) last = now;
  var dt = (now - last) / 1000; last = now;
  if(dt > 0.1) dt = 0.1;              /* a backgrounded tab must not teleport the gear */
  integrate(dt);
  paint();
  if(Math.abs(angle - target) < GEAR.eps && Math.abs(vel) < GEAR.eps){
    angle = target; vel = 0; paint();  /* land exactly, then stop: no frame is re-queued */
    return;
  }
  raf = requestAnimationFrame(frame);
}
function kick(){ if(raf) return; last = 0; raf = requestAnimationFrame(frame) }

/* the ONLY entry point: an aria-expanded change (written by setShow) becomes a spin. */
function sync(){
  var open = btn.getAttribute('aria-expanded') === 'true';
  var next = open ? GEAR.open : GEAR.closed;
  if(next === target) return;
  target = next;
  if(reduced()){                       /* reduced motion: snap, never animate */
    angle = target; vel = 0; paint();
    if(raf){ cancelAnimationFrame(raf); raf = 0 }
    return;
  }

   paint and the very first visible frame already shows the gear turning. */

/* static at load: seed from the attribute, paint once, and never start the loop. */
target = btn.getAttribute('aria-expanded') === 'true' ? GEAR.open : GEAR.closed;
angle = target;
paint();
})();
</script>

   change call it) plus one MutationObserver on #homeSec, which every page switch flips. No loop. */
