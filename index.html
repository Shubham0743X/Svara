  }

  /* ---------- step 2 data: real artists only ---------- */
  function normArtists(items, cap){
    var out=[];
    (items||[]).forEach(function(it){
      if(!it || !it.id || !/^UC/.test(it.id)) return;          // real artist channels only
      var nm = it.title || it.artist || '';
      if(!nm) return;
      out.push({id:it.id, name:nm, thumb:it.thumb||'', cap:cap});
    });
    return out;
  }
  function searchArtists(q, cap){
    return fetch('/api/search?q='+encodeURIComponent(q)+'&type=artist')
      .then(function(r){ return r.json() })
      .then(function(j){ return normArtists(j.items, cap) });
  }
  /* ===== WAVE 8 — the grid is RANKED, and the junk is filtered out =====
     The old version asked "<Genre> artists" / "<Lang> music artists" and painted the first 24 hits in
     QUERY ORDER, which is exactly how an Indian-language pick came back as "Rakhi sharma [21
     subscribers]", "singer muskan [141]" and "Desi Flow Nation [4]", with "Bollywood Christmas [2]",
     "Lo Fi Hip Hop [15.3K]" and "Spanish Guitar Cafe Music [57]" in the same grid (all measured).
     A search for artists is a relevance search, not a popularity one, so the order is the only thing
     wrong with it — and the app already knows how to read an artist's audience: audOf() is the same
     parser wave 7 ranks the picked shelves with, so the picker and the feed can never disagree about
     who a real artist is.
     WHAT A ROW IS, MEASURED — the route serves exactly two shapes:
       "Artist • 39.1M monthly audience"  ← a REAL artist entity (girl in red, Brian Eno, Arijit
                                            Singh, Udit Narayan, Fujii Kaze, Diana Krall…), and
       "Artist • 85 subscribers"          ← a user-made channel wearing the Artist profile: the same
                                            shape as every junk row measured ("Synthwave 7
                                            subscribers", "Jazz Music for Studying 1 subscriber",
                                            "Lo Fi Hip Hop 15.3K", "Bollywood Christmas 2").
     So the grid is TIERED ON THAT WORDING, not on size: every "monthly audience" row is in — sorted by
     audience — and a "subscribers" row is only a FILLER past GRID_AUD_FLOOR = 1e5, ten times lower
     than wave 7's 1e6 because those thresholds do opposite jobs. A ROW must not be filled by a
     channel nobody has heard of, so it wants 1e6; a PICKER must not hide the artists the user came to
     pick, and 1e6 evicted Kishore Kumar (781K), Mohammed Rafi (240K) and R. D. Burman (105K) from a
     Hindi grid while keeping nothing the user would recognise.
     THE PHRASINGS WERE MEASURED PER PICK, because one query is thin for some picks and EMPTY for
     others — "<g> artists" returned zero rows for Synthwave, and "biggest artists India" (the whole
     old no-pick fallback) returned 1 row, then 1, then 0, on a screen the user cannot leave without
     three picks:
       language ⇒ "<L> music" + "<L> singers" + "<L> artists"
       vibe     ⇒ "<g> music" + "<g> singers" + "<g> band"
     Each one earns its place. "<L> music" is what carries the big names (Hindi: Udit Narayan 705M,
     Arijit Singh 643M, A. R. Rahman 557M, Himesh 429M, Kishore Kumar; Punjabi 20 of 20 rows; Tamil 15;
     Korean 9), and the other two carry the picks where "music" only returns channels — Jazz: Diana
     Krall and Samara Joy arrive from "Jazz singers" when "Jazz music" kept NONE; Synthwave: The
     Midnight and Gunship arrive from "Synthwave band" when "Synthwave music" kept none; Acoustic:
     Anuv Jain (185M) arrives from "Acoustic singers".
     AND THE LISTS ARE INTERLEAVED, not concatenated: the old loop let the first query own all 24
     tiles, so a Punjabi pick buried the second and third ones entirely — and each pick's own merge is
     re-sorted (entity first, then audience) BEFORE the round-robin, so a pick's best artist can never
     land past the 24-tile cut. A five-pick user sees all five picks whatever order they chose them
     in. */
  var GRID_AUD_FLOOR = 1e5;
  var GRID_ENTITY = /monthly\s*audience/i;
  /* entity first, then audience — the one comparison everything in this grid is ordered by */
  function gridRank(a, b){
    if(!!a.entity !== !!b.entity) return a.entity ? -1 : 1;
    return b.aud - a.aud;
  }
  function gridPicks(){
    var jobs = [];
    sel.langs.slice(0,2).forEach(function(L){ jobs.push({cap:L, qs:[L+' music', L+' singers', L+' artists']}) });
    sel.genres.slice(0,3).forEach(function(g){ jobs.push({cap:g, qs:[g+' music', g+' singers', g+' band']}) });
    /* A pick-free Continue lands here (step 1's Continue is never disabled). Three broad queries,
       because one can come back empty and this screen needs three picks to be finishable: measured
       Indian music 15 rows, English music 8, Hindi music 6. */
    if(!jobs.length) jobs.push({cap:'Popular', qs:['Indian music', 'English music', 'Hindi music']});
    return jobs;
  }
  async function gridList(cap, q){
    var url = '/api/search?q='+encodeURIComponent(q)+'&type=artist';
    try{
      /* the app's own session cache, so going Back and forward again costs no network */
      var j = (typeof feedJSON==='function') ? await feedJSON(url)
                                             : await fetch(url).then(function(r){ return r.json() });
      var rows = (j && j.items ? j.items : []).map(function(it){
        if(!it || !it.id || !/^UC/.test(it.id)) return null;              // real channels only
        var nm = it.title || it.artist || ''; if(!nm) return null;
        var aud = (typeof audOf==='function') ? audOf(it.sub) : 0;
        var entity = GRID_ENTITY.test(String(it.sub || ''));       // a real artist, not a channel
        if(!entity && aud < GRID_AUD_FLOOR) return null;
        return {id:it.id, name:nm, thumb:it.thumb||'', cap:cap, aud:aud, entity:entity};
      }).filter(Boolean);
      rows.sort(gridRank);
      return rows;
    }catch(e){ return [] }
  }
  async function seedGrid(){
    var mine = ++gridGen;
    var jobs = gridPicks(), lists = [];
    gridNote('Finding artists for your picks…');
    for(var i=0;i<jobs.length;i++){
      var cap = jobs[i].cap;
      /* A pick's own lookups are independent, so they go out TOGETHER and the pick costs one
         round-trip instead of three. Measured on the same five picks (15 requests): 10.3s one after
         another against 3.7s this way. The app's feedJSON collapses duplicate URLs and every URL
         here is distinct, so nothing is fetched twice. (The route itself is not deterministic from
         run to run — that is a property of the search, not of the parallelism.) */
      var got = await Promise.all(jobs[i].qs.map(function(q){ return gridList(cap, q) }));
      if(mine!==gridGen) return;                                       // a newer seed owns the grid
      var acc = [];
      got.forEach(function(rows){ acc = acc.concat(rows) });
      acc.sort(gridRank);                                          // this pick's own best first
      lists.push(acc);
    }
    if(mine!==gridGen) return;
    var out = (typeof interleave==='function') ? interleave(lists, 24) : lists[0].slice(0,24);
    paintGrid(out, out.length ? '' : 'No artists came back for those picks — search for one by name.');
  }
  function paintGrid(list, note){
    var grid=el('oncGrid'); if(!grid) return;
    var keep = [];
    sel.artists.forEach(function(a){ if(tilesById[a.id]) keep.push(tilesById[a.id]) });
    var merged = [], seenIds = {};
    list.forEach(function(t){ if(!seenIds[t.id]){ seenIds[t.id]=1; merged.push(t) } });
    keep.forEach(function(t){ if(!seenIds[t.id]){ seenIds[t.id]=1; merged.push(t) } });
    merged.forEach(function(t){ tilesById[t.id]=t });
    grid.innerHTML = merged.map(tileHTML).join('');
    if(note !== undefined) gridNote(note);
  }

  /* ---------- the seed ---------- */
  function clearSeeds(){
    var n=0;
    try{
      Object.keys(hist||{}).forEach(function(k){ if(hist[k] && hist[k].seed){ delete hist[k]; n++ } });
      if(n) LSset('ml_history',hist);
    }catch(e){}
    return n;
  }
  async function seed(p){
    clearSeeds();                                   // a re-run replaces the previous picks, never stacks
    var now=Date.now(), added=0, i=0;
    for(; i<(p.artists||[]).length && i<MAX_SEED_ARTISTS; i++){
      var a=p.artists[i];
      try{
        var r=await fetch('/api/artist/songs?id='+encodeURIComponent(a.id));
        var j=await r.json();
        var songs=(j.songs||[]).slice(0,SONGS_PER_ARTIST);
        songs.forEach(function(s,k){
          if(!s || !s.id) return;
          if(hist[s.id]) return;                    // a real play always outranks a seed — never touched
          hist[s.id] = {id:s.id, title:s.title||'', artist:s.artist||a.name, thumb:s.thumb||a.thumb||'',
                        count:Math.max(2, 7-i), last:now - (i*36e5) - (k*6e4), seed:1};
          added++;
        });
      }catch(e){}
    }
    if(added) try{ LSset('ml_history',hist) }catch(e){}
    return added;
  }

  /* ---------- close / open ---------- */
  function show(on){
    mount();
    open = !!on;
    root.classList.toggle('on', open);
    if(open) root.removeAttribute('aria-hidden'); else root.setAttribute('aria-hidden','true');
  }
  function openFlow(prefill){
    mount();
    sel = {langs:[], genres:[], artists:[]};
    tilesById = {};
    if(prefill && profile){
      sel.langs = (profile.langs||[]).slice();
      sel.genres = (profile.genres||[]).slice();
      sel.artists = (profile.artists||[]).slice();
    }
    busy=false; step=1; show(true); paint();
    try{ var f=root.querySelector('.oncCta'); if(f) f.focus() }catch(e){}
  }
  function closeFlow(){ busy=false; show(false) }

  function saveAndSeed(){
    if(busy) return;
    busy = true; step = 2; paint();
    profile = {v:1, langs:sel.langs.slice(), genres:sel.genres.slice(), artists:sel.artists.slice(), at:Date.now()};
    try{ LSset(KP, profile) }catch(e){}
    setSeen(1);
    /* wave 6b: NEW picks ⇒ a fresh picked block, for the full three stages. WAVE 12: the shelf clocks
       are restarted with it — every key this profile will produce is stamped at the moment the picks
       are made (which IS the install moment), and any stamp left by an older profile is dropped. */
    try{ LSset(KG,0); LSset(KR,null); LSset(KT,null) }catch(e){}
    shelfKeys(profile).forEach(function(k){ touch(k, profile.at) });
    rowsNow = [];
    var note=el('oncBuildNote');
    if(note && !sel.artists.length) note.textContent = 'Saving your languages and vibes…';
    var minShow = new Promise(function(res){ setTimeout(res, 1500) });   // the screen is the point; never flash past it
    Promise.all([seed(profile).catch(function(){ return 0 }), minShow]).then(function(res){
      var added = res[0]|0;
      closeFlow();
      if(typeof renderHome==='function' && typeof curPage!=='undefined' && curPage==='home'){ try{ renderHome() }catch(e){} }
      else if(typeof goHome==='function'){ try{ goHome() }catch(e){} }
      try{ toast(added ? 'Home is tuned to your picks' : 'Your picks are saved') }catch(e){}
    });
  }
  function skipFlow(){
    if(busy) return;
    setSeen(1);                                   // "skippable, once only" — it never returns on its own
    closeFlow();
    if(typeof renderHome==='function' && typeof curPage!=='undefined' && curPage==='home'){ try{ renderHome() }catch(e){} }
  }

  /* ---------- Home: the picked shelves ----------
     WAVE 8 REMOVED THE "PERSONALISE MY TASTE" REOPEN PATHS FROM HERE: the Home banner ("Want better
     picks?") and the Settings row both opened this flow again, and the user asked for it to be a
     FIRST-RUN ONLY screen. The flow itself, its steps and its own close/skip behaviour are untouched;
     what is gone is every way back into it, so the overlay can only ever be its first run. The console
     hook below (svaraPersonalise.open()) is deliberately kept — it is how this wave tested the flow
     without wiping a profile. */
  /* ===== WAVE 6b's HANDOVER, RE-CLOCKED IN WAVE 12 =====
     A picked shelf is a STARTING POINT: it exists to put something on Home before any listening has
     happened, so the thing that finally removes it is its OWN inactivity — not the app's activity.
     That is the whole change. The old clock was a running count of genuine plays (sincePlays(): 4 to
     start dimming, 18 to retire, plus 2 plays of a shelf's own tracks to retire it early), and plays
     are the wrong clock for this: a user who listened daily but never touched the shelf kept it alive
     forever, one busy evening killed every shelf at once, and the "2 of its own tracks" rule retired
     rows on search variance rather than on use (measured).
     THE CLOCK: every shelf carries a `last_interacted_timestamp` — sv_onboard_touch, keyed by the
     shelf title, the same stable key sv_onboard_retired uses. saveAndSeed stamps every key a new
     profile will produce at the moment the picks are made (the install moment), and fillShelves
     lazily stamps any shelf it paints that has no stamp yet, with NOW.
     THREE STAGES, derived from that stamp and nothing else — nothing anywhere stores a stage:
       < 14 days (DIM_DAYS)    full opacity;
       >= 14 days              dimmed: 0.72 on the day, ramping to DIM_FLOOR (0.45) by the removal age;
       >= 21 days (GONE_DAYS)  retires: fade, collapse, unmounted, and filtered for good.
     RESET ON USE: playing a track that lives in a shelf's own list — from anywhere: the shelf's card,
     search, a playlist, the queue — re-stamps that shelf and re-blends it in place, so a dimmed row
     is back to 100% opacity the moment it is used. A retired shelf is NOT revived: retired is
     permanent, and such a shelf is dropped before any verdict is even computed for it.
     WHAT REMEMBERS WHAT: `sv_onboard_touch` (key→ms) is the clock; `sv_onboard_retired` (key→1) keeps
     a retired shelf out of every later session; `sv_onboard_graduated` stops the block being fetched
     at all once every shelf has gone. All three are cleared when the picks are made again
     (saveAndSeed) or reset (clear()).
     WHAT CAN NEVER AGE: the app's own rows. Listen again, Quick picks, Trending songs, Popular right
     now, Albums for you and Surprise me are never dimmed, collapsed or unmounted — blendFeed() builds
     no entry for them at all, and applyBlend() refuses any node that is not `.oncSec[data-onckey]`
     even if a plan named it (see the notes on both).
     THE SEEDS IN ml_history ARE DELIBERATELY KEPT: they are the taste evidence Quick picks and the
     radio score from, and they age out of Listen again on their own. The handover removes the
     duplicate SURFACE, not the signal behind it. */

  /* The app's OWN Home rows, in the order the app rendered them (read-only). */
  function dynRows(){
    var sec=document.getElementById('homeSec'); if(!sec) return [];
    return Array.prototype.filter.call(sec.children, function(n){
      return n && n.classList && n.classList.contains('sec') && !n.classList.contains('oncSec');
    });
  }
  /* WAVE 9, RE-ANCHORED IN WAVE 11 — WHERE A PICKED SHELF GOES. The picked shelves used to be ONE
     block that sat above every app row or below all of them, and in wave 9 each shelf sat at its own
     anchor. Home now reads the way the user asked for it:
       Trending songs → Quick picks → Listen again → Popular right now → Albums for you →
       <vibes> → <language> → <artist> → Surprise me
     so every picked shelf shares ONE anchor — the "Albums for you" row — and the picked shelves
     therefore sit together AFTER the app's own rows, in the order they were picked (a vibe, the
     other vibe, the language, the artist). Sharing the anchor KEY is what makes that order hold:
     `parked` chains shelves that name the same anchor one after another, so two shelves pointing at
     one row keep their pick order instead of stacking up in reverse. The anchor is found by the
     row's own <h2> text: the section carries no id of its own — the ids (#albRail, #popRail) live on
     the rail INSIDE it — and that text is exactly what renderHome writes. */
  function rowByTitle(title){
    var sec=document.getElementById('homeSec'); if(!sec) return null;
    var kids=sec.children;
    for(var i=0;i<kids.length;i++){
      var n=kids[i];
      if(!n || !n.classList || !n.classList.contains('sec') || n.classList.contains('oncSec')) continue;
      var h=n.querySelector('h2'); if(!h) continue;
      if(h.textContent.replace(/Play all|Show more/g,'').trim().indexOf(title)===0) return n;
    }
    return null;
  }
  async function fillShelves(sec, p){
    var mine = ++homeGen6;
    var qs = [];
    var parked = {};      // anchor key -> the LAST shelf parked there, so two vibe shelves keep the
                          // order they were picked in instead of stacking up in reverse
    (p.genres||[]).slice(0,2).forEach(function(g){ qs.push({t:g, cat:g, a:'alb'}) });   /* wave 11: every shelf lands after Albums for you */
    (p.langs||[]).slice(0,1).forEach(function(L){ qs.push({t:L+' music', cat:L, a:'alb'}) });
    if((p.artists||[]).length){ var A=p.artists[0]; qs.push({t:'More like '+A.name, cat:A.name, aid:A.id, a:'alb'}) }
    for(var i=0;i<qs.length;i++){
      if(graduated()) return;                                     // the picked feed is over: stop asking
      /* WAVE 12: a RETIRED shelf is not even fetched now. It used to be fetched, painted and then
         removed by the plan — a search spent on a row that could never be shown again. */
      if(retiredMap()[qs[i].t]) continue;
      if(rowsNow.some(function(r){ return r.key===qs[i].t })) continue;
      try{
        /* WAVE 7: a picked category is its MOST POPULAR songs, never the head of a bare
           "<category> songs" query (which is what served covers, bhajans and two-subscriber
           channels). An artist pick asks that channel's own catalogue in YouTube Music's popularity
           order; a language or vibe asks wave 7's category route, which ranks the category's biggest
           artists by monthly audience and falls back to a junk-filtered song search when a vibe has
           no artist query at all. Both are cached, so this costs nothing on a later render. */
        var items = (qs[i].aid && /^UC/.test(qs[i].aid))
          ? await artistTopSongs(qs[i].aid, 12)
          : await categorySongs(qs[i].cat, 12);
        if(mine!==homeGen6) return;
        items = (items||[]).filter(function(x){ return x && x.id }).slice(0,12);
        if(!items.length) continue;
        var key = 'r'+(++railSeq);
        rails[key] = items;
        var node = document.createElement('div');
        node.className = 'sec oncSec';
        /* data-onckey is the STABLE identity (the shelf's own title), which is what lets a shelf be
           retired for good; data-oncq stays the per-render playback key (see the header note on the
           app's rail handler). */
        node.setAttribute('data-onckey', qs[i].t);
        node.innerHTML = '<h2>'+esc(qs[i].t)+'</h2>'+
          '<div class="railwrap" data-oncq="'+key+'">'+items.map(function(it){
            /* THE APP'S OWN CARD, NOT A COPY OF IT. `railCard` is reassigned in the v3 layer to the
               version whose artist line is artistLinksHTML() — clickable <span class="alink"> spans
               carrying data-artist-id / data-artist-name. Hand-rolling that markup (as this block first
               did, copying the BASE layer's card) shipped the base layer's PLAIN-TEXT artist line, so
               these were the only rows on Home whose artist names could not be clicked — every other
               rail picked up the v3 card for free by going through railHTML().
               The ctx is 'onc': no branch of the app's rail handler answers to it, so that handler
               returns without playing and the [data-oncq] handler below plays this shelf's own list.
               A click on an artist NAME never reaches either — the artist layer takes .alink in the
               CAPTURE phase and calls preventDefault + stopPropagation (measured: a synthetic click on
               an .alink never arrives at a document bubble listener), so a name click opens the artist
               page and can never start the shelf. */
            return railCard(it, 'onc');
          }).join('')+'</div>';
        /* the ANCHOR, or the end of the feed when Home has no such row (a variant without Quick
           picks, or a future reorder) — a shelf is never dropped for want of an anchor */
        var anchor = parked[qs[i].a] || rowByTitle('Albums for you') ||
                     rowByTitle('Popular right now') || rowByTitle('Trending songs');
        if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(node, anchor.nextSibling);
        else sec.appendChild(node);
        parked[qs[i].a] = node;
        /* WAVE 12: THE SHELF'S CLOCK STARTS HERE. saveAndSeed already stamped every key a fresh
           profile produces; this line covers an install that predates the stamps (and any key it did
           not predict), and it stamps with NOW — never with profile.at — so updating can never make
           an existing shelf look weeks old and vanish on its first paint. */
        if(!touchedAt(qs[i].t)) touch(qs[i].t, Date.now());
        rowsNow.push({key:qs[i].t, items:items, node:node});
        applyBlend();                                              // keep / dim / retire on THIS age
        if(typeof skReveal==='function'){ try{ skReveal(node) }catch(e){} }
      }catch(e){}
    }
  }
  /* One retirement, all of it: the row fades and collapses, then is unmounted and remembered. When
     the LAST picked shelf leaves, the block itself goes and `sv_onboard_graduated` is written, so a
     later Home render does not even fetch it. */
  function retireRow(node, key){
    if(!node || node.getAttribute('data-oncretiring')) return;
    node.setAttribute('data-oncretiring','1');
    node.style.removeProperty('opacity');            // the keyframes own the fade, from --oncOp on
    node.classList.add('oncRetiring');
    var done=false;
    function fin(ev){
      if(ev && ev.target!==node) return;             // the row's own animation only, never a child's
      if(done) return; done=true;
      node.removeEventListener('animationend', fin);
      setRetired(key);                               // never painted again, in any later session
      if(node.parentNode) node.parentNode.removeChild(node);
      var sec=document.getElementById('homeSec');
      if(sec && !sec.querySelector('.oncSec')){      // the last one just left
        try{ LSset(KG,1) }catch(e){}
        rowsNow = [];                                // nothing is painted, so nothing is tracked
      }
    }
    node.addEventListener('animationend', fin);
    setTimeout(fin, 900);                            // a throttled/background window may never fire it
  }
  /* Apply the plan: each kept shelf gets its dim level, retiring ones are told to go, and shelves that
     retired on an earlier pass are simply not in the DOM. Placement is NOT part of this (wave 11): a
     shelf is placed once, at its anchor, and never moves again.
     THE PERMISSION CHECK IS THE POINT. Every node this writes to must match .oncSec[data-onckey] AND
     be a shelf THIS render actually painted (rowsNow) — the class and attribute only fillShelves()
     ever writes, and the only markup the wave-6b CSS names. Anything else is REFUSED, counted, and
     left exactly as it was, so even a corrupted plan cannot dim, collapse or unmount a fixed row:
     the app's own rows are not merely missing from the verdicts, they are un-writable from here. */
  function applyBlend(){
    var sec=document.getElementById('homeSec'); if(!sec) return {fixed:0, judged:0, refused:0};
    var mine = rowsNow.filter(function(r){ return r && r.node });
    var plan = blendFeed(dynRows(), rowsNow, {now:Date.now(), retired:retiredMap()});
    var judged=0, refused=0;
    function own(nd){                                  // may this node be touched at all?
      judged++;
      var ok = !!(nd && nd.classList && nd.classList.contains('oncSec') && nd.getAttribute('data-onckey')
                  && mine.some(function(r){ return r.node===nd }));
      if(!ok) refused++;
      return ok;
    }
    plan.keep.forEach(function(v){
      var nd=v.row.node; if(!own(nd)) return;
      nd.style.setProperty('--oncOp', String(v.opacity));
      nd.style.opacity = String(v.opacity);        // 1 until it is 14 days old, then dimmed
    });
    plan.retire.forEach(function(v){ var nd=v.row.node; if(own(nd)) retireRow(nd, v.row.key) });
    plan.dropped.forEach(function(r){ var nd=r.row.node; if(own(nd) && nd.parentNode) nd.parentNode.removeChild(nd) });
    if(rowsNow.length && !plan.pickedCount){                           // everything has already gone
      try{ LSset(KG,1) }catch(e){}
      rowsNow = [];
    }
    return {fixed:plan.fixedCount, judged:judged, refused:refused, plan:plan};
  }
  function decorateHome(){
    if(typeof curPage==='undefined' || curPage!=='home') return;
    var sec = document.getElementById('homeSec'); if(!sec) return;
    if(!profile) return;                             // no profile, no picked shelves
    if(graduated()) return;                          // wave 6b: the picked feed has served its purpose
    if(sec.querySelector('.oncSec')) return;         // one set of shelves per Home render, never two
    rowsNow = [];
    fillShelves(sec, profile);                       // every shelf lands at its own anchor
  }
  /* ---------- RESET ON INTERACTION: a genuine play re-stamps every shelf that serves that track ---------- */
  /* Called from the wrapped notePlay, i.e. from a REAL play and nothing else. A track that lives in a
     picked shelf's own list is the clearest possible "this shelf is still useful" signal, and it
     counts wherever the play came FROM — the shelf's own card, search results, a playlist, the queue
     — which is why the test is the track's id against each shelf's items rather than "was this click
     on the row". The shelf is re-stamped and the block re-blended IN PLACE (style writes only: no
     innerHTML is rebuilt, so scroll position, the open player and the shelf list itself all stay put).
     A play that belongs to no shelf does nothing at all. */
  function afterPlay(it){
    if(!it || !it.id || !rowsNow.length) return 0;
    var hit=0;
    rowsNow.forEach(function(r){
      if((r.items||[]).some(function(x){ return x && x.id===it.id })){ touch(r.key, Date.now()); hit++ }
    });
    if(hit) applyBlend();
    return hit;
  }
  /* A CLICK STRAIGHT ON A SHELF'S CARD is an interaction even if the stream never starts, so the reset
     never depends on notePlay having fired. The node carries the stable shelf title. */
  function touchShelf(nd){
    var key = (nd && nd.getAttribute) ? nd.getAttribute('data-onckey') : '';
    if(!key) return 0;
    var ts = touch(key, Date.now());
    try{ applyBlend() }catch(e){}        // a dimmed shelf is back at 100% opacity right away
    return ts;
  }

  /* ---------- the four wrappers ---------- */
  var _renderHome = renderHome;
  renderHome = function(){
    var r = _renderHome.apply(this, arguments);
    try{ decorateHome() }catch(e){}
    return r;
  };
  var _notePlay = notePlay;
  notePlay = function(it){
    var r = _notePlay.apply(this, arguments);
    try{ if(it && it.id && hist[it.id] && hist[it.id].seed){ delete hist[it.id].seed; LSset('ml_history', hist) } }catch(e){}
    /* wave 12: the play has been recorded, so reset the clock of any shelf that serves this track */
    try{ afterPlay(it) }catch(e){}
    return r;
  };
  var _histItems = _4asHistItems;
  _4asHistItems = function(){
    try{ return _histItems.apply(this, arguments).filter(function(e){ return !(e && e.seed) }) }
    catch(e){ return _histItems.apply(this, arguments) }
  };
  /* THE SETTINGS ROW IS GONE (wave 8) — "Personalise my taste / Redo" was the second way back into
     the flow. It was never a row this block could render from its own scope: setRender()/setRow() live
     inside another block's closure, so the row had to be injected into #setBody by a body observer and
     its markup copied by hand. Removing it therefore removes four things that existed only for it —
     the row builder, the injector, the coalescing scheduler and the observer that watched for Settings
     repaints — which also means Settings no longer runs any mutation callback from this block at all. */

  /* ---------- wiring ---------- */
  document.addEventListener('click', function(e){
    var t=e.target; if(!t||!t.closest) return;
    var pillEl=t.closest('[data-oncpill]');
    if(pillEl){
      var kind=pillEl.getAttribute('data-oncpill'), v=pillEl.getAttribute('data-v');
      var arr = kind==='lang' ? sel.langs : sel.genres;
      var i = arr.indexOf(v);
      if(i>=0) arr.splice(i,1); else arr.push(v);
      pillEl.setAttribute('aria-pressed', i>=0 ? 'false' : 'true');
      syncCounts();
      return;
    }
    var tile=t.closest('[data-oncart]');
    if(tile){
      var id=tile.getAttribute('data-v');
      var k = sel.artists.map(function(a){ return a.id }).indexOf(id);
      if(k>=0) sel.artists.splice(k,1);
      else{
        var t2=tilesById[id]||{id:id,name:tile.getAttribute('data-name')||'',thumb:''};
        sel.artists.push({id:t2.id, name:t2.name, thumb:t2.thumb||''});
      }
      tile.setAttribute('aria-pressed', k>=0 ? 'false' : 'true');
      syncCounts();
      return;
    }
    if(t.closest('[data-oncnext]')){ step=2; paint(); return }
    if(t.closest('[data-oncback]')){ step=1; paint(); return }
    if(t.closest('[data-oncfinish]')){ saveAndSeed(); return }
    if(t.closest('[data-oncskip]')){ skipFlow(); return }
    var wrap=t.closest('[data-oncq]');
    if(wrap){
      var arr2=rails[wrap.getAttribute('data-oncq')]; if(!arr2||!arr2.length) return;
      var card=t.closest('.rail'); var cid=card?card.getAttribute('data-id'):'';
      var idx=arr2.map(function(x){ return x.id }).indexOf(cid);
      try{ playList(arr2, idx>=0?idx:0, true) }catch(e){}
      /* WAVE 12: PLAYING OUT OF THIS SHELF IS USING IT — the row's own stamp is reset here as well as
         through notePlay, so a card whose stream fails to start still counts as an interaction. */
      touchShelf(wrap.closest(ONC_SEL) || wrap);
      return;
    }
  });
  document.addEventListener('input', function(e){
    if(!e.target || e.target.id!=='oncQ') return;
    var q=e.target.value;
    clearTimeout(searchTimer);
    searchTimer=setTimeout(function(){
      var mine=++gridGen, v=q.trim();
      if(v.length<2){ seedGrid(); return }
      gridNote('Searching…');
      searchArtists(v, 'Search').then(function(list){
        if(mine!==gridGen) return;
        paintGrid(list, list.length ? list.length+' artists' : 'Nothing found for "'+v+'"');
      }).catch(function(){ if(mine===gridGen) gridNote('Search failed — try again') });
    }, 320);
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && open && !busy){ e.preventDefault(); skipFlow() }
  });

  /* ---------- boot: the one and only door into this flow ----------
     WAVE 8: the flow is a FRESH-INSTALL GATE, so it opens during parsing — mount() appends the opaque
     overlay to <body> from the last script in the document, i.e. BEFORE the first paint. The old
     setTimeout(900) let a first-run Home build behind it, so the very first thing a new user saw was
     the wrong screen, briefly. Nothing else in this file opens the flow, and `seen()` is written by
     both exits (Finish Setup in saveAndSeed, Skip in skipFlow), so this runs exactly once per install:
     the two ways out are the two buttons, and until one is pressed the app is behind an overlay that
     covers the window at z-index 100. */
  function boot(){
    /* WAVE 19 — the veil v19gatejs put on <html> at the top of <body> comes off HERE, in the same
       synchronous tick that mounts + shows the overlay (mount() → .on → paint()), so the browser is
       handed both changes inside one frame: it can never composite the Home page (which used to be
       up for the rest of the parse) and it can never composite a blank window either. A returning
       user takes it off on the first line, where there is nothing to hide. */
    var gate = window.__svOncGate;
    var release = function(){ if(gate) try{ gate.release() }catch(e){} };
    if(!histEmpty() || profile || seen()){ release(); return }   // a fresh install only
    openFlow(false);
    release();
  }
  boot();

  /* exposed for the console (and for this block's own checks) */
  window.svaraPersonalise = {
    open: openFlow,
    seed: function(){ return seed(profile || {artists:[]}) },
    profile: function(){ return profile },
    clear: function(){
      clearSeeds(); LSset(KP,null); setSeen(0);
      /* wave 6b: a reset revives the picked feed too — no retirement and no graduation left behind */
      try{ LSset(KG,0); LSset(KR,null); LSset(KT,null) }catch(e){}
      rowsNow = [];
    },
    /* ---------- wave 12 hooks: the shelf clock ---------- */
    state: feedState,          // every shelf's age in days + verdict, and the protected rows by title
    blend: blendFeed,          // pure: (dynamicRows, pickedRows, {now, retired}) -> layout plan
    days: daysIdle,            // (shelfTitle[, now]) -> days since its last interaction
    touch: touch,              // (shelfTitle[, at]) -> stamp it; `at` back-dates, which is how the
                               //   14/21-day thresholds are testable without waiting three weeks
    verdict: verdictOf,        // (shelfTitle[, now]) -> {verdict, days, dim, opacity}
    shelfKeys: shelfKeys,      // the titles a profile produces — the keys the clock is kept under
    fixed: fixedTitles,        // the app's own rows, by title: the ones that can never decay
    apply: applyBlend          // re-apply the plan now; returns {fixed, judged, refused}
  };
})();
</script>
<style id="v8homecss">
/* ================= Wave 8 — Home's rhythm: six covers a carousel, four rows of picks =================
   Every number below was measured on the user's own window — 1784x950, which is a 1548px content
   box, the same box their screenshots were taken in — before and after the change.

   1) A CAROUSEL IS SIX COVERS WIDE, NOT NINE. A .rail was a flat 150px, so 1548px of content showed
      9.56 covers at once and read as one contact sheet. The width is now a SHARE of its own
      carousel, so the count holds at any window width, and the .4 is a real card edge peeking in
      from the right — the only scroll cue this app can give, because ::-webkit-scrollbar{width:0}
      hides every scrollbar in it. clamp() keeps the old 150px card on a narrow window and refuses a
      300px one on an ultrawide. Measured: 228x269 per card instead of 150x198, with exactly 6
      covers fully in view.
      The two grid views stay out of it: .railwrap.algrid and .libgrid both set .rail{width:auto}
      with TWO classes, so a single-class .rail rule can never reach them.

   2) QUICK PICKS IS A FOUR-ROW CAROUSEL, NOT A THIRTY-ROW LADDER. grid-auto-flow:column with four
      fixed rows fills COLUMN-major — ranks 1-4 down the first column, 5-8 in the next — so a column
      is the reading unit and scrolling right walks DOWN the ranking. The cards keep their present
      dimensions exactly: grid-auto-columns is the same one-third share the 3-column grid used (3.1
      of them, for the same right-edge peek), so nothing about a card changes — the grid is simply
      cut at four rows and unrolled sideways, and 1500x903 of ladder becomes 1500x360.
      `grid-template-columns:none` is not decoration: without it the base layer's
      @media(max-width:1000px) rule would still create two EXPLICIT half-width columns, which
      column-flow fills FIRST, leaving the rest of the first row on an auto-sized track.
      `overflow-x:auto` is the same declaration .railwrap carries, and it is load-bearing twice over:
      with the box left visible (this rule's first version had no overflow at all) the nine columns
      simply PAINT past the section — past the window edge, with 1500px of content unreachable — and,
      measured, #scroll (whose other axis is auto) becomes horizontally scrollable itself, so the
      whole page can be dragged sideways. Only the x axis is declared, exactly like .railwrap, so this
      grid never becomes a vertical scroll container and the wheel chains on to #scroll as it always
      has.

   3) BREATHING ROOM. Section gap 24 → 40px, title gap 12 → 16px, card gap 12 → 16px, cover-to-title
      8 → 10px. Every row is now separated from its neighbours by more than it is separated from its
      own contents, which is what makes the eye read "rows" instead of one long sheet. */
.railwrap{--railgap:16px;--railcols:6.4;gap:var(--railgap)}
.rail{width:clamp(150px,calc((100% - (var(--railcols) - 1) * var(--railgap)) / var(--railcols)),300px)}
.rail .rname{margin-top:10px}
.list.qpGrid{--qpgap:12px;--qpcols:3.1;
  display:grid;grid-auto-flow:column;grid-template-columns:none;grid-template-rows:repeat(4,auto);
  grid-auto-columns:calc((100% - (var(--qpcols) - 1) * var(--qpgap)) / var(--qpcols));
  gap:var(--qpgap);overflow-x:auto;padding-bottom:6px}
@media(max-width:1000px){.list.qpGrid{--qpcols:2.2}}
@media(max-width:660px){.list.qpGrid{--qpcols:1.2}}
.sec{margin-top:40px}
.sec h2{margin-bottom:16px}
/* 4) THE SKELETON MUST MEASURE LIKE THE ROW IT STANDS IN. skRail() wraps its placeholders in a
      second .railwrap (the skeleton region needs a block context for its shimmer band) and that
      nested wrapper is a FLEX ITEM of the row's own .railwrap. A skeleton card has no intrinsic
      width — its .art is empty and its bars are percentage widths — so the nested wrapper's
      max-content is just the five 16px gaps, and being `overflow-x:auto` its automatic minimum is
      0 as well: the whole region collapsed to 80px and every placeholder fell back to the clamp's
      150px floor, clipped to that 80px sliver by the region's own overflow:hidden. Measured on the
      same Home: skeleton cards 150x194 in an 80px region, real cards 221x260. One 80px placeholder
      is all a user saw of "Albums for you" for the entire album fetch — exactly the single dark
      box in the report. The region now takes the row's full width and the nested wrapper is 100%
      of it, so a placeholder is born at the width the real card will land on (221px, not 150).
      The two grid views are untouched: no skeleton is ever built inside .railwrap.algrid/.libgrid. */
.railwrap>.sk-region{flex:1 1 auto;min-width:0}
.railwrap>.sk-region>.railwrap{width:100%}
</style>
<style id="v11trendcss">
/* ================= Wave 11 — Trending songs as wide feature cards =================
   THE ROW CHANGED SHAPE, NOT ITS MARKUP. A Trending card is the SAME .rail card every other row
   renders — same .art / .rname / .rsub2 children, same data-rail/data-id hooks, same railCard() —
   because everything below is scoped to the SECTION class renderHome now puts on that row
