<script id="v13artjs">
/* ================= WAVE 13 — remember which artwork must go through the proxy =================
   THE PROBLEM, MEASURED. The Liked albums covers painted in ~0.55-0.9s on EVERY visit — the same
   four URLs, re-measured three visits in a row (556ms / 887ms / 907ms for one of them), while
   Home's covers painted in 0ms from the browser's own cache. The pre-existing 4J finding explains
   it: the artwork host answers the renderer's DIRECT request (one that carries a Referer) with
   429 + text/html, which surfaces as net::ERR_BLOCKED_BY_ORB. Chromium keeps that failure in its
   memory cache, so the direct attempt fails again on the next render, and the failure ladder then
   waits its full 900ms RETRY_MS before asking /api/thumb — the request that actually returns
   artwork, and one that IS cacheable (the route sends Cache-Control: public, max-age=86400).
   Neither the network nor the browser cache was the problem: the doomed direct attempt and the
   900ms that waited on it were.
   WHAT THIS LAYER DOES. It records artwork URLs that failed DIRECT, keyed WITHOUT the size token
   (so one artwork is one entry whatever size each row asks for) and without the still's resolution,
   in localStorage 'sv_artbad'. From then on thumb() hands out the proxy form at RENDER time for
   that artwork: the doomed direct attempt is never made again, and the first paint of every later
   view is served from the browser's cache of the proxy response — no error, no 900ms, no blank box.
   MEASURED AFTER: Liked albums 907ms -> 3ms across three visits, with no new image request at all.
   THE LADDER IS NOT REPLACED, only told what is already known: this listener is on WINDOW in the
   CAPTURE phase, so it runs before the ladder's own document-level listener and the ladder can take
   its proxy step immediately instead of 900ms later (see the stage-0 branch in #v3artjs).
   The store is bounded (400 keys, oldest dropped) and only ever grows on a REAL failure, so a URL
   that loads directly is never recorded. */
(function(){
'use strict';
var KEY='sv_artbad', MAX=400, P='/api/thumb?url=';
var bad={}, order=[];
try{ var raw=JSON.parse(localStorage.getItem(KEY)||'{}');
  if(raw&&typeof raw==='object') Object.keys(raw).forEach(function(k){ bad[k]=1; order.push(k) });
}catch(e){}
function keyOf(u){
  u=String(u==null?'':u);
  if(u.indexOf(P)===0){ try{ u=decodeURIComponent(u.slice(P.length)) }catch(e){} }
  if(!/^https?:\/\//i.test(u)) return '';              // data:, blob:, an empty src: never proxied
  var w=u.indexOf('=w'); if(w>0) u=u.slice(0,w);       // the size token is not part of the artwork
  var m=u.match(/^(https?:\/\/i\.ytimg\.com\/vi\/[A-Za-z0-9_-]{11})\//);
  if(m) return m[1];                                   // a still is one artwork at any resolution
  return u;
}
function isBad(u){
  if(!u||String(u).indexOf(P)===0) return false;
  var k=keyOf(u); return !!(k&&bad[k]);
}
function markBad(u){
  var k=keyOf(u); if(!k||bad[k]) return;
  bad[k]=1; order.push(k);
  while(order.length>MAX) delete bad[order.shift()];
  try{ localStorage.setItem(KEY, JSON.stringify(bad)) }catch(e){}
}
window.svArtIsBad=isBad;
window.svArtMarkBad=markBad;
window.svArtBad=function(){ return { keys:Object.keys(bad), proxied:order.length } };
/* ---- WAVE 14: artwork that has ALREADY painted -----------------------------------------------
   The other half of the same idea. `sv_artbad` decides HOW an artwork is asked for; `sv_artseen`
   records that it HAS been painted, which is what lets the lazy layer (#v3artjs) skip its 80ms
   per-image queue on every later view. Keys are the same size-token-free form as above, so one
   artwork is one entry whatever size a row asks for. A paint is the only proof: the load listener
   below fires for the URL that finally WORKED, whatever step of the ladder it was. The write is
   debounced (a grid paints ~24 covers at once) and the store is bounded to 500 artworks. */
var SKEY='sv_artseen', SMAX=500;
var seen={}, sorder=[];
try{ var rawS=JSON.parse(localStorage.getItem(SKEY)||'{}');
  if(rawS&&typeof rawS==='object') Object.keys(rawS).forEach(function(k){ seen[k]=1; sorder.push(k) });
}catch(e){}
var sSaveT=null;
function saveSeen(){
  if(sSaveT) return;
  sSaveT=setTimeout(function(){ sSaveT=null; try{ localStorage.setItem(SKEY, JSON.stringify(seen)) }catch(e){} }, 400);
}
function markSeen(u){
  var k=keyOf(u); if(!k||seen[k]) return;
  seen[k]=1; sorder.push(k);
  while(sorder.length>SMAX) delete seen[sorder.shift()];
  saveSeen();
}
window.svArtSeen=function(u){ if(!u) return false; var k=keyOf(u); return !!(k&&seen[k]) };
window.svArtMarkSeen=markSeen;
window.svArtSeenDB=function(){ return { keys:Object.keys(seen).length } };
/* On DOCUMENT, not window — MEASURED: an image's own load event is capture-delivered to document
   listeners (46 events in one render) and to NO window listener at all, so the same listener on
   window silently recorded nothing. (The failure ladder's `error` listener sits on document too.) */
document.addEventListener('load', function(e){
  var im=e.target;
  if(!im||im.tagName!=='IMG'||!im.naturalWidth) return;
  markSeen(im.getAttribute('data-fb0')||im.getAttribute('src')||im.currentSrc);
}, true);
/* 1) A DIRECT FAILURE IS REMEMBERED FIRST. data-fb0 is the ORIGINAL url once the ladder is in
      motion, so a failure that arrives for a proxy src still names the artwork, not the proxy. */
window.addEventListener('error', function(e){
  var im=e.target;
  if(!im||im.tagName!=='IMG') return;
  markBad(im.getAttribute('data-fb0')||im.getAttribute('src'));
}, true);
/* 2) EVERY RENDERED ARTWORK URL passes through here (all the app's renderers call thumb()), so
      artwork already known to need the proxy is asked for in its proxy form from the first paint. */
var _thumb=thumb;
thumb=function(it,size){
  var u=_thumb(it,size);
  return (u&&isBad(u)) ? P+encodeURIComponent(u) : u;
};
/* 3) setTheme() (the album-colour wash) builds its OWN proxy URL from the artwork URL it is handed —
      which is now sometimes already the proxy form, and /api/thumb refuses a localhost url (400
      'blocked host'), so the wash would silently stop updating for exactly the covers that needed
      the proxy. Unwrap it back to the direct URL: the function then re-wraps it itself, exactly as
      it always did. */
var _setTheme=window.setTheme;
window.setTheme=function(u){
  if(typeof u==='string'&&u.indexOf(P)===0){ try{ u=decodeURIComponent(u.slice(P.length)) }catch(e){} }
  return _setTheme(u);
};
})();
</script>
<style id="v15slidecss">
/* ===== WAVE 15 + 16 — horizontal page slide (EVERY page change, not just Home ⇄ page) ========
   FORWARD (Home → Liked music / Liked albums / a playlist / Library / search results / an artist
   page / an album page): the incoming page ARRIVES FROM THE LEFT. So does EVERY LATERAL MOVE —
   Liked music ⇄ Liked albums ⇄ a playlist ⇄ Library, artist → artist, album → album (Wave 16).
   BACK — anything one level OUT of the current page, which in this app is always Home (and an
   artist/album page's own Back, which reads as the same move): Home ARRIVES FROM THE RIGHT.
   The pair is mirrored on purpose — the two signs live in ONE place (NAV in #v15slidejs), so
   flipping to the iOS convention (forward from the right, back from the left) is a two-character
   edit there and nothing else changes.

   WHY EXACTLY THESE FOUR CONTAINERS: #scroll only ever toggles #homeSec, #dynSec, #artSec and
   #albSec — Liked music, Liked albums, playlists, Library, search results and the Quick picks page
   are ALL #dynSec (they go through showDyn), the artist page is #artSec, the album page #albSec.
   Everything that must not move — #waveCv, #theme, #menu, #toast, #pvFab, #shist, #setPanel,
   #aboutCard and the onboarding gate — is a DIRECT CHILD OF BODY, never inside a page container,
   so a transform here can never become the containing block for a fixed overlay. That is the one
   real hazard of animating a page container; this layer is built to avoid it.

   ONE-SHOT: #v15slidejs removes the class on animationend (with a fallback timer), so no transform
   and no stacking context outlives the 260ms. Opacity rides along so the slide reads as motion of
   the page rather than of the layout; nothing here touches position, size or scroll. */
@keyframes svSlideInL{from{transform:translateX(calc(-1 * var(--sv-nav-dx,46px)));opacity:.001}to{transform:none;opacity:1}}
@keyframes svSlideInR{from{transform:translateX(var(--sv-nav-dx,46px));opacity:.001}to{transform:none;opacity:1}}
#homeSec.svSlideL,#dynSec.svSlideL,#artSec.svSlideL,#albSec.svSlideL{animation:svSlideInL var(--sv-nav-ms,260ms) cubic-bezier(.22,.61,.36,1) both}
#homeSec.svSlideR,#dynSec.svSlideR,#artSec.svSlideR,#albSec.svSlideR{animation:svSlideInR var(--sv-nav-ms,260ms) cubic-bezier(.22,.61,.36,1) both}
/* REST (the OS reduced-motion switch or the saved sv_set_reduceMotion) takes the whole effect away.
   html[data-gfx="reduced"] is written by the app's own gfxReduced(), which is EXACTLY those two
   tests, and #v15slidejs skips adding the class in the same case — belt and braces, since the
   attribute is refreshed by the Settings panel but the JS check happens per navigation. */
html[data-gfx="reduced"] #homeSec.svSlideL,html[data-gfx="reduced"] #dynSec.svSlideL,html[data-gfx="reduced"] #artSec.svSlideL,html[data-gfx="reduced"] #albSec.svSlideL,
html[data-gfx="reduced"] #homeSec.svSlideR,html[data-gfx="reduced"] #dynSec.svSlideR,html[data-gfx="reduced"] #artSec.svSlideR,html[data-gfx="reduced"] #albSec.svSlideR{animation:none}
</style>
<script id="v15slidejs">
/* ===== WAVE 15 + 16 — horizontal page slide, the JS half ======================================
   ADDITIVE: it observes the DOM the app ALREADY writes on its page containers (the `hidden` flip,
   and the in-place rebuild) and plays a class. No renderer, no navigate function and no CSS above
   is modified — goHome(), showDyn(), openArtist(), openAlbumPage(), restoreView() and
   albRestoreView() all keep working exactly as they did.

   WHY AN OBSERVER AND NOT A WRAPPED FUNCTION: the app's page switch is a single `hidden` flip that
   several layers already rely on (Wave 4BC's ambient wash and the wave's own syncView both observe
   #homeSec for the same reason). A wrapper would miss restoreView() / albRestoreView() and the
   artist/album paths, which write their containers directly inside the v3js scope.

   THE TRIGGER IS THE PAGE'S IDENTITY, NOT THE `hidden` ATTRIBUTE (Wave 16). The first version
   listened for the attribute flip alone, so only Home ⇄ page ever moved: every lateral move —
   Liked music → Liked albums → a playlist → Library — rebuilds the SAME container (#dynSec) in
   place, and artist → artist rebuilds #artSec in place, so the attribute never changes and
   nothing played (reported). The trigger is now a KEY read from what is actually rendered:
   'home' for #homeSec, 'dyn:<#pgTitle>|<active Library chip>' for #dynSec, and '<sec>:<hero
   .art-name>' for #artSec / #albSec. A real page change always moves it, in whichever container
   it happens; a REPAINT always keeps it — a Like rebuilds Liked music under the same title and
   the same chip, so the slide stays silent on a heart click.

   DIRECTION IS LEVEL BASED. Home is the floor (0), the Library-style lists are one step in (1),
   artist and album pages are the deepest (2). A move to a SHALLOWER page is a Back and enters
   from the RIGHT; forward moves and lateral moves inside one level enter from the LEFT. That is
   the reported shape: Home → anything from the left, anything → Home from the right, and
   Liked music ⇄ Liked albums ⇄ a playlist all from the left, both ways.

   AN EMPTY KEY MEANS "THIS CONTAINER HAS NO PAGE YET" and is never adopted: the artist and album
   pages paint a skeleton first (no .art-name) and the real page when the fetch lands, so
   artist → artist resolves ONCE, on the real render, instead of sliding for the skeleton and
   again for the page. */
(function(){
'use strict';
/* ONE config object — every knob is a single edit right here. */
var NAV = { ms:260, dx:46, back:1, fwd:-1 };
/* back:+1 => a page one level OUT of the current one — always Home, or an artist/album page's own
              Back — enters from the RIGHT
   fwd:-1  => every forward step AND every lateral step inside one level enters from the LEFT */
var root = document.documentElement;
try{ root.style.setProperty('--sv-nav-ms', NAV.ms + 'ms'); root.style.setProperty('--sv-nav-dx', NAV.dx + 'px') }catch(e){}

/* the app's OWN rest test (window.svaraGfx.reduced() === OS matchMedia OR the saved preference),
   with a local copy for the hypothetical case where the gfx layer has not booted yet */
function reduced(){
  try{ if(window.svaraGfx && typeof window.svaraGfx.reduced === 'function') return !!window.svaraGfx.reduced() }catch(e){}
  try{ if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return true }catch(e){}
  try{ if(localStorage.getItem('sv_set_reduceMotion') === 'true') return true }catch(e){}
  return false;
}

/* depth of every page container: Home is the floor, the Library-style lists are one step in,
   artist and album pages are the deepest thing the app has */
var LEVEL = { homeSec:0, dynSec:1, artSec:2, albSec:2 };
var ORDER = ['homeSec','dynSec','artSec','albSec'];

function byId(id){ return document.getElementById(id) }
function textOf(node){ return node ? String(node.textContent || '').replace(/\s+/g,' ').trim() : '' }

function play(node, dir){
  if(!node || reduced()) return;
  var cls = dir > 0 ? 'svSlideR' : 'svSlideL';
  if(node.__svNavEnd) node.removeEventListener('animationend', node.__svNavEnd);
  var again = node.classList.contains(cls);      /* a second nav in the same direction: restart it */
  node.classList.remove('svSlideL','svSlideR');
  if(again) void node.offsetWidth;               /* only re-read layout when the animation must restart */
  node.classList.add(cls);
  function done(){
    if(node.__svNavT){ clearTimeout(node.__svNavT); node.__svNavT = 0 }
    if(node.__svNavEnd){ node.removeEventListener('animationend', node.__svNavEnd); node.__svNavEnd = null }
    node.classList.remove('svSlideL','svSlideR');
  }
  /* animationend BUBBLES, and these pages are full of animations (skeletons, the onboarding dots,
     a coin flip). Only the node's OWN slide animation may end the state. */
  node.__svNavEnd = function(e){
    if(e.target !== node) return;
    if(e.animationName !== 'svSlideInL' && e.animationName !== 'svSlideInR') return;
    done();
  };
  node.addEventListener('animationend', node.__svNavEnd);
  /* fallback: the CSS switched the animation off (reduced motion turned on mid-session), or the
     tab was throttled so long that animationend never arrived */
  node.__svNavT = setTimeout(done, NAV.ms + 140);
}

/* the ONE page container on screen. #artSec/#albSec do not exist until their first visit
   (artSection()/albSection() insert them lazily), so nothing here assumes all four are present. */
function active(){
  for(var i = 0; i < ORDER.length; i++){ var n = byId(ORDER[i]); if(n && !n.hidden) return n }
  return null;
}
/* THE PAGE'S IDENTITY, in one string. A real page change always moves it, in whichever container
   it happens; a repaint always keeps it. '' means "this container has no page yet". */
function keyOf(sec){
  if(!sec) return '';
  if(sec.id === 'homeSec') return 'home';
  if(sec.id === 'dynSec'){
    var t = textOf(byId('pgTitle'));
    if(!t) return '';
    var chip = sec.querySelector('[data-libtab].on');       /* the Library's own tab strip */
    return 'dyn:' + t + (chip ? '|' + chip.getAttribute('data-libtab') : '');
  }
  /* #artSec AND #albSec paint the same hero — <div class="art-name"> is the artist's name on one
     page and the album's title on the other, so ONE reader covers both. */
  var name = textOf(sec.querySelector('.art-name'));
  return name ? sec.id + ':' + name : '';
}
var last = null, lastLevel = -1;      /* the page on screen, and how deep that page is */

function sync(){
  var sec = active(); if(!sec) return;
  var key = keyOf(sec);
  /* NOT RENDERED YET (a skeleton, or a page still mounted empty): wait for the next mutation
     rather than adopting a half-built page — this is what stops artist → artist sliding twice. */
  if(!key) return;
  var lvl = LEVEL[sec.id];
  if(last === null){ last = key; lastLevel = lvl; return }   /* the page we booted on: adopt it */
  if(key === last) return;                                   /* a repaint of the page already here */
  var dir = lvl < lastLevel ? NAV.back : NAV.fwd;
  last = key; lastLevel = lvl;
  play(sec, dir);
}

function watch(node){
  if(!node || !window.MutationObserver || node.__svNavW) return;
  node.__svNavW = 1;
  try{
    new MutationObserver(sync).observe(node, {
      attributes:true, attributeFilter:['hidden'],   /* the container is swapped: Home ⇄ a page */
      childList:true, subtree:true                   /* the page is rebuilt in place: lateral move */
    });
  }catch(e){}
}
function scan(){
  for(var i = 0; i < ORDER.length; i++) watch(byId(ORDER[i]));
  /* the boot page is ADOPTED silently — only a change away from it animates */
  if(last === null){ var sec = active(); if(sec){ var k = keyOf(sec); if(k){ last = k; lastLevel = LEVEL[sec.id] } } }
}
scan();
var sc = byId('scroll');
if(sc && window.MutationObserver){ try{ new MutationObserver(scan).observe(sc, { childList:true }) }catch(e){} }
})();
</script>
<style id="v16pancss">
/* ===== WAVE 16 — the player panel: an Up next ⇄ Lyrics slide, and the fullscreen crossfade ====
   (1) THE PANEL SLIDE. The two tab LABELS are untouched — they are the affordance, and the request
   was to leave them exactly as they are. What moves is what sits UNDER them: the Up next trio
   (#pvCtx "Playing from …", #pvHead "Autoplay similar / Clear", #pvQueue the list) on one side and
   #pvLyrics on the other. #v16panjs reads the side from `#pvLyrics.hidden`, which the app's own tab
   handler has already flipped by the time its observer runs.
   DIRECTION: Lyrics is the RIGHT-hand tab, so it arrives from the RIGHT and Up next arrives from the
   LEFT — the content follows the tab that was clicked. The pair is mirrored and both signs live in
   ONE place (PANEL in #v16panjs), so flipping the convention is a two-character edit there.
   The Up next side is THREE sibling blocks and they carry the SAME animation on purpose: identical
   duration and easing reads as one surface sliding in, not three. Opacity rides along so it reads as
   motion of the panel, and nothing here touches position, size, scroll or hit-testing.
   ONE-SHOT, exactly like the page slide: #v16panjs drops the class on animationend — filtered to the
   node's OWN animation, because animationend bubbles out of the rows inside #pvQueue — with a
   fallback timer, so no transform outlives the 240ms.
   REST (the OS switch or the saved sv_set_reduceMotion) takes the whole effect away: #v16panjs skips
   the class in the same case, and the rule below covers a level change mid-session. */
@keyframes svPanInL{from{transform:translateX(calc(-1 * var(--sv-pan-dx,44px)));opacity:.001}to{transform:none;opacity:1}}
@keyframes svPanInR{from{transform:translateX(var(--sv-pan-dx,44px));opacity:.001}to{transform:none;opacity:1}}
#pvQueue.svPanL,#pvCtx.svPanL,#pvHead.svPanL,#pvLyrics.svPanL{animation:svPanInL var(--sv-pan-ms,240ms) cubic-bezier(.22,.61,.36,1) both}
#pvQueue.svPanR,#pvCtx.svPanR,#pvHead.svPanR,#pvLyrics.svPanR{animation:svPanInR var(--sv-pan-ms,240ms) cubic-bezier(.22,.61,.36,1) both}
html[data-gfx="reduced"] #pvQueue.svPanL,html[data-gfx="reduced"] #pvCtx.svPanL,html[data-gfx="reduced"] #pvHead.svPanL,html[data-gfx="reduced"] #pvLyrics.svPanL,
html[data-gfx="reduced"] #pvQueue.svPanR,html[data-gfx="reduced"] #pvCtx.svPanR,html[data-gfx="reduced"] #pvHead.svPanR,html[data-gfx="reduced"] #pvLyrics.svPanR{animation:none}

/* (2) THE FULLSCREEN CROSSFADE — the mini player's "Up next" while the fullscreen lyrics overlay
   is open. The reported bug is "it just switches", and the cause is a cascade accident, not a
   missing animation: that button has always driven the app's own collapse (#lyrFull →
   toggleLyrFull → lyrFullClose, a 380ms retract + fade), but the SAME click also flipped the tabs,
   and `[hidden]{display:none!important}` (bug #7's fix) hid #pvLyrics on the spot — so the retract
   was never seen and the Up next list appeared in one frame, 380ms before the overlay was gone.
   `.svxcross` is added for that ramp only and does exactly two things:
   (a) keeps #pvLyrics on screen while lyrFullClose() fades it. Both rules are !important, so
       specificity decides and this layer's (1 id + 2 classes) wins over plain [hidden];
   (b) reveals the Up next trio — which `body.lyrfull …{display:none!important}` hides for the WHOLE
       ramp — with a fade-in that finishes BEFORE the ramp does, so the list crossfades in UNDER the
       retracting overlay (still dimming and blurring it) instead of snapping in at the end.
   The mini player bar is deliberately NOT touched: on this path its own 340ms fade
   (`body.lyrfull.lyrreveal #mini`) runs WITH the retract, and the player page underneath hides it
   anyway, so holding it on screen would only add a second fade after the transition was over.
   The retract, the `lyrreveal` page restore, LF.open, the collapse icon and the inline-style cleanup
   all stay the app's own (v2js) path — #v16panjs only clicks #lyrFull, exactly as the 4AV handler
   did. Reduced motion never adds the class at all: lyrFullClose() then finishes in one step. */
@keyframes svXfadeIn{from{opacity:0}to{opacity:1}}
body.lyrfull.svxcross #pvLyrics{display:flex!important}
body.lyrfull.svxcross .pvctx,body.lyrfull.svxcross #pvQueue{display:block!important;animation:svXfadeIn .3s ease both}
body.lyrfull.svxcross .pvhead{display:flex!important;animation:svXfadeIn .3s ease both}
</style>

<script id="v16panjs">
/* ===== WAVE 16 — the panel's slide + the fullscreen crossfade, the JS half =====================
   ADDITIVE, in the same shape as #v15slidejs: it observes what the app already writes (the `hidden`
   flip the tab handler performs on #pvLyrics) and plays a class. The tab handler, the lyrics layer
   and the fullscreen layer are untouched.
   The ONE thing it takes over is the mini player's "Up next" button inside fullscreen lyrics, and it
   does that by WRAPPING the handler already there (qb.onclick), never by replacing the node or its
   listeners — so the 4BA wave's own click listener on that button (the three-line icon animation)
   keeps working, and the non-fullscreen behaviour stays the 4AV handler's. */
(function(){
'use strict';
/* ONE config object for the panel slide. lyr:+1 => Lyrics arrives from the RIGHT (it is the
   right-hand tab), up:-1 => Up next arrives from the LEFT. */
var PANEL = { ms:240, dx:44, lyr:1, up:-1 };
var XMS = 520;      /* how long the fullscreen crossfade owns the tab switch (the ramp is 380ms) */
var root = document.documentElement;
try{ root.style.setProperty('--sv-pan-ms', PANEL.ms + 'ms'); root.style.setProperty('--sv-pan-dx', PANEL.dx + 'px') }catch(e){}

/* the app's OWN rest test, same three steps as #v15slidejs (OS matchMedia, the saved preference,
   and window.svaraGfx.reduced() which is exactly those two) */
function reduced(){
  try{ if(window.svaraGfx && typeof window.svaraGfx.reduced === 'function') return !!window.svaraGfx.reduced() }catch(e){}
  try{ if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return true }catch(e){}
  try{ if(localStorage.getItem('sv_set_reduceMotion') === 'true') return true }catch(e){}
  return false;
}
function byId(id){ return document.getElementById(id) }

/* the two views: Lyrics is ONE box, Up next is THREE sibling blocks that the tab handler shows and
   hides together (the "Playing from …" line, the Clear bar, the list) */
var UP = ['pvCtx','pvHead','pvQueue'];

function oneShot(node, cls){
  if(!node) return;
  if(node.__svPanEnd) node.removeEventListener('animationend', node.__svPanEnd);
  var again = node.classList.contains(cls);       /* a second switch the same way: restart it */
  node.classList.remove('svPanL','svPanR');
  if(again) void node.offsetWidth;                /* only re-read layout when it must restart */
  node.classList.add(cls);
  function done(){
    if(node.__svPanT){ clearTimeout(node.__svPanT); node.__svPanT = 0 }
    if(node.__svPanEnd){ node.removeEventListener('animationend', node.__svPanEnd); node.__svPanEnd = null }
    node.classList.remove('svPanL','svPanR');
  }
  /* animationend BUBBLES, and #pvQueue is full of rows with animations of their own: only this
     node's OWN slide may end the state. */
  node.__svPanEnd = function(e){
    if(e.target !== node) return;
    if(e.animationName !== 'svPanInL' && e.animationName !== 'svPanInR') return;
    done();
  };
  node.addEventListener('animationend', node.__svPanEnd);
  /* fallback: the CSS switched the animation off (reduced motion turned on mid-session), or the
     window was throttled so long that animationend never arrived */
  node.__svPanT = setTimeout(done, PANEL.ms + 140);
}

var XLOCK = false;      /* the fullscreen crossfade is driving the tab switch itself */

function play(){
  if(reduced() || XLOCK) return;
  var l = byId('pvLyrics'), q = byId('pvQueue');
  if(!l || !q) return;
  /* fullscreen owns its own transitions: a transform there would also become the containing block
     of the overlay's fixed .lyrbar, and XLOCK already covers this layer's own switch */
  if(document.body.classList.contains('lyrfull')) return;
  if(!document.body.classList.contains('pv')) return;    /* the player page is not open */
  var toLyrics = !l.hidden;                              /* the tab handler has already flipped it */
  var cls = (toLyrics ? PANEL.lyr : PANEL.up) > 0 ? 'svPanR' : 'svPanL';
  var ids = toLyrics ? ['pvLyrics'] : UP;
  for(var i = 0; i < ids.length; i++) oneShot(byId(ids[i]), cls);
}

/* the app's own .tab handler flips the `hidden` flags; that flip is the trigger, so nothing here
   has to know about #queueBtn, lyrFullOpen() or the keyboard path — every one of them ends up in
   the same handler and is therefore covered. */
(function watchTabs(){
  var l = byId('pvLyrics'); if(!l || l.__svPanW) return;
  l.__svPanW = 1;
  /* THE REPORT: a SECOND click on the already-active "Up next" tab replayed the slide every time,
     while the same click on the already-active Lyrics tab was correctly inert. Cause: the app's own
     tab handler (line 1759) writes all four flags unconditionally, and the two writes are not
     symmetrical. With lyrics OFF it assigns `#pvLyrics.hidden = true` — a same-value write to an
     attribute that is ALREADY `hidden=""`, and a redundant setAttribute still queues a mutation
     record, so this observer fired and the slide replayed. With lyrics ON it assigns `hidden = false`,
     i.e. removeAttribute on an absent attribute, which is a genuine no-op that queues nothing —
     hence a one-sided bug. (classList, used for the `.tab.on` pills in the same handler, de-dupes
     its own writes, so only `hidden` could do this.)
     FIX: a mutation only counts as a tab CHANGE when the reflected value differs from the one this
     layer last acted on. Redundant writes fall through; real switches animate exactly once each
     way. `#pvLyrics` ships `hidden` in the markup (line 609), so the stored baseline is right from
     the first click. */
  var lastHidden = l.hidden;
  function onToggle(){
    if(l.hidden === lastHidden) return;      /* the ACTIVE tab was clicked again: nothing changed */
    lastHidden = l.hidden;
    play();
  }
  try{ new MutationObserver(onToggle).observe(l, { attributes:true, attributeFilter:['hidden'] }) }catch(e){}
})();

/* ===== (2) the fullscreen crossfade ===========================================================
   The mini player's "Up next" while `body.lyrfull` is on. XLOCK makes a SECOND click during the
   ramp fall through to the 4AV handler — which is what the app did before (4AO retargets a reopen
   without snapping) — so no new state machine is introduced here. */
function crossfade(){
  var b = document.body, f = byId('lyrFull'), up = document.querySelector('.tab[data-tab="up"]');
  XLOCK = true;
  b.classList.add('svxcross');        /* (a)+(b)+(c) from #v16pancss, for the whole ramp */
  /* the app's OWN collapse: LF.open, `lyrreveal`, the retract/fade of #pvLyrics and the collapse
     icon all live inside the v2js layer. #lyrFull is its public handle — the same click this
     button made before this wave. */
  if(f) f.click(); else b.classList.remove('lyrfull');
  if(typeof openPV === 'function') openPV();            /* the page under the overlay (it already is) */
  if(up) up.click();                                    /* the arriving tab's flags flip in the same tick */
  setTimeout(function(){ b.classList.remove('svxcross'); XLOCK = false }, XMS);
}
var qb = byId('queueBtn');
if(qb){
  var _q = qb.onclick;                 /* the 4AV handler: openPV() + the Up next tab */
  qb.onclick = function(e){
    if(!XLOCK && !reduced() && document.body.classList.contains('lyrfull')){ crossfade(); return }
    return (typeof _q === 'function') ? _q.call(this, e) : undefined;
  };
}
})();
</script>
<style id="v17lyrcss">
/* ===== WAVE 17 — leaving fullscreen lyrics has no blank beat =================================
   THE REPORT: "from fullscreen lyrics back to the player page the lyrics tab was empty for half a
   second and then filled back in". Two things on the way OUT, and this block + #v17lyrjs fix both.

   (1) THE BLANK RAIL. 4AO's collapse retracts and fades the fullscreen overlay over 380ms, and
   `body.lyrfull …{display:none!important}` (line 1815) hides the whole Up next trio for that entire
   window. With the LYRICS tab on screen the rail is therefore empty from the moment the overlay has
   retracted to nothing until `finish()` drops lyrfull at 380ms: the rail showed its tab row and
   nothing else, then the panel appeared in a single frame. MEASURED: overlay opacity 0.75 at 100ms,
   0.20 at 200ms, panel still absent until 380ms — and the screenshot the report came with is
   exactly one of those frames (the mini bar is still mid-fade at the bottom of it).
   `.svhand` hands the panel BACK early: ~200ms in, with the overlay already ~85% gone, #v17lyrjs
   drops lyrfull/lyrreveal (precisely what finish() does 180ms later) and fades the panel in from 0
   where it belongs. The overlaying lyrics dissolve out while the rail's own panel dissolves in, so
   the rail is never blank. The app's own timer still runs and still cleans up; it just finds the
   classes already gone.
   The fade is an ANIMATION and not an inline opacity for a reason: the app's `lfClear(el)` clears
   inline transition/opacity at 380ms, which would cut a transition short mid-flight but cannot
   touch a running animation. REST drops the fade (the handoff itself still happens, because the
   retract does not exist to begin with when motion is reduced). */
#pvLyrics.svhand{animation:svHandIn .22s ease both}
/* NOT from 0: the handoff lands when the retracting overlay is still ~15% opaque, so the incoming
   panel starts from that same ~15% — the two cross-dissolve through each other and the trace never
   dips to nothing (from 0 measured one frame under 0.04, which is the dip this avoids; with it the
   lowest sample of the whole collapse is 0.11 and no sample is under 0.10). */
@keyframes svHandIn{from{opacity:.18}to{opacity:1}}
html[data-gfx="reduced"] #pvLyrics.svhand{animation:none}
</style>

<script id="v17lyrjs">
/* ===== WAVE 17 — the fullscreen-lyrics collapse: hand the panel back early, then re-anchor =====
   ADDITIVE and timing-only: no app function is wrapped and no rule of the app's is overridden. The
   trigger is the body's own class list, because nothing else signals the collapse:
   `lyrreveal` is added by lyrFullClose() for the close ramp and by nothing else.

   (2) THE RE-ANCHOR. `finish()` calls sizeLyrPad() but never lyrRecenter(), so the rail keeps the
   FULLSCREEN scroll offset. MEASURED: scrollTop 323 where the rail rests at 638, which leaves the
   active line 316px below the rail's own centre (23px below the fold, so the panel showed the
   lines around it rather than the line being sung) until the next lyric line happens to recentre
   it — the tail of the "filled back in shortly". It is also why the reduced-motion close (where finish() runs while
   the overlay is STILL full-screen) leaves the padding half a full screen too tall.
   The app already owns the exact helper for this — `ensureLyricsUI()` → `lyrReopen()` → sizeLyrPad +
   lyrRecenter + updateLyrJump, which is the same call the Lyrics TAB makes when it opens the panel
   — so this layer calls that instead of re-deriving the anchored-target maths (which lives in a
   private scope). It is called twice, once early and once after the app's own 380ms finish(), so the
   second call wins whatever the geometry did in between. Every step is guarded, so a close with no
   ramp at all (reduced motion, closePV) simply skips the handoff and still gets the re-anchor. */
(function(){
'use strict';
var HOLD = 200;                 /* hand over ~85% into the 340ms retract (the ramp is 380ms) */
var HAND = 240;                 /* a hair longer than the .22s hand-in animation */
var REDO = [215, 520];          /* re-anchor twice: while the panel is still fading in (so the glide
                                   is mostly over when it is fully visible), and again after the
                                   app's own 380ms finish() has re-padded it for the rail */
var armed = false, handed = false, cooling = false, wasFull = false, handT = 0;

function byId(id){ return document.getElementById(id) }
/* the app's OWN ramp test (lfReduced()): the OS query alone. Only then is there no retract to
   re-time — the in-app Reduce-motion setting still gets 4AO's ramp, so it still gets the handoff. */
function osReduced(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) }catch(e){ return false }
}

/* (1) the handoff */
function handoff(){
  var b = document.body, el = byId('pvLyrics');
  if(!el) return;
  /* a ramp that is still running, and the arriving view IS the lyrics panel. The mini player's
     "Up next" in fullscreen (#v16panjs) flips the tab to Up next instead and crossfades the trio
     in under the retracting overlay — that path must not be disturbed. */
  if(!b.classList.contains('lyrfull') || !b.classList.contains('lyrreveal') || el.hidden) return;
  if(osReduced()) return;                     /* no ramp to re-time: lyrFullClose() already finished */
  /* self-contained: the retract's clip would hide the panel, and its in-flight inline opacity
     would win again the moment the hand-in animation ended, so both go now — finish() clearing
     them later is then just a no-op. */
  el.style.removeProperty('clip-path');
  el.style.removeProperty('transition');
  el.style.removeProperty('opacity');
  b.classList.remove('lyrfull','lyrreveal');  /* the panel is a rail panel again, from right now */
  el.classList.add('svhand');                 /* ...and it fades in where it belongs */
  handed = true;
  clearTimeout(handT);
  handT = setTimeout(function(){ el.classList.remove('svhand'); handed = false }, HAND);
}

/* (2) the re-anchor */
function reanchor(){
  var b = document.body, el = byId('pvLyrics');
  if(b.classList.contains('lyrfull')) return;   /* still fullscreen: the app recentres on open */
  if(!el || el.hidden) return;                  /* the lyrics panel is not the arriving view */
  if(!b.classList.contains('pv')) return;       /* the player page is not on screen */
  try{ if(typeof window.ensureLyricsUI === 'function') window.ensureLyricsUI() }catch(e){}
}
function reanchorLater(){
  if(cooling) return;
  cooling = true;
  for(var i = 0; i < REDO.length; i++) setTimeout(reanchor, REDO[i]);
  setTimeout(function(){ cooling = false }, REDO[REDO.length - 1] + 240);
}

function tick(){
  var b = document.body, el = byId('pvLyrics'), full = b.classList.contains('lyrfull');
  if(full){
    /* reopened during the hand-in: give the overlay its own entrance back */
    if(handed){ clearTimeout(handT); handed = false; if(el) el.classList.remove('svhand') }
    if(b.classList.contains('lyrreveal') && !armed){
      armed = true;
      setTimeout(handoff, HOLD);
      reanchorLater();
    }
  } else {
    armed = false;
    if(wasFull && !handed) reanchorLater();     /* a collapse with no ramp at all */
  }
  wasFull = full;
}
var body = document.body;
wasFull = body.classList.contains('lyrfull');
if(window.MutationObserver){ try{ new MutationObserver(tick).observe(body, { attributes:true, attributeFilter:['class'] }) }catch(e){} }
})();
</script>
<style id="v18lyrnostrip">
/* ===== WAVE 18 — no dark strip across the top of the fullscreen lyrics ========================
   `body.lyrfull .lyrbar` (line 1816) is the only chrome the fullscreen view keeps — positioned
   `fixed;top:0;left:6vw;right:6vw`, holding the collapse chevron — and it painted a
   `linear-gradient(to bottom,rgba(6,6,10,.92),transparent)` behind itself: a full-width dark band
   over the TOP of the lyrics (reported; the screenshot is that band over the first two lines).
   The bar keeps its place, its height and its padding — it still owns the chevron — and loses only
   the paint, so the lyrics start clean at the very top instead of through 70px of gradient.
   Two details come with it rather than being left behind:
   (a) the chevron relied on that dark band for contrast, so it now carries a drop shadow — it is
       the only way out of fullscreen and has to stay readable over 44px of white lyric text;
   (b) an invisible full-width bar would still swallow every click in that top strip (the lyrics'
       own line-seek handler is delegated from #lyrBody), so the bar stops taking pointer events
       and the chevron takes them back. The strip behaves like the lyrics under it again. */
body.lyrfull .lyrbar{background:none;pointer-events:none}
body.lyrfull #lyrFull{pointer-events:auto;filter:drop-shadow(0 1px 4px rgba(0,0,0,.85))}
</style>
<style id="v19onccss">
/* ===== WAVE 19 — what a SELECTED onboarding chip looks like ====================================
   Was: a SOLID accent pill (background:var(--acc) — #1FCF9B — with near-black text: the fill was the
   whole signal, and on a screen that is otherwise near-black it read as a row of bright rectangles)
   plus a 14px glow. Now it is the reference the user sent: the pill keeps its dark surface, the
   accent moves into the EDGE and the TYPE, and the check mark (which the v6onc markup already had,
   in the accent’s own colour) carries the state. Same box, same padding, same height — only the
   paint changes, so nothing on the screen reflows and no measurement in the v6onc block is
   invalidated. Unselected pills are untouched (this rule only ever matches aria-pressed="true").
   The transition (background/border/color/box-shadow, 0.18s — set by .oncPill itself) still runs,
   so the state change fades rather than popping.
   SPECIFICITY NOTE: this rule and .oncPill:hover are both (0,2,0), so being later in the document
   is what makes it win on a hovered selected pill — which is why the hover state is re-stated below
   instead of left to inherit the unselected hover (white edge + white text). */
.oncPill[aria-pressed="true"]{
  background:rgba(var(--amb),.13);
  border-color:var(--acc);
  color:var(--acc);
  font-weight:700;
  box-shadow:0 0 0 1px rgba(var(--amb),.18) inset,0 0 16px rgba(var(--amb),.16)}
.oncPill[aria-pressed="true"]:hover{background:rgba(var(--amb),.20);border-color:var(--acc2);color:var(--acc2)}
</style>

<script id="v19oncui">
/* ================================================================================================
   WAVE 19 — AND THE OTHER THING A LIKE DOES: it must not throw the user back to the start of a rail.
   Reported: scrolling a long way into the Quick picks carousel on Home, tapping ♥ on a song, and
   landing back at the FIRST card with the whole carousel reset — every time. Root cause: liking is a
   GLOBAL state change (the same track can sit in Listen again, a picked shelf and the queue at once),
   so refreshHearts() rebuilds the current page, and on Home that is renderHome(), whose first write
   is sec.innerHTML = h: #homeSec is replaced wholesale, and a fresh grid/rail starts at scrollLeft 0
   by definition — which is exactly where the user found themselves, every time.
   THE FIX — put the offsets back, not the markup back. Before the rebuild this reads every scrolled
   or scrollable node (.railwrap, .list, .chiprow) in each section, keyed by the section’s own <h2>
   text, which survives a rebuild because it is what renderHome writes; after it, the same nodes are
   found again by that key and their offsets are written back. renderHome paints its synchronous half
   (the Quick picks grid among it) before it returns, so one restore call covers the reported case,
   and the three discovery rails — which fill AFTER their fetch settles — are covered by the two
   follow-ups below. Nothing is keyed by index alone: a section whose scrollers changed shape is
   simply skipped (its node is missing) rather than restoring an unrelated offset.
   ONLY the like/unlike path is wrapped: a repaint the user ASKED for (a chip, a sort) is still free
   to start its rows where it likes, because it is the same wrapper renderHome()/goHome() call. */
(function(){
  var SCROLLERS = ".railwrap,.list,.chiprow";
  function textKey(sec){
    var h = sec.querySelector("h2"); if(!h) return "";
    var first = h.firstChild;                                   /* skips the Play all / Show more buttons */
    var t = (first && first.nodeType === 3) ? first.textContent : h.textContent;
    return String(t || "").replace(/s+/g, " ").trim();
  }
  function scrollers(sec){
    var out = [];
    Array.prototype.forEach.call(sec.querySelectorAll(SCROLLERS), function(n){
      if(n.scrollWidth - n.clientWidth > 2 || n.scrollTop) out.push(n);
    });
    return out;
  }
  function snapshot(rootEl){
    var snap = [];
    if(!rootEl) return snap;
    Array.prototype.forEach.call(rootEl.querySelectorAll(".sec"), function(sec){
      var key = textKey(sec); if(!key) return;
      var list = scrollers(sec); if(!list.length) return;
      snap.push({ key:key, at:list.map(function(n){ return { l:n.scrollLeft, t:n.scrollTop } }) });
    });
    return snap;
  }
  function restore(rootEl, snap){
    if(!rootEl || !snap || !snap.length) return 0;
    var byKey = {};
    Array.prototype.forEach.call(rootEl.querySelectorAll(".sec"), function(sec){
      var k = textKey(sec); if(k && !byKey[k]) byKey[k] = sec;
    });
    var n = 0;
    snap.forEach(function(s){
      var sec = byKey[s.key]; if(!sec) return;
      var list = scrollers(sec);
      s.at.forEach(function(p, i){
        var node = list[i]; if(!node) return;
        if(node.scrollLeft !== p.l){ node.scrollLeft = p.l; n++ }
        if(p.t && node.scrollTop !== p.t) node.scrollTop = p.t;
      });
    });
    return n;
  }
  var inner = (typeof refreshHearts === "function") ? refreshHearts : null;
  if(!inner) return;
  refreshHearts = function(){
    var home = document.getElementById("homeSec");
    if(!home || home.hidden || typeof renderHome !== "function") return inner.apply(this, arguments);
    var snap = snapshot(home);
    var out = renderHome();
    restore(home, snap);
    var again = function(){ restore(home, snap) };
    if(out && typeof out.then === "function") out.then(again, again);
    setTimeout(again, 60); setTimeout(again, 260);
    return out;
  };
  window.svaraRailScroll = { keep: function(){ var h=document.getElementById("homeSec"); return snapshot(h) },
                             put: function(s){ return restore(document.getElementById("homeSec"), s) } };
})();
</script>
