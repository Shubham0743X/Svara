<script id="v4glassjs">
/* ================= Wave 4BO — glass button enhancer =================
   Marks the EXISTING buttons with .glb (full glass) or .glb-l (light glass). It NEVER wraps an
   element, NEVER replaces innerHTML and NEVER moves/creates a child — every decoration is a
   ::before/::after from #v4glasscss. Click handlers are untouched (no capture/stopPropagation/
   preventDefault), so no handler is delayed by an animation.
   FULL  = pill / standalone buttons that can carry the full chrome.
   LITE  = tiny icon-only controls and dense sidebar rows (no backdrop-filter).
   SKIP  = anything that would lose a LIVE colour: #go keeps its solid --grad button (the stated
           default), #playBtn / #pvPlay / .mbtn.main / .art-acts .pact (Play all) / .topres .trbtn
           keep their album-coloured fill, and the two liquid-metal buttons (#newPl and
           #setPanel .setAbout) keep their chrome ring. */
(function(){
'use strict';
var FULL='.chip[data-chip],#searchFilters .fchip,.chip[data-libtab],.chip[data-libsort],.srch,.art-back,.sec h2 .go,#aboutCard .abBtn,#setPanel .setAct,.art-acts .pact.ghost,.topres .trbtn.ghost';   /* UI-10: .lyrseg/.lyrchip buttons left this list — the lyrics-provider pills carry a FIXED dark-translucent style (#v5provcss) at every graphics level, so the gated .glb chrome must not touch them. UI-11: the Library page's filter + sort chips joined (.chip[data-libtab] / .chip[data-libsort]) — they are the SAME .chip pill the mood row renders, so they now take the same glass as the pills in the search list instead of staying flat. */
/* UI-11: the Library head is rebuilt on every chip click (#v5libjs), so the MutationObserver — not
   a one-shot pass — is what marks the fresh buttons. Nothing else is needed: same classes, same
   gated chrome, so the mood row, the search pills and the Library chips can never drift apart. */
var LITE='.tic,.dots,.pact:not(#pvFav):not(#pvMenu),.mbtn:not(#mFav),.pbtn,.lyrbtn,.rail .ov .pb,#setPanel .setX,#aboutCard .abX';
var SKIP='#go,.gobtn,#newPl,#setPanel .setAbout,.lm,#playBtn,#pvPlay,.mbtn.main,.art-acts .pact:not(.ghost),.topres .trbtn:not(.ghost),.np button,#npGo';
function mark(){
  var els=document.querySelectorAll(FULL+','+LITE);
  for(var i=0;i<els.length;i++){
    var el=els[i];
    if(el.__glb)continue;
    if(el.matches(SKIP))continue;
    el.__glb=1;
    try{ el.classList.add(el.matches(FULL)?'glb':'glb-l') }catch(e){}
  }
}
var raf=0;
function schedule(){ if(raf)return; raf=requestAnimationFrame(function(){ raf=0; try{mark()}catch(e){} }) }
try{ new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true}) }catch(e){}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule); else schedule();

/* :has() fallback — ONLY used when the engine has no :has(). Native :hover/:active already drive
   every state; this just mirrors them onto .is-hover / .is-active (which the CSS also listens for). */
var hasHas=false;
try{ hasHas=CSS.supports('selector(:has(*))') }catch(e){}
if(!hasHas){
  var near=function(e){ return (e.target&&e.target.closest)?e.target.closest('.glb,.glb-l'):null };
  var over=function(e){ var b=near(e); if(b&&!b.__hv){ b.__hv=1; b.classList.add('is-hover') } };
  var out =function(e){ var b=near(e); if(b&&b.__hv){ b.__hv=0; b.classList.remove('is-hover') } };
  var dn  =function(e){ var b=near(e); if(b)b.classList.add('is-active') };
  var up  =function(e){ var b=near(e); if(b)b.classList.remove('is-active') };
  document.addEventListener('pointerover',over,true);
  document.addEventListener('pointerout',out,true);
  document.addEventListener('pointerdown',dn,true);
  document.addEventListener('pointerup',up,true);
  document.addEventListener('pointercancel',up,true);
}

/* one line of engine facts for the wave log — no dependency, no side effect */
try{
  var ua=navigator.userAgent, ch=(ua.split('Chrome/')[1]||'').split(' ')[0];
  console.log('[v4glass] Chromium '+ch+' · color-mix '+CSS.supports('color','color-mix(in srgb,red 50%,transparent)')+' · :has '+hasHas+' · oklch-from '+CSS.supports('color','oklch(from #fff l c h)')+' · backdrop-filter '+(CSS.supports('backdrop-filter','blur(2px)')||CSS.supports('-webkit-backdrop-filter','blur(2px)'))+' · @property '+(typeof CSS.registerProperty==='function'));
}catch(e){}
})();
</script>

<style id="v4sbcss">
/* Wave 4BT — left-sidebar ghost click-ripple buttons.
   Ported from the 21st.dev RippleButton (variant ghost) spec into vanilla CSS + JS.
   Scope: #sb .navit, #sb #plList .plrow, #sb #plList .plmenu only.
   Explicitly NOT applied to #newPl (.newpl, keeps its 4LM liquid-metal ring) or #sbWord. */

@keyframes js-ripple-animation{

.sb-ripple-host{
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;

<style id="v5segcss">
/* ================= Wave 5 (UI-2) — sliding segmented control =================
   Ported from the 21st.dev `SegmentedControl` (spring: stiffness 520 / damping 34 / mass 0.45)
   into vanilla CSS + ONE data-i hook. No React, no motion/framer, no JS animation loop.
   Scope: #setPanel .setSeg only — Repeat mode, Default provider, Graphics level.
   The original `#setPanel .setSeg*` rules in v3css were replaced by this block (same tokens in,
   same pill container out), so the control has a single source of truth.
   Spring → CSS: the source's spring is approximated with a snappy cubic-bezier overshoot.
   Text effect: the source renders each label a SECOND time inside the thumb so the text travels
   with it and flips colour; that is `.segGhost` below — an N-column copy translated inside the
   clipped thumb, while the real checked label's own text is made transparent. */
#setPanel .setSeg{
  position:relative;
  display:inline-grid;                       /* inline-grid: equal columns AND natural, un-stretched width */
  grid-template-columns:repeat(var(--n,3),minmax(0,1fr));
  gap:0;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px;
  flex-shrink:0;
  overflow:hidden;                           /* keeps the thumb inside the pill radius */
  isolation:isolate;
}
/* the thumb slides between columns. `--i` comes from data-i (below) — no :has() anywhere.
   RADIUS: the source component uses a 6px corner, but its container is the same 999px pill as
   this one, and a 6px corner cannot cover the container's round CAP — at the first/last column
   the pill's curve pushed past the thumb's corner and left a dark crescent, so the green read as
   "a box with its corners cut". A 999px radius makes the thumb the same stadium shape as the
   container, inset a uniform 2px, so the cap is filled and the corner follows the pill. */
#setPanel .setSeg .segThumb{
  position:absolute;top:2px;bottom:2px;left:2px;z-index:0;
  width:calc((100% - 4px)/var(--n,3));
  border-radius:999px;
  background:var(--grad);
  overflow:hidden;                           /* clips the travelling text copy to one column */
  transform:translateX(calc(var(--i,0) * 100%));
  transition:transform .42s cubic-bezier(.34,1.56,.64,1);
}
/* the travelling copy of the labels: N columns wide, shifted left by i columns */
#setPanel .setSeg .segGhost{
  position:absolute;top:0;left:0;height:100%;
  width:calc(var(--n,3) * 100%);
  display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));
  transform:translateX(calc(var(--i,0) * -100% / var(--n,3)));
  transition:transform .42s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;
}
/* the index → --i map. 0..5 covers every group the panel builds today (max 3); an option list
   longer than 6 would need another line here — setSeg() emits the index, this block names it. */
#setPanel .setSeg[data-i="0"]{--i:0}
#setPanel .setSeg[data-i="1"]{--i:1}
#setPanel .setSeg[data-i="2"]{--i:2}
#setPanel .setSeg[data-i="3"]{--i:3}
#setPanel .setSeg[data-i="4"]{--i:4}
#setPanel .setSeg[data-i="5"]{--i:5}
#setPanel .setSeg > label{position:relative;z-index:1;display:block;min-width:0}
#setPanel .setSeg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
/* label typography from the source: 13px/18px, 500, tighter tracking. The radius matches the
   thumb (a pill) rather than the source's 6px: the labels paint no background, but the focus ring
   is an INSET outline on this span, so its radius IS visible and must follow the thumb's shape. */
#setPanel .setSeg > label > span{
  display:block;padding:6px 12px;border-radius:999px;
  font-size:13px;line-height:18px;font-weight:500;letter-spacing:-.01em;
  color:var(--dim);cursor:pointer;white-space:nowrap;text-align:center;
}
#setPanel .setSeg > label:hover > span{color:var(--tx)}   /* source: an inactive label lightens on hover */
/* the thumb paints the checked background now, and the ghost prints the text — so the real
   checked label prints NOTHING (otherwise the text would be doubled). */
#setPanel .setSeg input:checked+span{background:none;color:transparent}
#setPanel .setSeg .segGhost > span{
  display:block;padding:6px 12px;border-radius:999px;
  font-size:13px;line-height:18px;font-weight:500;letter-spacing:-.01em;
  color:rgb(var(--on-acc));white-space:nowrap;text-align:center;
}
/* inset ring: the container clips overflow, so the focus outline is drawn inside the label */
#setPanel .setSeg input:focus-visible+span{outline:2px solid var(--acc2);outline-offset:-2px}
/* Part A: a stacked row drops its control onto its own line, left aligned, natural width */
#setPanel .setRow.stack .setSeg{margin-top:10px}
/* accessibility ceiling — reduced motion snaps the thumb, never slides it */
html[data-gfx="reduced"] #setPanel .setSeg .segThumb,
html[data-gfx="reduced"] #setPanel .setSeg .segGhost{transition:none}
</style>
<style id="v5swcss">
/* ================= Wave 5 (UI-2) — gooey toggle =================
   Ported from the 21st.dev `Toggle` + `GooeyFilter` into vanilla CSS + the ONE #goo filter in the
   <defs> block at the top of <body>. No React, no per-state JS: :checked in CSS is the single

<style id="v5moodcss">

<script id="v4sbjs">
/* Wave 4BT — ghost click-ripple for the left sidebar (#sb .navit / #plList .plrow / #plList .plmenu).
   One delegated listener on #sb, createJsRipple geometry from the 21st.dev RippleButton (variant ghost).

   THE updatePlRows() RE-RENDER TRAP:
   the document-level [data-nav] / [data-lib] handlers (registered earlier) synchronously call
   goHome() / openLiked() / openLikedAlbums() / openPl(), and each of those rebuilds
   #plList.innerHTML = h on the very same click. A ripple appended here would be destroyed before
   it ever paints on "Liked music", "Liked albums" or a playlist row. So this listener only records
   the click geometry + the target data-attribute identity; the ripple is spawned on the next
   animation frame against the LIVE button currently in #sb, resolved by that selector. If a repaint
   lands while a ripple is still animating, window.updatePlRows / window.svUpdatePlRows (wrapped
   below) and a MutationObserver on #plList re-attach the in-flight .sb-ripple-host onto the
   matching new button instead of cutting it short. */
(function(){
  var sb = document.getElementById('sb');
  if(!sb) return;

  var RIPPLE_MS = 600;
  var active = [];

  function reducedMotion(){
    try{ if(localStorage.getItem('sv_set_reduceMotion')==='true') return true }catch(e){}
    try{ if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return true }catch(e){}
    return false;
  }
  /* escape a data-attribute value for use inside a quoted attribute selector */
  function escSel(v){
    v = String(v);
    try{ if(window.CSS && CSS.escape) return CSS.escape(v) }catch(e){}
    /* last-resort fallback only: CSS.escape exists in every Chromium build Svara runs on */
    return v.replace(/["\\]/g, function(c){ return '\\' + c });
  }
  /* identity of the clicked row, as a selector that survives the updatePlRows() innerHTML rewrite */
  function identity(el){
    if(!el || typeof el.getAttribute !== 'function') return null;
    var v;
    v = el.getAttribute('data-nav');    if(v) return '[data-nav="'    + escSel(v) + '"]';
    v = el.getAttribute('data-lib');    if(v) return '[data-lib="'    + escSel(v) + '"]';
    v = el.getAttribute('data-plmenu'); if(v) return '[data-plmenu="' + escSel(v) + '"]';
    return null;
  }
  function live(sel){ try{ return sb.querySelector(sel) }catch(e){ return null } }

  function dispose(rec){
    if(rec.timer){ clearTimeout(rec.timer); rec.timer = null; }
    if(rec.host && rec.host.parentNode) rec.host.parentNode.removeChild(rec.host);
    var i = active.indexOf(rec); if(i >= 0) active.splice(i,1);
  }
  function arm(rec){ rec.timer = setTimeout(function(){ dispose(rec) }, RIPPLE_MS); }

  function paint(btn, sel, clientX, clientY, detail){
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height) * 2;
    var x, y;
    if(detail === 0 || (clientX === 0 && clientY === 0)){
      x = rect.width  / 2 - size / 2;   /* keyboard activation: centred */
      y = rect.height / 2 - size / 2;
    } else {
      x = clientX - rect.left - size / 2;
      y = clientY - rect.top  - size / 2;
    }
    var host = document.createElement('span');
    host.className = 'sb-ripple-host';
    var dot = document.createElement('span');
    dot.className = 'sb-ripple';
    dot.style.width  = size + 'px';
    dot.style.height = size + 'px';
    dot.style.left   = x + 'px';
    dot.style.top    = y + 'px';
    host.appendChild(dot);
    btn.appendChild(host);
    var rec = { sel: sel, host: host, dot: dot, timer: null };
    active.push(rec);
    arm(rec);
    return rec;
  }

  function spawn(sel, clientX, clientY, detail, tries){
    tries = tries || 0;
    var btn = live(sel);
    if(btn){ paint(btn, sel, clientX, clientY, detail); return; }
    if(tries < 3) requestAnimationFrame(function(){ spawn(sel, clientX, clientY, detail, tries + 1) });
  }

  /* re-attach any still-animating ripple whose host was detached by an innerHTML rewrite */
  function reattach(){
    for(var i = active.length - 1; i >= 0; i--){
      var rec = active[i];
      if(!rec.host || rec.host.isConnected) continue;
      var btn = live(rec.sel);
      if(!btn) continue;
      btn.appendChild(rec.host);
      if(rec.timer) clearTimeout(rec.timer);
      arm(rec);
      try{                                  /* restart the css animation on the re-inserted span */
        rec.dot.style.animation = 'none';
        void rec.dot.offsetWidth;
        rec.dot.style.animation = '';
      }catch(e){}
    }
  }

  sb.addEventListener('click', function(e){
    var t = e.target;
    var btn = (t && typeof t.closest === 'function')
      ? t.closest('.navit, #plList .plrow, #plList .plmenu')
      : null;
    if(!btn || !sb.contains(btn)) return;
    var sel = identity(btn);
    if(!sel) return;
    if(reducedMotion()) return;          /* no ripple spans when reduced motion is active */
    var cx = e.clientX, cy = e.clientY, d = e.detail;
    /* defer past the synchronous navigation + updatePlRows() repaint triggered by this click */
    requestAnimationFrame(function(){ spawn(sel, cx, cy, d, 0) });
  }, false);

  /* guard a later repaint that lands mid-animation */
  var mo = null;
  try{
    mo = new MutationObserver(function(){ reattach() });
    var list = document.getElementById('plList');
    if(list) mo.observe(list, { childList: true });
  }catch(e){}

  ['updatePlRows','svUpdatePlRows'].forEach(function(name){
    var orig = window[name];
    if(typeof orig !== 'function' || orig.__sb4btWrapped) return;
    var wrapped = function(){
      var r = orig.apply(this, arguments);
      try{ reattach() }catch(e){}
      return r;
    };
    wrapped.__sb4btWrapped = true;
    try{ window[name] = wrapped }catch(e){}
  });
})();
</script>

<script id="v5xfjs">
/* ===== Wave 5 (UI-5) — crossfade, instant hand-off and stream prefetch =====
   One idle element (audioAlt), three jobs, all additive:
     1. PREFETCH — /api/prefetch resolves the stream URL of the tracks that come next while the
        current one plays, and of whatever the cursor rests on. MEASURED on this machine: that
        resolution costs 3.6-4.5 s cold and 0.07-0.23 s warm, and it was the WHOLE "songs take ages
        to start" cost — the audio itself was already streamed progressively (Range/206 piped
        straight through from the first byte). Warming also runs on hover, so the first track of a
        session starts fast too, not just the second one.
     2. HAND-OFF — the next track is buffered into the idle element ahead of time, so reaching the
        end of a song needs no new stream at all: the buffered element simply becomes the active
        one. That is the "seamless" part with crossfade off.
     3. CROSSFADE — with it on, the incoming song is faded in under the outgoing one on an
        equal-power curve. Settings → Playback → Crossfade (Off / 2s / 4s / 8s).
   Every path here degrades into the behaviour that already existed: if the buffered element is not
   ready, or its play() is refused, or the queue changed underneath, the ordinary loadAt() advance
   runs instead. Crossfade off + nothing buffered = the app exactly as it was. */
(function(){
  var XF_KEY='sv_set_crossfade';
  var XF_STEPS={off:0,'2':2,'4':4,'8':8};
  /* WAVE 14: the unset default is 2s (first-run), so the engine agrees with the Settings row. */
  function xfModeNow(){ try{ var v=JSON.parse(localStorage.getItem(XF_KEY)||'"2"'); return (v in XF_STEPS)?v:'2' }catch(e){ return '2' } }
  var xfMode=xfModeNow();
  function xfSecs(){ return XF_STEPS[xfMode]||0 }
  function volNow(){ return Math.max(0,Math.min(1,(typeof volume==='number'?volume:80)/100)) }
  function idleOf(){ return audio===MEDIA[0]?MEDIA[1]:MEDIA[0] }
  try{ audio.preload='auto' }catch(e){}

  /* ---------- 1) prefetch ---------- */
  var warmed={}, warmT=null;
  function warm(id){
    if(!id||warmed[id])return;
    warmed[id]=1;
    try{ fetch('/api/prefetch?id='+encodeURIComponent(id),{cache:'no-store'}).catch(function(){}) }catch(e){}
  }
  function warmAhead(n){
    if(cur<0)return;
    for(var k=1;k<=n;k++){
      var pos=cur+k; if(pos>=seq.length)return;
      var it=queue[seq[pos]]; if(it&&it.id)warm(it.id);
    }
  }
  /* Hovering a row means the click is ~a second away: 140 ms of rest starts the resolve, so the
     FIRST track of a session is warm too. Debounced, and each id is asked for at most once. */
  var hovId='';
  function rowIdUnder(t){
    /* the id is NOT an ancestor of what the cursor lands on: it sits on the ⋮ button / play button
       INSIDE the row. So walk up (bounded) until an element either carries the attribute itself
       or contains one — that is the row/card the user is pointing at. */
    var node=t, hops=0;
    while(node&&node!==document.body&&hops++<6){
      var own=node.getAttribute&&(node.getAttribute('data-menu')||node.getAttribute('data-play-item'));
      if(own)return own;
      var inner=node.querySelector&&node.querySelector('[data-menu],[data-play-item]');
      if(inner)return inner.getAttribute('data-menu')||inner.getAttribute('data-play-item')||'';
      node=node.parentElement;
    }
    return '';
  }
  document.addEventListener('pointerover',function(e){
    var t=e.target; if(!t||!t.getAttribute)return;
    var id=rowIdUnder(t);
    if(!id||id===hovId)return;
    hovId=id;
    clearTimeout(warmT);
    warmT=setTimeout(function(){ warm(id) },140);
  },true);

  /* ---------- 2) the idle element: buffer the next track, then hand over ---------- */
  var pre={el:null,pos:-1,id:''};
  function preStop(){
    var el=pre.el;
    pre={el:null,pos:-1,id:''};
    if(!el)return;
    try{ el.pause(); el.removeAttribute('src'); el.load() }catch(e){}
    try{ el.volume=volNow() }catch(e){}
  }
  function preSync(){
    if(xfState)return;
    if(repeat==='one'){ preStop(); return }          // the same song repeats: nothing to buffer ahead
    if(cur<0||cur+1>=seq.length){ preStop(); return }
    var it=queue[seq[cur+1]];
    if(!it||!it.id){ preStop(); return }
    if(pre.el&&pre.id===it.id)return;                 // already buffering exactly this one
    preStop();
    var el=idleOf();
    el.volume=volNow();
    el.src='/api/stream?id='+it.id;                   // preload=auto: buffers, never plays
    pre={el:el,pos:cur+1,id:it.id};
  }
  /* End of song: is the buffered element already the right track? Then this is a cut, not a load.
     false = "not ready", and the ordinary advance runs instead. */
  window.xfHandoff=function(){
    var s=pre; if(!s.el)return false;
    if(s.pos<0||!seq[s.pos])return false;
    var it=queue[seq[s.pos]];
    if(!it||it.id!==s.id)return false;                // the queue changed under us
    if(s.el.readyState<2)return false;                // not buffered enough to start cleanly
    var el=s.el, pos=s.pos;
    pre={el:null,pos:-1,id:''};
    el.volume=volNow();
    var pr=el.play();
    if(pr&&pr.catch)pr.catch(function(){ try{ loadAt(pos) }catch(e){} });
    audio=el; cur=pos;
    setNowUI(it); renderQueue(); paintRowCursor(); paintControls(); paintSeek();
    try{ el.dispatchEvent(new Event('play')) }catch(e){}   // history/art/state: exactly one play
    warmAhead(2);
    return true;
  };

  /* ---------- 3) crossfade ---------- */
  var xfState=null;
  window.xfOwnsAdvance=function(){ return !!xfState };   // the base 'ended' handler asks this
  function xfCancel(){
    var s=xfState; if(!s)return;
    xfState=null;
    clearInterval(s.timer);
    try{ s.out.volume=volNow() }catch(e){}              // the outgoing element is still the active one
    try{ s.in.pause(); s.in.removeAttribute('src'); s.in.load() }catch(e){}
    try{ s.in.volume=volNow() }catch(e){}
  }
  function xfTick(){
    var s=xfState; if(!s)return;
    var t=(Date.now()-s.t0)/(s.secs*1000);
    if(t>=1){ xfFinish(); return }
    var v=volNow();
    s.out.volume=v*Math.cos(t*Math.PI/2);               // equal power: constant perceived loudness
    s.in.volume=v*Math.sin(t*Math.PI/2);
  }
  function xfStart(){
    var secs=xfSecs(); if(!secs||xfState)return false;
    if(repeat==='one')return false;                     // the same song repeats: nothing to fade into
    if(cur<0||cur+1>=seq.length)return false;
    if(audio.paused||audio.seeking)return false;
    var d=audio.duration;
    var left=d-audio.currentTime;
    if(!isFinite(d)||left<XF_MIN)return false;          // too little left to cross anything into
    /* The REMAINING time is what matters, not the total duration: the probe below fires up to a
       quarter second late, and an eight-second fade started with four seconds left used to be
       cancelled by the end-of-song pause. So the fade simply TAKES whatever is left when that is
       shorter than the configured length — seeking into the last seconds still crossfades, just
       faster, instead of silently degrading to a cut. Above XF_MIN that always leaves room for
       the swap to land just before the outgoing song ends. */
    if(left<secs)secs=left;
    var it=queue[seq[cur+1]]; if(!it||!it.id)return false;
    var inEl=idleOf(), reuse=false;
    /* side benefit: if the idle element is already buffering exactly this track (the preload),
       the fade REUSES that buffer instead of throwing it away and streaming it again. */
    if(pre.el&&pre.el===inEl&&pre.id===it.id&&pre.el.readyState>=2){
      reuse=true;
      pre={el:null,pos:-1,id:''};
    } else if(pre.el)preStop();
    xfState={out:audio,in:inEl,inPos:cur+1,secs:secs,t0:Date.now(),timer:0};
    if(!reuse) inEl.src='/api/stream?id='+it.id;
    function onErr(){ try{ inEl.removeEventListener('error',onErr) }catch(e){}; xfCancel() }
    try{ inEl.addEventListener('error',onErr) }catch(e){}
    inEl.volume=0;                                      // a reused buffer fades in from silence too
    var pr=inEl.play();
    if(pr&&pr.catch)pr.catch(function(){ xfCancel() });  // refused → the ordinary advance runs
    xfState.timer=setInterval(xfTick,40);
    return true;
  }
  function xfFinish(){
    var s=xfState; if(!s)return;
    xfState=null;
    clearInterval(s.timer);
    /* never became playable: hand the advance back to the normal path, once, on the active element */
    if(s.in.paused||s.in.readyState<2){
      try{ s.in.pause(); s.in.removeAttribute('src'); s.in.load() }catch(e){}
      try{ s.out.volume=volNow() }catch(e){}
      try{ loadAt(s.inPos) }catch(e){}
      return;
    }
    var it=queue[seq[s.inPos]];
    try{ s.out.volume=0 }catch(e){}                     // silent: it ends by itself, events inert
    audio=s.in; cur=s.inPos;                            // THE HAND-OFF
    s.in.volume=volNow();
    if(it){ setNowUI(it); renderQueue(); paintRowCursor(); paintControls(); paintSeek() }
    try{ s.in.dispatchEvent(new Event('play')) }catch(e){}
    warmAhead(2);
  }
  var XF_MIN=0.6;   /* below this there is not enough of a song left to fade into — cut instead */
  /* The trigger: a quarter-second probe on the ACTIVE element (timeupdate fires ~4x/s). The fade
     starts one margin early so its swap lands just BEFORE the outgoing song ends — the outgoing
     element is then already idle, so its own `ended` can never double-advance. */
  var xfLast=0, preLast=0;
  onAudio('timeupdate',function(){
    var now=Date.now();
    if(now-xfLast>250){
      xfLast=now;
      if(!xfState&&xfSecs()&&!audio.paused){
        var d=audio.duration;
        if(isFinite(d)&&d>0&&d-audio.currentTime<=xfSecs()+0.25)xfStart();
      }
    }
    if(now-preLast>1000){ preLast=now; if(!xfState)preSync() }
  });
  /* The natural end of a song fires `pause` a moment BEFORE `ended` — cancelling on that would
     throw away a fade that is a quarter second from completing its swap. Only a real pause (the
     user, or a new load) cancels; reaching the end of the media is left to the fade's own clock. */
  onAudio('pause',function(){
    var d=audio.duration;
    if(audio.ended||(isFinite(d)&&d>0&&d-audio.currentTime<=0.05))return;
    xfCancel();
  });
  onAudio('seeking',xfCancel);

  /* Every explicit load wins over a fade or a stale buffer, and no element may keep a faded
     volume after the swap. loadAt() is the single funnel for play/pause-next/prev/row clicks,
     so wrapping it here covers them all. */
  var _loadAt=loadAt;
  loadAt=function(pos,autoplay){
    xfCancel();
    preStop();
    MEDIA.forEach(function(el){ try{ el.volume=volNow() }catch(e){} });
    var r=_loadAt(pos,autoplay);
    warmAhead(2);
    return r;
  };
  window.xfStopPreload=preStop;

  window.svaraXfade={
    get:function(){ return xfMode },
    secs:function(){ return xfSecs() },
    /* read-only introspection: what is buffered in the idle element, and is a fade running? */
    state:function(){ return { mode:xfMode, secs:xfSecs(), fading:!!xfState, outId:xfState?(((nowItem()||{}).id)||''):'', bufferedId:pre.id, bufferedPos:pre.pos, bufferedReady:pre.el?pre.el.readyState:-1, active:audio===MEDIA[0]?'a':'b' } },
    set:function(v){
      if(!(v in XF_STEPS))return;
      xfMode=v;
      if(!xfSecs())xfCancel();                          // switching off stops a fade in progress
    }
  };
})();
</script>

<style id="v5libcss">

   Layout only; every card reuses the .rail / .art / .row primitives (and their hover + heart
   affordances) so nothing here invents a second visual language. */

<script id="v5libjs">
/* ===== Wave 5 (UI-7) — the Library page =====
   The sidebar's Library button used to just open Liked music, so the app had no library at all.
   This is one page with four filter chips and a grid that adapts to the window:
     Playlists — Liked music (the auto playlist) + every user playlist, cover = its first track
     Songs     — Liked music as rows (the app's list primitive), so a click plays it in context
     Albums    — Liked albums, with the same heart that likes them everywhere else
     Artists   — every artist in your history, by plays, circular like the reference
   "Appropriate information" per card: track counts, artist · year for albums, song counts for
   artists, Pinned for pinned playlists. Sort by Recently played / A–Z applies to all four tabs.
   Everything is built from EXISTING globals (favs / pls / hist / LIKED_ALBUMS / listHTML /
   thumb / ic / esc / LSget / splitArtists) and every card navigates through an EXISTING handler
   ([data-lib], [data-artalbum], [data-artist-name]) — no new click runtime, no duplicated state. */
(function(){
  'use strict';
  var TABS = [['playlists','Playlists'],['songs','Songs'],['albums','Albums'],['artists','Artists']];
  var tab = 'playlists', sort = 'recent';

  function likedSongs(){ return Object.values(favs).filter(function(x){ return x && x.id }) }
  function lastOf(id){ var h = hist[id]; return (h && h.last) || 0 }
  function pinList(){ var p = LSget('sv_pins', []); return Array.isArray(p) ? p : [] }
  function plNames(){ return Object.keys(pls) }
  /* artists are derived from the listening history: a play count, the songs of theirs you played,
     and the most recent one's artwork as the portrait (we have no real artist images locally). */
  function artistList(){
    var m = {};
    Object.keys(hist || {}).forEach(function(id){
      var h = hist[id]; if(!h) return;
      splitArtists(h.artist).slice(0,2).forEach(function(n){
        var e = m[n] || (m[n] = { name:n, plays:0, songs:0, thumb:'', last:0 });
        e.plays += (h.count || 1); e.songs++;
        if((h.last||0) > e.last){ e.last = h.last; e.thumb = h.thumb || e.thumb }
      });
    });
    return Object.keys(m).map(function(k){ return m[k] });
  }
  function byRecent(a, b){ return b.recent - a.recent }
  function byName(a, b){ return String(a.name).localeCompare(String(b.name)) }

  /* ---- cards ---- */
  function autoCard(kind, title, sub){
    return '<div class="rail" data-lib="'+kind+'" data-title="'+esc(title)+'">'+
      '<div class="art libart auto"><span class="ic">'+ic('i-heart')+'</span></div>'+
      '<div class="rname">'+esc(title)+'</div><div class="rsub2">'+esc(sub)+'</div></div>';
  }
  function plCard(n){
    var items = pls[n] || [], cov = items.length ? thumb(items[0], THUMB_RAIL) : '';
    var ph = cov ? '' : '<div class="ph"><span class="ic">'+ic('i-list')+'</span></div>';
    var pinned = pinList().indexOf(n) >= 0;
    return '<div class="rail" data-lib="pl:'+esc(n)+'" data-title="'+esc(n)+'">'+
      '<div class="art libart">'+ph+(cov ? '<img loading="lazy" alt="" src="'+esc(cov)+'" onerror="this.style.display=\'none\'">' : '')+
      '<div class="ov"><span class="pb">'+ic('i-list')+'</span></div></div>'+
      '<div class="rname">'+esc(n)+'</div>'+
      '<div class="rsub2">'+(pinned?'Pinned · ':'')+'Playlist · '+items.length+(items.length===1?' song':' songs')+'</div></div>';
  }
  function albumCardL(a){
    var ph = thumb(a, THUMB_RAIL) ? '' : '<div class="ph"><span class="ic">'+ic('i-disc')+'</span></div>';
    var sub = [a.artist, a.year].filter(Boolean).join(' · ') || 'Album';
    return '<div class="rail" data-artalbum="'+esc(a.id)+'" data-title="'+esc(a.title||'')+'">'+
      '<div class="art libart">'+ph+'<img loading="lazy" alt="" src="'+esc(thumb(a,THUMB_RAIL))+'">'+
      '<div class="ov"><span class="pb">'+ic('i-play')+'</span></div>'+
      (typeof albHeartHTML==='function' ? albHeartHTML(a) : '')+'</div>'+
      '<div class="rname">'+esc(a.title||'')+'</div><div class="rsub2">'+esc(sub)+'</div></div>';
  }
  function artistCardL(a){
    var ph = a.thumb ? '' : '<div class="ph"><span class="ic">'+ic('i-note')+'</span></div>';
    return '<div class="rail" data-artist-name="'+esc(a.name)+'" title="Open artist page">'+
      '<div class="art libart round">'+ph+(a.thumb ? '<img loading="lazy" alt="" src="'+esc(a.thumb)+'" onerror="this.style.display=\'none\'">' : '')+'</div>'+
      '<div class="rname">'+esc(a.name)+'</div>'+
      '<div class="rsub2">Artist · '+a.songs+(a.songs===1?' song':' songs')+'</div></div>';
  }

  /* ---- one tab's body ---- */
  function bodyHTML(){
    var names = plNames(), songs = likedSongs(), albums = likedAlbumList(), artists = artistList();
    if(tab === 'songs'){
      var list = songs.map(function(s){ return { it:s, recent:lastOf(s.id), name:s.title } });
      list.sort(sort === 'az' ? byName : byRecent);
      if(!list.length) return '<div class="empty">No liked songs yet — tap the ♥ on any song and it lands here.</div>';
      return listHTML(list.map(function(x){ return x.it }));
    }
    if(tab === 'albums'){
      var al = albums.map(function(a){ return { a:a, recent:0, name:a.title } });
      if(sort === 'az') al.sort(byName);      /* 'recent' = the order they were liked, untouched */
      if(!al.length) return '<div class="empty">No liked albums yet — tap the ♥ on an album cover.</div>';
      return '<div class="libgrid">'+al.map(function(x){ return albumCardL(x.a) }).join('')+'</div>';
    }
    if(tab === 'artists'){
      var ar = artists.map(function(a){ return { a:a, recent:a.plays, name:a.name } });
      ar.sort(sort === 'az' ? byName : byRecent);
      if(!ar.length) return '<div class="empty">No artists yet — play something and they collect here.</div>';
      return '<div class="libgrid">'+ar.map(function(x){ return artistCardL(x.a) }).join('')+'</div>';
    }
    /* playlists: Liked music is always FIRST (it is an auto playlist, not a sorted row), then the
       user's own — Recently played = the newest play among the playlist's tracks. */
    var pl = names.map(function(n){
      var items = pls[n] || [], r = 0;
      items.forEach(function(it){ var t = lastOf(it && it.id); if(t > r) r = t });
      return { name:n, recent:r };
    });
    pl.sort(sort === 'az' ? byName : byRecent);
    return '<div class="libgrid">'+
      autoCard('liked', 'Liked music', 'Auto playlist · '+songs.length+(songs.length===1?' song':' songs'))+
      pl.map(function(x){ return plCard(x.name) }).join('')+'</div>'+
      (names.length ? '' : '<div class="libfoot">No playlists yet — “New playlist” in the sidebar creates one.</div>');
  }
  function headHTML(){
    return '<div class="libbar"><div class="chips">'+TABS.map(function(t){
        return '<button class="chip'+(t[0]===tab?' on':'')+'" data-libtab="'+t[0]+'" aria-pressed="'+(t[0]===tab?'true':'false')+'">'+t[1]+'</button>';
      }).join('')+'</div>'+
      '<div class="libsorts"><span class="lbl">Sort by</span>'+
        '<button class="chip'+(sort==='recent'?' on':'')+'" data-libsort="recent" aria-pressed="'+(sort==='recent'?'true':'false')+'">Recently played</button>'+
        '<button class="chip'+(sort==='az'?' on':'')+'" data-libsort="az" aria-pressed="'+(sort==='az'?'true':'false')+'">A–Z</button>'+
      '</div></div>';
  }
  function subHTML(){
    var n = plNames().length, s = likedSongs().length, a = likedAlbumCount(), r = artistList().length;
    return [n+(n===1?' playlist':' playlists'), s+(s===1?' song':' songs'), a+(a===1?' album':' albums'), r+(r===1?' artist':' artists')].join(' · ');
  }

  function openLibrary(which, how){
    if(which === 'playlists' || which === 'songs' || which === 'albums' || which === 'artists') tab = which;
    if(how === 'recent' || how === 'az') sort = how;
    showDyn('Library', subHTML(), headHTML() + bodyHTML());
    setNav('lib');
    /* the Songs tab paints real rows, so it must register its own context (same contract as
       openLiked) or a row click would play from a stale list; the other tabs hold no rows. */
    if(tab === 'songs'){ var items = likedSongs(); curList = items; register(items) } else { curList = [] }
    if(typeof skReveal === 'function'){ var d = document.getElementById('dynSec'); if(d) skReveal(d) }
    if(typeof refreshSidebar === 'function') refreshSidebar();
  }
  window.openLibrary = openLibrary;

  /* Both controls live INSIDE #dynSec, which openLibrary() rebuilds on every click — one delegated
     listener on the document survives that, and the re-render carries the new active chip. */
  document.addEventListener('click', function(e){
    var t = e.target; if(!t || !t.closest) return;
    var c = t.closest('[data-libtab]');
    if(c){ e.preventDefault(); openLibrary(c.getAttribute('data-libtab')); return }
    var s = t.closest('[data-libsort]');
    if(s){ e.preventDefault(); openLibrary(null, s.getAttribute('data-libsort')); return }
  });

  /* Un-liking an album from a card here must drop the card, exactly as the Liked-albums view
     does — the app's own heart handler only repaints hearts, so it would leave a stale card.
     That handler is a CAPTURE listener registered long before this layer and calls
     stopPropagation(), but capture listeners on the SAME node still all run (the v4bbjs block
     relies on the same rule), so this second capture listener re-renders right after it.
     Guarded on the Library actually being on screen so no other view is ever rebuilt. */
  document.addEventListener('click', function(e){
    var t = e.target; if(!t || !t.closest || !t.closest('[data-albheart]')) return;
    var dyn = document.getElementById('dynSec'), pt = document.getElementById('pgTitle');
    if(!dyn || dyn.hidden || !pt || String(pt.textContent||'').trim() !== 'Library' || tab !== 'albums') return;
    openLibrary();
  }, true);
})();
</script>

<style id="v5provcss">
/* ===== Wave 5 (UI-10) — the lyrics-provider pills + the mini bar's idle state =====
   Two small, independent fixes, both scoped to the PLAYER PAGE.

   (1) THE PROVIDER PILLS (Auto / YouTube Music / LRClib). They used to be part of the animated
   glass-button layer (.glb), whose chrome is GATED by html[data-gfx]: full ring + sheen + hover
   scale at medium/high, but flattened to background:var(--gf5) / border-color:var(--gf20) at low.
   That flattened pill is the look that got approved (the "Play all"-style pill on a dark
   surface), so the pills now OWN it as a plain style and are no longer marked .glb at all (see
   the FULL list in #v4glassjs — the two selectors were removed there). Nothing about them reads
   the graphics level any more, so all four levels render byte-for-byte the same pill.
   Type: 10.5px -> 12.5px, and the box grows with it (button padding 6/8 -> 7/11, trough 2 -> 3),
   i.e. a ~30px pill inside a ~36px trough instead of ~27px in ~31px.
   The trough is the Up-next rail's OWN surface (rgba(15,15,21,.5) + 1px var(--line)); the buttons
   sit ONE step brighter than it (--gf5 fill, --gf12 ring — --gf10/--gf20 on hover, --gf15/--gf25
   plus a top light when selected), so they read as part of the same family without dissolving
   into the trough. Blur sits on the trough only, and the app's own chrome (#sb, #mini) keeps
   backdrop-filter at every level, so this is not a new exception to the low-power rule.
   NOT part of the Text-size scale, by design: no rule for .lyrt/.lyra/.lyrchip exists in
   #v5typecss, so Settings -> Appearance -> Text size cannot resize these pills.

   (2) THE MINI PLAYER. "Nothing playing" is not a state the bar should occupy: it is now HIDDEN
   whenever no track is loaded (not deleted — same element, same handlers, no markup change) and
   slides up on its existing transition the moment one is. The switch is body.svtrack, written by
   #v5provjs; body:not(.svtrack) is also the BOOT state, so the empty bar can never flash before
   a script has run. visibility (delayed by the slide-out) keeps it out of the tab order too —
   pointer-events alone would leave its buttons keyboard-focusable. body.lyrfull is excluded on
   purpose: in fullscreen lyrics #mini IS the transport bar (Wave 4AO layer). */

/* ---- (1) the provider pills — one fixed look at every graphics level ---- */
.lyrchip{background:rgba(15,15,21,.5);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.lyrchip button{padding:7px 11px;font-size:12.5px;font-weight:700;letter-spacing:.3px;border-radius:999px;
  border:1px solid var(--gf12);background:var(--gf5);color:var(--dim);
  transition:background .15s ease,border-color .15s ease,color .15s ease}
.lyrchip button:hover{background:var(--gf10);border-color:var(--gf20);color:var(--tx)}
.lyrchip button.on{background:var(--gf15);border-color:var(--gf25);color:var(--tx);box-shadow:inset 0 1px 0 var(--gf5)}
body.lyrfull .lyrchip button{padding:7px 14px}   /* fullscreen bar: content-sized, a touch wider */

/* ---- (2) the mini bar's idle state ---- */
#mini{transition:opacity .22s ease,transform .3s cubic-bezier(.22,1,.36,1),visibility 0s linear}
body:not(.svtrack):not(.lyrfull) #mini{opacity:0;transform:translateY(110%);pointer-events:none;visibility:hidden;
  transition:opacity .22s ease,transform .3s cubic-bezier(.22,1,.36,1),visibility 0s linear .34s}
</style>

<script id="v5provjs">
/* ===== Wave 5 (UI-10) — body.svtrack: "a track is loaded" =====
   The mini bar's visibility is ONE boolean about the app's own state, so it is derived from
   nowItem() — the same function every surface reads — and written in exactly one place.
   Two chokepoints cover every path that can change it:
     setNowUI(it)    names a track (loadAt, plus the two late layers that re-set the UI);
     paintControls() runs on every play/pause AND on all three queue-clear paths, which are the
                     only places that take the track AWAY (#clearQ, removeFromQueue, and the
                     empty-queue branch in both the core block and the late layer).
   Both are WRAPPED, not replaced: the original runs first, the class is written after, and the
   return value is passed straight through. Writes are skipped when the value is unchanged, so a

<script id="v6oncjs">
/* ===== Wave 6 — first-run personalisation: the flow, the profile, and what it seeds =====
   STORAGE (two keys, both JSON through the app's own LSget/LSset):
     sv_profile          {v:1, langs:[], genres:[], artists:[{id,name,thumb}], at}
     sv_onboard_seen     1 once the flow was completed OR skipped — "skippable, once only"
   (A third key, sv_onboard_banner, belonged to the one-time Home offer wave 8 deleted. An old install
   may still carry it; nothing reads or writes it any more.)
   WHEN IT RUNS — WAVE 8: ONCE PER INSTALL, AS A GATE. Nothing in hist and no profile and not seen ⇒
   it opens during parsing, i.e. before the first paint, and covers the window at z 100 until the user
   leaves it by one of its OWN two buttons: Step 1's "Skip for now" (skipFlow) or "Continue to
   Artists" → "Finish Setup" (saveAndSeed). Both exits write sv_onboard_seen, so it cannot come back
   on a later launch — and there is now no OTHER door in: the Home banner ("Want better picks?") and
   the Settings row ("Personalise my taste / Redo") are both gone. A real data reset clears the
   profile and the seen flag, which is what brings the first-run path back.

   THE SEED, AND WHY IT IS TAGGED: the picks are written into `ml_history` — the store Listen again,
   Quick picks, Albums for you and the dice radio already read — because that is the only way Home
   fills without teaching those rows a second source of truth. Each seeded entry carries `seed:1`,
   and that tag is DROPPED the moment the track is really played (notePlay is wrapped below), so:
     • seeded picks feed taste scoring and the rails immediately;
     • the History page never claims you played something you did not (_4asHistItems is wrapped);
     • a re-run replaces only still-unplayed seeds, and a track you have genuinely played is never
       touched by the seeder (it skips any id already in hist).

   tag on a real play) and _4asHistItems (hide only still-tagged seeds). Nothing outside this block is
   edited — wave 8 also dropped the Settings-row injection it used to need, which was the only code
   here that touched a node it did not own.

   WAVE 6b gave the picked shelves a HANDOVER; WAVE 12 RE-CLOCKS IT ON TIME. A shelf is a STARTING
   POINT, so its OWN inactivity retires it — 14 days idle dims it, 21 days idle collapses it out and
   filters it for good — and any use of it (playing one of its tracks, from anywhere) resets its
   clock and puts it straight back to full opacity. The app's own rows are NEVER dimmed, collapsed or
   unmounted: `blendFeed()` builds no verdict for them at all and `applyBlend()` refuses any node that
   is not one of this block's shelves. `window.svaraPersonalise.state()` reports both halves.

   NOTE: the rails this wave adds are keyed by `data-oncq` on the WRAP, and these cards are played by
   this block's own listener rather than by the app's rail handler (which answers only 'al' / 'la' /
   'start' / the wave-7 'pop' / 'trend' and returns silently for anything else — an unknown ctx would
   be a dead click). The cards themselves are built by the app's own railCard(), so they carry the same
   `data-rail="onc"` the base layer writes: 'onc' matches no branch of the app's handler, on purpose.
   Building them by hand instead is what silently lost the clickable artist names on these rows. */

  var LANGS = ['English','Hindi','Punjabi','Tamil','Spanish','Korean','Japanese','French','German'];
  var VIBES = ['Lo-Fi Chill','Indie Pop','Hip Hop','Synthwave','Deep House','Acoustic','R&B','Techno',
               'Classical','Jazz','Metal','Neo-Soul','Ambient','Bollywood','EDM'];
  /* Three keys, all JSON through the app's own LSget/LSset. sv_onboard_banner is no longer read or
     written (wave 8 removed the Home offer that set it); an old install may still carry the key, and
     nothing reads it any more. */

  var MIN_ARTISTS=3, MAX_SEED_ARTISTS=6, SONGS_PER_ARTIST=5;

  var ICON = {
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.6l5.4 5.4L20 6.6"/></svg>',
    arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 5.5l6.5 6.5-6.5 6.5"/></svg>',
    back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 5.5L4.5 12l6.5 6.5"/></svg>',

  var rails = {};                  // shelf key -> items, for this block's own rail playback
  var railSeq = 0;
  var step = 1, open = false, busy = false, gridGen = 0, homeGen6 = 0, searchTimer = null;
  var root = null;

  var rowsNow = [];                 // the picked shelves painted by the CURRENT Home render

     math on that stamp: no play history, no session state, no DOM. */

  function touchedAt(key){ var m=touchMap(), v=m[key]; return (typeof v==='number' && v>0)?v:0 }

     way to see the 14/21-day thresholds without waiting three weeks for them. */
  function touch(key, at){
    if(!key) return 0;
    var m=touchMap(), ts=(typeof at==='number' && at>0)?at:Date.now();

    try{ LSset(KT,m) }catch(e){}

     this wave has no stamps at all, and reading a missing stamp as "infinitely old" would retire
     every shelf it owns on the first paint after the update. fillShelves stamps such a shelf with

     different on the day it crosses 14 days (otherwise the threshold does nothing a user could see),
     and it must not be at full brightness on the day it is due to leave. `dim` is the ramp position

    if(d >= DECAY.DIM_DAYS){
      var k=(d-DECAY.DIM_DAYS)/Math.max(1, DECAY.GONE_DAYS-DECAY.DIM_DAYS);
      return {key:key, days:days, verdict:'dim', dim:+k.toFixed(3),
              opacity:+(DECAY.DIM_TOP+(DECAY.DIM_FLOOR-DECAY.DIM_TOP)*k).toFixed(3)};
    }
    return {key:key, days:days, verdict:'keep', dim:0, opacity:1};
  }
  /* The shelf titles a profile produces — the SAME list fillShelves paints, so the stamps written at
     the moment the picks are made are exactly the rows that are about to appear. */
  function shelfKeys(p){
    var out=[];
    ((p&&p.genres)||[]).slice(0,2).forEach(function(g){ if(g) out.push(g) });
    ((p&&p.langs)||[]).slice(0,1).forEach(function(L){ if(L) out.push(L+' music') });
    if(p && (p.artists||[]).length) out.push('More like '+p.artists[0].name);
    return out;
  }
  function retiredMap(){ var m=LSget(KR,null); return (m && typeof m==='object')?m:{} }
  function setRetired(key){ var m=retiredMap(); if(m[key]) return; m[key]=1; try{ LSset(KR,m) }catch(e){} }
  function graduated(){ return !!LSget(KG,0) }
  /* THE FIXED ROWS, BY TITLE — every row on Home that is NOT one of this block's shelves (dynRows()
     already excludes .oncSec). Read-only, and exactly the list the console hook reports as protected:
     nothing in this block ever writes an opacity, a class or a removal to any node in it. */
  function fixedTitles(){
    return dynRows().map(function(n){
      var h=n.querySelector('h2');
      return h ? h.textContent.replace(/Play all|Show more/g,'').replace(/🎲[\s\S]*/,'').trim() : '';
    });
  }
  /* ---------- the console hook's state: every shelf's age and verdict, and the protected rows ---------- */
  function feedState(){
    var now=Date.now(), ret=retiredMap();
    return { now:now, day:DECAY.DAY,
             thresholds:{dim:DECAY.DIM_DAYS, gone:DECAY.GONE_DAYS, top:DECAY.DIM_TOP, floor:DECAY.DIM_FLOOR},
             graduated:graduated(), fixed:fixedTitles(),
             rows:rowsNow.map(function(r){
               var v=verdictOf(r.key, now);
               return {key:r.key, items:(r.items||[]).length, touchedAt:touchedAt(r.key), days:v.days,
                       verdict:ret[r.key]?'retired':v.verdict, opacity:v.opacity};
             }) };
  }

  /* ===== THE BLENDING FUNCTION — pure: no DOM, no fetch, no writes =====
     dynamic : the app's OWN rows, as opaque tokens in the order the app rendered them.
     rows    : this block's picked shelves, [{key,title,items,node}].
     st      : {now (ms, defaulted to now), retired ({key:1})} — the clock and nothing else.
     Returns every picked shelf's verdict, keyed to the request the user made:
       keep    → painted at `opacity` (1 until the shelf is DIM_DAYS old, dimmed after that)
       retire  → painted once with the exit animation, then unmounted for good
       dropped → not painted at all (it retired on an earlier pass — retirement is permanent)
     ABSOLUTELY PROTECTED FIXED ROWS. `dynamic` comes back as `guard`, and that is structural rather
     than conditional: no keep/retire/dropped entry is ever built for a row in it, so there is no code
     path below that could dim, collapse or unmount one — Listen again, Quick picks, Trending songs,
     Popular right now, Albums for you and Surprise me are not "skipped by a check", they are never
     inputs to one. The only keys verdictOf() is ever asked about are the picked shelves' own titles,
     and a picked node that somehow arrived inside `dynamic` is reported in `misplaced` and left
     ALONE rather than judged. Nothing here reads storage or the clock twice, so the same inputs
     always give the same plan. */
  function blendFeed(dynamic, rows, st){
    dynamic = dynamic || []; rows = rows || []; st = st || {};
    var keep=[], retire=[], dropped=[], guard=[], misplaced=[];
    dynamic.forEach(function(r){                    // the app's rows: pass-through, never judged
      if(r && r.classList && r.classList.contains('oncSec')) misplaced.push(r);
      else guard.push(r);
    });
    var ret = st.retired || {}, now = st.now;
    rows.forEach(function(r){
      if(ret[r.key]){ dropped.push({row:r, key:r.key, reason:'retired'}); return }   // permanent
      var v = verdictOf(r.key, now);
      if(v.verdict==='retire') retire.push({row:r, key:r.key, days:v.days, verdict:'retire', deg:1, opacity:0});
      else keep.push({row:r, key:r.key, days:v.days, verdict:v.verdict, deg:v.dim, opacity:v.opacity});
    });
    var picked = keep.concat(retire);               // whatever is leaving, leaves last
    return { order:dynamic.slice().concat([PICKED]), keep:keep, retire:retire, dropped:dropped,
             guard:guard, misplaced:misplaced, fixedCount:guard.length, refusedCount:0,
             dynamicCount:dynamic.length, pickedCount:picked.length };
  }

  var profile = LSget(KP, null) || null;
  function seen(){ return !!LSget(KS, 0) }
  function setSeen(v){ LSset(KS, v?1:0) }
  function histEmpty(){ try{ return !Object.keys(hist||{}).length }catch(e){ return true } }

  function syncCounts(){
    var c1=el('oncCount1');
    if(c1) c1.textContent = (sel.langs.length+sel.genres.length) ? (sel.langs.length+sel.genres.length)+' selected' : '';
    var vc=el('oncVibeCount'); if(vc) vc.textContent = sel.genres.length+' selected';
    var c2=el('oncCount2'); if(c2) c2.textContent = sel.artists.length+' '+(sel.artists.length===1?'artist':'artists')+' selected';
